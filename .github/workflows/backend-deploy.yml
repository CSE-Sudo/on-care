name: Backend Deploy (ECR + ECS Express Mode)

# 배포 job 은 기본적으로 꺼져 있다. 인프라 스택(infra/backend-*.yml)을 #480 에서 적용하고
# 아래 변수를 채운 뒤 Repository Variable BACKEND_DEPLOY_ENABLED=true 로 켠다.
# 절차는 backend/docs/DEPLOY.md 에 있다.
#
# 흐름(#3016, #3019)
#   resolve → build(이미지 한 번 빌드, digest 고정)
#     → deploy-staging(BACKEND_STAGING_DEPLOY_ENABLED=true 일 때만)
#     → deploy-production(GitHub Environment "production" 승인 뒤)
#   staging 이 켜져 있으면 staging 이 통과해야 운영으로 간다. 두 환경은 같은 digest 를 쓴다.
#   각 환경 배포는 실패하면 직전 이미지로 되돌린다(backend-deploy-service.yml).
#   자동 실행은 운영 백엔드에 떠 있는 커밋과 같거나 그보다 옛 커밋이면 resolve 에서 멈추고
#   나머지를 건너뛴다(#3254). 수동 실행은 되돌리기를 위해 보지 않는다.
#
# Repository Variables
#   BACKEND_DEPLOY_ENABLED            true 일 때만 동작
#   BACKEND_STAGING_DEPLOY_ENABLED    true 면 운영 전에 staging 을 먼저 배포·검증
#   AWS_BACKEND_REGION                배포 리전(기본 ap-southeast-1 — Neon DB 와 같은 리전)
#   AWS_BACKEND_IMAGE_PUSH_ROLE_ARN   이미지 푸시 역할(infra/backend-bootstrap.yml 출력)
# Environment Variables(production·staging 각각)
#   AWS_BACKEND_DEPLOY_ROLE_ARN       환경별 배포 역할(infra/backend-environment.yml 출력)
#   AWS_BACKEND_CFN_ROLE_ARN          CloudFormation 서비스 역할(같은 스택 출력)
#   BACKEND_STACK_NAME                서비스 스택 이름(기본 oncare-backend-<environment>)
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Backend CI를 통과한 main 커밋의 전체 SHA(40자). 이전 커밋을 넣으면 그 커밋으로 되돌린다"
        required: true
        type: string
      target:
        description: "배포 대상"
        required: true
        default: all
        type: choice
        options:
          - all
          - staging
          - production

permissions:
  actions: read
  contents: read

# 진행 중인 배포를 취소하지 않고 한 번에 하나씩 실행한다.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_BACKEND_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: oncare-backend

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: >-
      ${{ vars.BACKEND_DEPLOY_ENABLED == 'true' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      target: ${{ steps.target.outputs.target }}
      deploy: ${{ steps.live.outputs.deploy }}
    steps:
      - name: Resolve and verify deploy commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          MANUAL_SHA: ${{ inputs.sha }}
          MANUAL_TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_EVENT" != "push" ] ||
               [ "$WORKFLOW_RUN_BRANCH" != "main" ] ||
               [ "$WORKFLOW_RUN_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::자동 배포는 동일 저장소의 main push Backend CI만 허용합니다."
              exit 1
            fi
            TARGET_SHA="$WORKFLOW_RUN_SHA"
            TARGET=all
          else
            TARGET_SHA="$MANUAL_SHA"
            TARGET="${MANUAL_TARGET:-all}"
          fi
          TARGET_SHA=$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')

          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::배포 SHA는 40자리 전체 커밋 SHA여야 합니다."
            exit 1
          fi
          case "$TARGET" in
            all|staging|production) ;;
            *) echo "::error::알 수 없는 배포 대상: $TARGET"; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MATCHES=$(gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/backend-ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$TARGET_SHA" \
              -f per_page=100 \
              --jq '[.workflow_runs[] |
                select(
                  .head_sha == "'"$TARGET_SHA"'" and
                  .head_branch == "main" and
                  .event == "push" and
                  .conclusion == "success"
                )
              ] | length')
            if [ "$MATCHES" -lt 1 ]; then
              echo "::error::$TARGET_SHA에 대한 main Backend CI 성공 기록이 없습니다."
              exit 1
            fi
          fi

          {
            echo "sha=$TARGET_SHA"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "Verified deploy commit: $TARGET_SHA (target: $TARGET)"

      # 자동 실행이 운영에 이미 떠 있는 커밋이나 그보다 옛 커밋을 다시 올리지 않게 한다(#3254).
      # 취소된 main Backend CI 를 나중에 Re-run 하면 그 완료가 옛 커밋 배포를 부른다. 운영 백엔드
      # `<API_BASE_URL>/version` 의 commit_sha 를 읽어, 대상이 그 커밋과 같거나 조상이면 이미지
      # 빌드부터 모두 건너뛴다(실패가 아니다). staging 도 함께 건너뛴다. 수동 실행은 사람이 일부러
      # 되돌리는 경우라 보지 않는다. checkout 은 main(GITHUB_SHA)이라 스크립트는 언제나 최신이다.
      - name: Checkout repository
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 종료 코드 20 이 건너뜀이다. `bash -e` 에서도 분기에 닿도록 `|| code=$?` 로 받는다(#3235).
      - name: Skip a commit that is already live or older
        id: live
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "수동 실행이라 운영 백엔드와의 선후를 보지 않습니다(되돌리기 허용)."
            exit 0
          fi
          code=0
          bash .github/scripts/deploy_freshness.sh backend "$API_BASE_URL" "$SHA" > "$RUNNER_TEMP/freshness.txt" || code=$?
          cat "$RUNNER_TEMP/freshness.txt"
          case "$code" in
            0)
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            20)
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "::notice::운영 백엔드에 이미 같은 커밋이나 더 새 커밋이 떠 있어 이 자동 배포를 건너뜁니다."
              {
                echo "### Backend deployment skipped"
                echo "- Commit: \`$SHA\`"
                echo "- Live backend: \`$(sed -n 's/^live_sha=//p' "$RUNNER_TEMP/freshness.txt")\` ($(sed -n 's/^state=//p' "$RUNNER_TEMP/freshness.txt"))"
                echo "- 이유: 자동 실행의 대상이 운영에 떠 있는 커밋과 같거나 그보다 옛 커밋입니다(#3254). 되돌리려면 Run workflow 에 그 SHA 를 넣어 수동으로 실행합니다."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "$code"
              ;;
          esac

  # 운영에 이미 같은 커밋이나 더 새 커밋이 떠 있는 자동 실행이면 여기서부터 모두 건너뛴다(#3254).
  build:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.identifier }}
    steps:
      # 배포 권한(OIDC)을 쓰는 외부 action은 불변 커밋 SHA로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check image push role
        env:
          PUSH_ROLE: ${{ vars.AWS_BACKEND_IMAGE_PUSH_ROLE_ARN }}
        run: |
          if [ -z "$PUSH_ROLE" ]; then
            echo "::error::Repository Variable AWS_BACKEND_IMAGE_PUSH_ROLE_ARN 이 없습니다(infra/backend-bootstrap.yml 출력, #480)."
            exit 1
          fi

      # 이미지 푸시 역할은 ECR 쓰기만 가진다. 서비스는 바꾸지 못한다(#3019).
      - name: Configure AWS credentials (image push)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # 태그는 불변이다. 같은 커밋을 다시 배포(되돌리기 포함)하면 새로 빌드하지 않고
      # 이미 올라간 이미지의 digest 를 그대로 쓴다.
      - name: Build and push immutable image
        id: image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          digest_of() {
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$SHA" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          }

          if DIGEST=$(digest_of 2> "$RUNNER_TEMP/describe.err"); then
            echo "이미 올라간 이미지를 씁니다: $SHA"
          elif grep -q ImageNotFoundException "$RUNNER_TEMP/describe.err"; then
            TAGGED_IMAGE="$REGISTRY/$ECR_REPOSITORY:$SHA"
            # 커밋 SHA 를 이미지에 넣는다(#3029) — /v1/version·/v1/healthz 의 commit_sha 와
            # Sentry release 가 이 값을 쓰고, 배포 뒤 검증 단계가 배포한 SHA 와 대조한다.
            docker build \
              --build-arg GIT_SHA="$SHA" \
              --label org.opencontainers.image.revision="$SHA" \
              -t "$TAGGED_IMAGE" .
            docker push "$TAGGED_IMAGE"
            DIGEST=$(digest_of)
          else
            cat "$RUNNER_TEMP/describe.err" >&2
            echo "::error::ECR 이미지 조회에 실패했습니다."
            exit 1
          fi

          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR 이미지 digest를 확인하지 못했습니다: $DIGEST"
            exit 1
          fi

          IMAGE_IDENTIFIER="$REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "identifier=$IMAGE_IDENTIFIER" >> "$GITHUB_OUTPUT"
          echo "Immutable image: $IMAGE_IDENTIFIER"

  deploy-staging:
    needs: [resolve, build]
    if: >-
      ${{ vars.BACKEND_STAGING_DEPLOY_ENABLED == 'true' &&
          needs.resolve.outputs.target != 'production' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-deploy-service.yml
    with:
      environment: staging
      expected_env: staging
      image: ${{ needs.build.outputs.image }}
      sha: ${{ needs.resolve.outputs.sha }}

  # staging 이 꺼져 있거나(skipped) 통과했을 때만. staging 실패·취소면 운영으로 가지 않는다.
  deploy-production:
    needs: [resolve, build, deploy-staging]
    if: >-
      ${{ !cancelled() &&
          needs.build.result == 'success' &&
          (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
          needs.resolve.outputs.target != 'staging' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-deploy-service.yml
    with:
      environment: production
      expected_env: prod
      image: ${{ needs.build.outputs.image }}
      sha: ${{ needs.resolve.outputs.sha }}
