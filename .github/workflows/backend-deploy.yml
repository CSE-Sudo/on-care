name: Backend Deploy (ECR + App Runner)

# 배포 job은 기본적으로 비활성화된다. 배포 플랫폼과 인프라가 준비된 뒤
# Repository Variable BACKEND_DEPLOY_ENABLED=true를 설정하면 활성화된다.
# 현재 구현은 AWS ECR + App Runner 전용이며 최종 플랫폼 결정 후 바뀔 수 있다.
# AWS 사용 시 필요한 GitHub Secrets:
#   AWS_DEPLOY_ROLE_ARN   OIDC로 assume할 IAM 역할 ARN
#   APPRUNNER_SERVICE_ARN 배포 대상 App Runner 서비스 ARN
# Repository Variables(선택):
#   AWS_BACKEND_REGION    배포 리전(기본 ap-southeast-1)
#   BACKEND_EXPECTED_ENV  배포 뒤 /v1/healthz 의 env 기대값(기본 prod, #2821)
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Backend CI를 통과한 main 커밋의 전체 SHA(40자)"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

# 진행 중인 배포를 취소하지 않고 한 번에 하나씩 실행한다.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  # Keep App Runner and the Neon database in Singapore to avoid cross-region
  # latency and data transfer for the demo environment.
  AWS_REGION: ${{ vars.AWS_BACKEND_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: oncare-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{ vars.BACKEND_DEPLOY_ENABLED == 'true' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    steps:
      - name: Resolve and verify deploy commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          MANUAL_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_EVENT" != "push" ] ||
               [ "$WORKFLOW_RUN_BRANCH" != "main" ] ||
               [ "$WORKFLOW_RUN_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::자동 배포는 동일 저장소의 main push Backend CI만 허용합니다."
              exit 1
            fi
            TARGET_SHA="$WORKFLOW_RUN_SHA"
          else
            TARGET_SHA="$MANUAL_SHA"
          fi
          TARGET_SHA=$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')

          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::배포 SHA는 40자리 전체 커밋 SHA여야 합니다."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MATCHES=$(gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/backend-ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$TARGET_SHA" \
              -f per_page=100 \
              --jq '[.workflow_runs[] |
                select(
                  .head_sha == "'"$TARGET_SHA"'" and
                  .head_branch == "main" and
                  .event == "push" and
                  .conclusion == "success"
                )
              ] | length')
            if [ "$MATCHES" -lt 1 ]; then
              echo "::error::$TARGET_SHA에 대한 main Backend CI 성공 기록이 없습니다."
              exit 1
            fi
          fi

          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified deploy commit: $TARGET_SHA"

      # 배포 권한(OIDC)을 쓰는 외부 action은 불변 커밋 SHA로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push immutable image
        id: image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          TAGGED_IMAGE="$REGISTRY/$ECR_REPOSITORY:$SHA"
          # 커밋 SHA 를 이미지에 넣는다(#3029) — /v1/version·/v1/healthz 의 commit_sha 와
          # Sentry release 가 이 값을 쓰고, 아래 검증 단계가 배포한 SHA 와 대조한다.
          docker build --build-arg "GIT_SHA=$SHA" -t "$TAGGED_IMAGE" .
          docker push "$TAGGED_IMAGE"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR 이미지 digest를 확인하지 못했습니다: $DIGEST"
            exit 1
          fi

          IMAGE_IDENTIFIER="$REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "identifier=$IMAGE_IDENTIFIER" >> "$GITHUB_OUTPUT"
          echo "Pushed immutable image: $IMAGE_IDENTIFIER"

      - name: Update App Runner source and wait for operation
        id: apprunner
        env:
          SVC: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          IMAGE_IDENTIFIER: ${{ steps.image.outputs.identifier }}
        run: |
          set -euo pipefail

          SOURCE_FILE="$RUNNER_TEMP/source-configuration.json"
          aws apprunner describe-service \
            --service-arn "$SVC" \
            --query 'Service.SourceConfiguration' \
            --output json |
            jq --arg image "$IMAGE_IDENTIFIER" '
              if .ImageRepository == null then
                error("App Runner service is not configured with ImageRepository")
              else
                .ImageRepository.ImageIdentifier = $image
                | .AutoDeploymentsEnabled = false
              end
            ' > "$SOURCE_FILE"

          OP=$(aws apprunner update-service \
            --service-arn "$SVC" \
            --source-configuration "file://$SOURCE_FILE" \
            --query OperationId \
            --output text)
          if [ -z "$OP" ] || [ "$OP" = "None" ]; then
            echo "::error::App Runner update-service OperationId를 받지 못했습니다."
            exit 1
          fi
          echo "Started App Runner operation: $OP"

          for i in $(seq 1 40); do
            STATUS=$(aws apprunner list-operations \
              --service-arn "$SVC" \
              --query "OperationSummaryList[?Id=='$OP'].Status | [0]" \
              --output text)
            echo "[$i] operation $OP status: $STATUS"
            case "$STATUS" in
              SUCCEEDED)
                break
                ;;
              PENDING|IN_PROGRESS|None|"")
                if [ "$i" -eq 40 ]; then
                  echo "::error::App Runner 작업이 제한 시간 안에 완료되지 않았습니다."
                  exit 1
                fi
                sleep 15
                ;;
              FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "::error::App Runner 작업 실패: $STATUS (OperationId: $OP)"
                exit 1
                ;;
              *)
                echo "::error::알 수 없는 App Runner 작업 상태: $STATUS"
                exit 1
                ;;
            esac
          done

          DEPLOYED_IMAGE=$(aws apprunner describe-service \
            --service-arn "$SVC" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text)
          if [ "$DEPLOYED_IMAGE" != "$IMAGE_IDENTIFIER" ]; then
            echo "::error::App Runner 이미지 불일치: expected=$IMAGE_IDENTIFIER actual=$DEPLOYED_IMAGE"
            exit 1
          fi

          URL=$(aws apprunner describe-service \
            --service-arn "$SVC" \
            --query 'Service.ServiceUrl' \
            --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # 배포된 서비스가 **어떤 설정으로 떴는지** 확인한다(#2821). 백엔드의 안전장치
      # (데모 폴백 차단·JWT/CORS 검사)는 ENV=prod 일 때만 켜지는데, 서비스 환경변수에
      # ENV 를 빠뜨려도 기동은 되므로 healthz 응답만으로는 알 수 없었다.
      # 기대 환경은 저장소 변수 BACKEND_EXPECTED_ENV(기본 prod)로 정한다 — 데모 시연
      # 서비스를 따로 이 워크플로로 배포한다면 그 저장소 변수를 staging 으로 둔다.
      # 운영이면 채팅 첨부 저장소가 s3 인지도 본다(#3029). 판정은 스크립트 하나에 모아
      # PR 게이트가 경계를 시험한다(.github/scripts/test_verify_backend_health.sh).
      - name: Verify running configuration (healthz)
        env:
          URL: ${{ steps.apprunner.outputs.url }}
          EXPECTED_ENV: ${{ vars.BACKEND_EXPECTED_ENV || 'prod' }}
        run: |
          set -euo pipefail
          BODY=""
          for i in $(seq 1 10); do
            if BODY=$(curl -fsS --max-time 10 "https://$URL/v1/healthz"); then
              break
            fi
            BODY=""
            echo "healthz not ready, retry $i"
            sleep 10
          done
          if [ -z "$BODY" ]; then
            echo "::error::배포 후 /v1/healthz가 응답하지 않습니다."
            exit 1
          fi
          echo "healthz: $BODY"
          printf '%s' "$BODY" | bash .github/scripts/verify_backend_health.sh healthz "$EXPECTED_ENV"

      # 이미지 digest 가 맞아도 요청을 받는 프로세스가 옛 인스턴스일 수 있다. 실제 응답의
      # commit_sha 가 배포한 커밋인지 본다(#3029).
      - name: Verify deployed commit (version)
        env:
          URL: ${{ steps.apprunner.outputs.url }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --max-time 10 "https://$URL/v1/version")
          echo "version: $BODY"
          printf '%s' "$BODY" | bash .github/scripts/verify_backend_health.sh version "$SHA"

      # healthz 는 프로세스만 본다(App Runner 헬스체크도 healthz 다 — DB 일시 장애로
      # 인스턴스를 갈아 치우지 않게). DB 까지 닿는지는 배포 직후 readyz 로 따로 본다(#2912).
      - name: Verify database reachability (readyz)
        env:
          URL: ${{ steps.apprunner.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            if BODY=$(curl -fsS --max-time 10 "https://$URL/v1/readyz"); then
              STATUS=$(printf '%s' "$BODY" | jq -r '.status // "missing"')
              if [ "$STATUS" = "ready" ]; then
                echo "readyz OK"
                exit 0
              fi
            fi
            echo "readyz not ready, retry $i"
            sleep 10
          done
          echo "::error::배포 후 /v1/readyz 가 ready 를 돌려주지 않습니다 — DATABASE_URL·DB 보안 그룹·DB 상태를 확인하세요."
          exit 1
