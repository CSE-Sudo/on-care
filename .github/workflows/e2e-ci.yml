name: E2E CI

# 실 API E2E 스위트(`tool/run_*_e2e.sh`)를 PR 마다 돌린다. (#796)
#
# 이 스위트들은 `test/` 밖의 `test_e2e/` 에 있어 두 앱 CI 의 `flutter test` 에 잡히지
# 않는다. 백엔드가 필요해서 그렇게 뒀는데, 그 결과 **사람이 기억해서 로컬에서 돌릴
# 때만** 검증됐다. 실제로 그 대가를 세 번 치렀다.
#
#  * main 의 `create-slot` 이 깨진 채 남아 있었는데 아무도 몰랐다
#  * 그 수정 커밋이 머지에서 누락된 것도 브랜치 정리 중 우연히 발견했다(#779)
#  * #779 자체도 실행 검증 없이 올라갔다
#
# 브라우저는 필요 없다. `IntegrationTestWidgetsFlutterBinding` 을 `flutter test` 로
# 돌리는 구조라 ChromeDriver 없이 백엔드만 있으면 된다.

on:
  # paths 필터를 두지 않는다. 이 게이트의 목적은 **모든 PR**에서 E2E 가 도는 것인데,
  # 필터를 걸면 목록 밖의 변경이 스위트를 깨도 그대로 통과한다. 실제로 이 스위트를
  # 깨뜨린 변경들이 그런 종류였다 — 트레이너 웹 리팩터가 채팅 진입 경로를 옮겼고,
  # 백엔드 계약 축소가 상담 요청을 거부하게 만들었다.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  # PR 실행만 취소한다. 같은 브랜치에 새 커밋이 오면 옛 실행은 볼 값이 없다.
  #
  # main 은 취소하지 않는다(`cancel-in-progress: false`) — 진행 중인 실행은 끝까지 돈다(#807, #1547).
  # 다만 GitHub 은 그룹마다 대기 실행을 하나만 두고 새 실행이 오면 대기 중이던 것을 취소한다.
  # 앞 실행이 도는 동안 세 번 이상 연달아 병합하면 가운데 커밋의 실행은 취소되고, 그 변경을 담은
  # 마지막 커밋만 검증된다(#3237). 이 워크플로의 완료가 운영 프런트 배포(aws-frontend-deploy.yml) 를 부르지만,
  # 배포는 자동 실행일 때 운영에 떠 있는 커밋과 같거나 그보다 옛 커밋이면 건너뛴다(#3254). 그래서
  # 취소된 가운데 커밋의 실행을 나중에 다시 돌려도 운영이 뒤로 가지 않는다. 그룹은 커밋마다
  # 나누지 않고 그대로 둔다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 스위트는 서로의 데이터를 보지 않으므로 스위트마다 잡을 따로 띄워 동시에 돌린다(#3321).
  # 잡마다 자기 DB·백엔드를 갖는다 — 한 백엔드를 나눠 쓰면 동시에 도는 스위트끼리 데모
  # 계정의 일정·대화를 건드려 서로의 단언을 깬다.
  suites:
    name: Find E2E suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.find.outputs.runners }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find suite runners
        id: find
        run: |
          set -euo pipefail
          # 러너를 글롭으로 찾는다. 스위트가 늘어도(#640 의 상담처럼) 이 파일을 고칠
          # 필요가 없다 — `tool/run_<이름>_e2e.sh` 규약만 지키면 자동으로 포함된다.
          shopt -s nullglob
          runners=(tool/run_*_e2e.sh)
          if [ ${#runners[@]} -eq 0 ]; then
            echo "::error::tool/run_*_e2e.sh 를 하나도 찾지 못했습니다."
            exit 1
          fi
          echo "실행할 스위트: ${runners[*]}"
          json=$(printf '%s\n' "${runners[@]##*/}" | jq -R . | jq -cs .)
          echo "runners=$json" >> "$GITHUB_OUTPUT"

  suite:
    name: E2E suite (${{ matrix.runner }})
    needs: suites
    runs-on: ubuntu-latest
    # 스위트 상한(E2E_SUITE_TIMEOUT) 15분 + 준비(백엔드 기동·Flutter 설치)에 여유를 더해 잡는다.
    timeout-minutes: 30
    strategy:
      # 하나가 실패해도 나머지를 마저 돌린다. 첫 실패에서 멈추면 한 번의 CI 로
      # 얻을 수 있는 정보가 스위트 하나로 줄어든다.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.suites.outputs.runners) }}

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oncare
          POSTGRES_PASSWORD: oncare
          POSTGRES_DB: oncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://oncare:oncare@localhost:5432/oncare
      # 러너 시간대를 KST 로 고정한다. `backend/docker-compose.yml` 이 앱에 걸어 둔
      # `TZ: Asia/Seoul` 과 같은 이유다 — 서버는 트레이너 일정의 날짜·시각을 **항상**
      # 서울 기준으로 찍는데(`reservation_service.reserve`), 러너가 UTC 면 스위트가
      # 보는 벽시계와 9시간 어긋난다. 화면에 보이는 '오늘/어제' 라벨도 마찬가지다.
      TZ: Asia/Seoul
      # CI 에는 Gemini 키가 없다. 켜 두면 기동할 때마다 임베딩이 터져 백엔드 로그가
      # `GEMINI_API_KEY 가 설정되지 않았습니다` 로 뒤덮이고, 진짜 실패 원인이 묻힌다.
      # 어느 스위트도 AI 코치 근거를 단언하지 않는다.
      SEED_RAG_INGEST: "false"
      # 데모 계정(트레이너·회원)이 있어야 스위트가 로그인할 수 있다.
      SEED_DEMO_DATA: "true"
      # 운영처럼 Alembic 이 만든 스키마로만 띄운다(#2838). create_all 이 켜져 있으면
      # 마이그레이션에 빠진 테이블을 기동이 대신 만들어 줘 E2E 가 그 누락을 못 본다.
      AUTO_CREATE_TABLES: "false"
      # 스위트는 한 번 돌 때 로그인을 여러 번 한다 — 단계마다 로그아웃 상태에서
      # 부팅하고, 픽스처가 다른 계정으로 또 붙는다. 기본 한도는 IP·엔드포인트당
      # 분당 10회라 그대로 두면 로그인이 429 로 막히고, 화면에서는 "로그인 화면에서
      # 안 넘어감" 으로만 보인다.
      RATE_LIMIT_ENABLED: "false"
      # 하네스가 `POST /auth/register` 로 회원을 바로 만든다(test_e2e/support). 가입 이메일
      # 인증(#3038)은 메일함이 없는 러너에서 코드를 받을 수 없으므로 끈다 — ENV=dev 라
      # 허용된다(운영은 끌 수 없다). 인증 흐름은 백엔드 테스트가 확인한다.
      SIGNUP_EMAIL_VERIFICATION: "false"
      API_BASE_URL: http://localhost:8000/v1
      # 이 잡이 맡은 러너 파일명. 셸에 식을 직접 끼우지 않고 환경 변수로 넘긴다.
      E2E_RUNNER: ${{ matrix.runner }}
      # 아직 통과하지 못하는 스위트. **돌리기는 하되** 실패해도 잡을 막지 않는다.
      # 건너뛰지 않는 이유는 두 가지다 — 상태가 계속 보이고, 고쳐져서 통과하기
      # 시작하면 바로 알 수 있다. 지금은 비어 있다(#837 이 #872 로 닫혔다).
      # 격리할 때는 러너 파일명을 공백으로 구분해 적고, 풀 때는 이름만 지운다. 격리한
      # 스위트의 잡은 실패해도 초록으로 끝나고 경고만 남긴다.
      E2E_QUARANTINE: ""
      # 스위트 하나당 상한. 실패가 아니라 **매달림**을 끊는 장치다 — 격리한 스위트가
      # 27분을 붙잡고 있다가 잡 타임아웃에 걸리면, 격리해 둔 의미가 없어진다.
      # 정상 실행은 채팅 기준 90초 남짓이라 15분이면 충분히 여유롭다.
      E2E_SUITE_TIMEOUT: 15m

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # 이동 가능한 태그(@v5)는 쓰지 않는다 — 태그가 옮겨지면 검토하지 않은
        # action 코드가 CI 에서 돈다. 다른 스텝들과 같이 커밋 SHA 로 고정한다.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 운영 이미지·백엔드 CI 와 같은 버전을 한 곳에서 읽는다(#2837).
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: |
          set -euo pipefail
          # 시드는 앱 기동 훅에서 돈다(`main.py` → `init_db()`). 그래서 마이그레이션만
          # 돌리고 끝내면 데모 계정이 없다 — 반드시 서버를 띄워야 한다.
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for backend
        run: |
          set -euo pipefail
          # 첫 기동은 시드(공공 식품 DB·데모 데이터·RAG 적재)까지 하므로 시간이 걸린다.
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 "$API_BASE_URL/healthz" >/dev/null; then
              echo "backend ready after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::백엔드가 10분 안에 뜨지 않았습니다."
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # 두 앱 CI 와 같은 버전으로 고정한다. 새 stable 이 나온 순간 아무도 코드를
          # 건드리지 않았는데 깨지는 일을 막는다(#659).
          flutter-version: '3.44.9'
          cache: true

      - name: Install Flutter dependencies
        run: |
          set -euo pipefail
          (cd frontend/flutter && flutter pub get)
          (cd frontend/flutter_trainer && flutter pub get)

      - name: Run E2E suite
        run: |
          set -euo pipefail
          r="tool/$E2E_RUNNER"
          if [ ! -f "$r" ]; then
            echo "::error::$r 를 찾지 못했습니다."
            exit 1
          fi
          quarantined=false
          case " $E2E_QUARANTINE " in
            *" $E2E_RUNNER "*) quarantined=true ;;
          esac

          # `timeout` 으로 감싸는 이유: 스위트가 매달리면 잡 타임아웃까지 러너를 붙잡는다.
          # 실제로 상담이 27분을 붙잡은 적이 있다.
          if timeout --signal=TERM --kill-after=30s "$E2E_SUITE_TIMEOUT" bash "$r"; then
            if [ "$quarantined" = true ]; then
              # 격리한 스위트가 통과하기 시작하면 알려 준다. 그대로 두면 고쳐진 뒤에도
              # 아무도 격리를 풀지 않는다.
              echo "::warning::[격리] $E2E_RUNNER 이 통과했습니다. E2E_QUARANTINE 에서 빼 주세요."
            else
              echo "✅ $r"
            fi
          else
            rc=$?
            [ "$rc" -ge 124 ] && echo "::warning::$E2E_RUNNER 이 $E2E_SUITE_TIMEOUT 안에 끝나지 않아 중단했습니다."
            if [ "$quarantined" = true ]; then
              echo "::warning::[격리] $E2E_RUNNER 이 실패했습니다. 알려진 문제라 잡을 막지 않습니다."
            else
              echo "::error::$r 실패 (exit $rc)"
              exit 1
            fi
          fi

      - name: Backend log (on failure)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/backend.log" || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
          fi

  # 예전 체크 이름을 그대로 가진 결과 잡. 스위트 잡은 스위트 수만큼 생기고 이름도 바뀌므로,
  # 체크 하나로 전체 결과를 읽을 수 있게 모은다. 스위트를 못 찾았거나 하나라도
  # 실패·취소·건너뜀이면 실패한다.
  e2e:
    name: Real-API E2E (member app + trainer web)
    needs: [suites, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite to pass
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          set -euo pipefail
          echo "suites=${SUITES_RESULT} suite=${SUITE_RESULT}"
          if [ "${SUITES_RESULT}" != success ] || [ "${SUITE_RESULT}" != success ]; then
            echo "::error::E2E 스위트를 찾지 못했거나 통과하지 못한 스위트가 있습니다. 위 잡의 로그를 확인하세요."
            exit 1
          fi
