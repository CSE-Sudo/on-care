name: E2E CI

# 실 API E2E 스위트(`tool/run_*_e2e.sh`)를 PR 마다 돌린다. (#796)
#
# 이 스위트들은 `test/` 밖의 `test_e2e/` 에 있어 두 앱 CI 의 `flutter test` 에 잡히지
# 않는다. 백엔드가 필요해서 그렇게 뒀는데, 그 결과 **사람이 기억해서 로컬에서 돌릴
# 때만** 검증됐다. 실제로 그 대가를 세 번 치렀다.
#
#  * main 의 `create-slot` 이 깨진 채 남아 있었는데 아무도 몰랐다
#  * 그 수정 커밋이 머지에서 누락된 것도 브랜치 정리 중 우연히 발견했다(#779)
#  * #779 자체도 실행 검증 없이 올라갔다
#
# 브라우저는 필요 없다. `IntegrationTestWidgetsFlutterBinding` 을 `flutter test` 로
# 돌리는 구조라 ChromeDriver 없이 백엔드만 있으면 된다.

on:
  # paths 필터를 두지 않는다. 이 게이트의 목적은 **모든 PR**에서 E2E 가 도는 것인데,
  # 필터를 걸면 목록 밖의 변경이 스위트를 깨도 그대로 통과한다. 실제로 이 스위트를
  # 깨뜨린 변경들이 그런 종류였다 — 트레이너 웹 리팩터가 채팅 진입 경로를 옮겼고,
  # 백엔드 계약 축소가 상담 요청을 거부하게 만들었다.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  # PR 실행만 취소한다. 같은 브랜치에 새 커밋이 오면 옛 실행은 볼 값이 없다.
  #
  # main 은 다르다. `github.ref` 가 병합마다 똑같이 `refs/heads/main` 이라,
  # 연달아 병합하면 앞선 커밋의 E2E 가 취소된 채 지나간다. 두 앱 CI 가 이미
  # 같은 이유로 PR 에서만 취소하도록 바뀌었다(#807, #1547).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Real-API E2E (member app + trainer web)
    runs-on: ubuntu-latest
    # 스위트마다 상한(E2E_SUITE_TIMEOUT)이 걸려 있으므로 잡 전체가 달아날 일은 없다.
    # 3개 × 15분 + 준비 2분이 최악이고, 여기에 여유를 더해 잡는다.
    timeout-minutes: 50

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oncare
          POSTGRES_PASSWORD: oncare
          POSTGRES_DB: oncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://oncare:oncare@localhost:5432/oncare
      # 러너 시간대를 KST 로 고정한다. `backend/docker-compose.yml` 이 앱에 걸어 둔
      # `TZ: Asia/Seoul` 과 같은 이유다 — 서버는 트레이너 일정의 날짜·시각을 **항상**
      # 서울 기준으로 찍는데(`reservation_service.reserve`), 러너가 UTC 면 스위트가
      # 보는 벽시계와 9시간 어긋난다. 화면에 보이는 '오늘/어제' 라벨도 마찬가지다.
      TZ: Asia/Seoul
      # CI 에는 Gemini 키가 없다. 켜 두면 기동할 때마다 임베딩이 터져 백엔드 로그가
      # `GEMINI_API_KEY 가 설정되지 않았습니다` 로 뒤덮이고, 진짜 실패 원인이 묻힌다.
      # 어느 스위트도 AI 코치 근거를 단언하지 않는다.
      SEED_RAG_INGEST: "false"
      # 데모 계정(트레이너·회원)이 있어야 스위트가 로그인할 수 있다.
      SEED_DEMO_DATA: "true"
      # 스위트는 한 번 돌 때 로그인을 여러 번 한다 — 단계마다 로그아웃 상태에서
      # 부팅하고, 픽스처가 다른 계정으로 또 붙는다. 기본 한도는 IP·엔드포인트당
      # 분당 10회라 그대로 두면 로그인이 429 로 막히고, 화면에서는 "로그인 화면에서
      # 안 넘어감" 으로만 보인다.
      RATE_LIMIT_ENABLED: "false"
      API_BASE_URL: http://localhost:8000/v1
      # 아직 통과하지 못하는 스위트. **돌리기는 하되** 실패해도 잡을 막지 않는다.
      # 건너뛰지 않는 이유는 두 가지다 — 상태가 계속 보이고, 고쳐져서 통과하기
      # 시작하면 바로 알 수 있다. 지금은 비어 있다(#837 이 #872 로 닫혔다).
      # 격리할 때는 러너 파일명을 공백으로 구분해 적고, 풀 때는 이름만 지운다.
      E2E_QUARANTINE: ""
      # 스위트 하나당 상한. 실패가 아니라 **매달림**을 끊는 장치다 — 격리한 스위트가
      # 27분을 붙잡고 있다가 잡 타임아웃에 걸리면, 격리해 둔 의미가 없어진다.
      # 정상 실행은 채팅 기준 90초 남짓이라 15분이면 충분히 여유롭다.
      E2E_SUITE_TIMEOUT: 15m

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        # 이동 가능한 태그(@v5)는 쓰지 않는다 — 태그가 옮겨지면 검토하지 않은
        # action 코드가 CI 에서 돈다. 다른 스텝들과 같이 커밋 SHA 로 고정한다.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 운영 이미지·백엔드 CI 와 같은 버전을 한 곳에서 읽는다(#2837).
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: |
          set -euo pipefail
          # 시드는 앱 기동 훅에서 돈다(`main.py` → `init_db()`). 그래서 마이그레이션만
          # 돌리고 끝내면 데모 계정이 없다 — 반드시 서버를 띄워야 한다.
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for backend
        run: |
          set -euo pipefail
          # 첫 기동은 시드(공공 식품 DB·데모 데이터·RAG 적재)까지 하므로 시간이 걸린다.
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 "$API_BASE_URL/healthz" >/dev/null; then
              echo "backend ready after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::백엔드가 10분 안에 뜨지 않았습니다."
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # 두 앱 CI 와 같은 버전으로 고정한다. 새 stable 이 나온 순간 아무도 코드를
          # 건드리지 않았는데 깨지는 일을 막는다(#659).
          flutter-version: '3.44.9'
          cache: true

      - name: Install Flutter dependencies
        run: |
          set -euo pipefail
          (cd frontend/flutter && flutter pub get)
          (cd frontend/flutter_trainer && flutter pub get)

      - name: Run E2E suites
        run: |
          set -euo pipefail
          # 러너를 글롭으로 찾는다. 스위트가 늘어도(#640 의 상담처럼) 이 파일을 고칠
          # 필요가 없다 — `tool/run_<이름>_e2e.sh` 규약만 지키면 자동으로 포함된다.
          shopt -s nullglob
          runners=(tool/run_*_e2e.sh)
          if [ ${#runners[@]} -eq 0 ]; then
            echo "::error::tool/run_*_e2e.sh 를 하나도 찾지 못했습니다."
            exit 1
          fi
          echo "실행할 스위트: ${runners[*]}"
          failed=()
          quarantined_failed=()
          quarantined_passed=()
          for r in "${runners[@]}"; do
            name=$(basename "$r")
            quarantined=false
            # 라벨을 따로 둔다. `${quarantined:+...}` 는 값이 **비었는지**만 보므로
            # 문자열 `false` 에도 확장돼, 격리하지 않은 스위트까지 (격리) 로 찍힌다.
            label=""
            case " $E2E_QUARANTINE " in
              *" $name "*) quarantined=true; label=" (격리)" ;;
            esac

            echo "::group::$r$label"
            # 하나가 실패해도 나머지를 마저 돌린다. 첫 실패에서 멈추면 한 번의 CI 로
            # 얻을 수 있는 정보가 스위트 하나로 줄어든다.
            #
            # `timeout` 으로 감싸는 이유: 스위트가 매달리면 뒤의 스위트가 아예 돌지
            # 못한다. 실제로 상담이 27분을 붙잡아 예약이 한 번도 실행되지 않았다.
            if timeout --signal=TERM --kill-after=30s "$E2E_SUITE_TIMEOUT" bash "$r"; then
              if [ "$quarantined" = true ]; then
                quarantined_passed+=("$name")
              else
                echo "✅ $r"
              fi
            else
              rc=$?
              [ "$rc" -ge 124 ] && echo "::warning::$name 이 $E2E_SUITE_TIMEOUT 안에 끝나지 않아 중단했습니다."
              if [ "$quarantined" = true ]; then
                quarantined_failed+=("$name")
              else
                echo "::error::$r 실패 (exit $rc)"
                failed+=("$r")
              fi
            fi
            echo "::endgroup::"
          done

          for n in "${quarantined_failed[@]}"; do
            echo "::warning::[격리] $n 이 실패했습니다. 알려진 문제라 잡을 막지 않습니다."
          done
          # 격리한 스위트가 통과하기 시작하면 알려 준다. 그대로 두면 고쳐진 뒤에도
          # 아무도 격리를 풀지 않는다.
          for n in "${quarantined_passed[@]}"; do
            echo "::warning::[격리] $n 이 통과했습니다. E2E_QUARANTINE 에서 빼 주세요."
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::실패한 스위트: ${failed[*]}"
            exit 1
          fi

      - name: Backend log (on failure)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/backend.log" || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
          fi
