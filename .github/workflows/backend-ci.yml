name: Backend CI

on:
  push:
    # PR 브랜치 푸시는 `pull_request` 가 이미 검증한다. 필터가 없으면 같은 커밋에
    # 백엔드 잡이 둘 돌고, 한쪽이 러너 인프라로 멎으면 코드가 통과했는데도 PR
    # 체크가 빨간 채로 남는다(#1638). 프런트 셋과 같은 형태로 맞춘다.
    branches: [main]
    paths:
      - "backend/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      # 추천 개인운동 효과 문구표 원본 — 서버·트레이너 웹 사본이 같은지 본다(#2570).
      - "shared/routine_effects/**"
      # 서버와 두 앱이 같은 값을 내야 하는 계산 규칙과 그 입력 표(#2860).
      - "shared/oncare_rules/**"
      # 운영 환경변수의 원본 — Settings 키와 맞는지 tests/test_deploy_template.py 가 본다(#3016).
      - "infra/backend-service.yml"
      # 운영 설정 기동 스모크·감사 허용 목록 검사 스크립트(#3163).
      - ".github/scripts/backend_prod_boot_smoke.sh"
      - "tool/ci/pip_audit_gate.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      # 추천 개인운동 효과 문구표 원본 — 서버·트레이너 웹 사본이 같은지 본다(#2570).
      - "shared/routine_effects/**"
      # 서버와 두 앱이 같은 값을 내야 하는 계산 규칙과 그 입력 표(#2860).
      - "shared/oncare_rules/**"
      # 운영 환경변수의 원본 — Settings 키와 맞는지 tests/test_deploy_template.py 가 본다(#3016).
      - "infra/backend-service.yml"
      # 운영 설정 기동 스모크·감사 허용 목록 검사 스크립트(#3163).
      - ".github/scripts/backend_prod_boot_smoke.sh"
      - "tool/ci/pip_audit_gate.py"
      - ".github/workflows/backend-ci.yml"

# 토큰 권한을 저장소·조직 기본값에 맡기지 않고 여기서 최소로 선언한다(#1557).
# 이 잡은 코드를 읽고 테스트만 돌리므로 읽기 권한이면 충분하다.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # PR 실행만 취소한다. 같은 브랜치에 새 커밋이 오면 옛 실행은 볼 값이 없다.
  #
  # main 은 다르다. `github.ref` 가 병합마다 똑같이 `refs/heads/main` 이라,
  # 연달아 병합하면 앞선 검증이 취소된다 — 병합 뒤 검증이 안전망인데 빠르게
  # 병합할수록 그 안전망이 꺼진다(#807).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Alembic + Pytest (Postgres/pgvector)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oncare
          POSTGRES_PASSWORD: oncare
          POSTGRES_DB: oncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://oncare:oncare@localhost:5432/oncare
      # AI 키는 필요 없음(테스트는 인식/코치 호출을 하지 않음)
      SEED_DEMO_DATA: "true"
      # 테스트도 운영처럼 Alembic 이 만든 스키마로만 돈다(#2838). 켜 두면 앱 기동의
      # create_all() 이 마이그레이션에 빠진 테이블을 대신 만들어 줘, 배포 뒤에야
      # `relation does not exist` 로 드러난다.
      AUTO_CREATE_TABLES: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 운영 이미지와 같은 버전을 한 곳에서 읽는다(#2837). 예전엔 CI 3.11, 이미지 3.12 라
          # CI 를 통과한 조합과 배포되는 조합이 달랐다.
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Python version matches the Dockerfile
        # Dockerfile 은 .python-version 을 읽을 수 없어 ARG 기본값으로 같은 값을 적어 둔다.
        # 둘 중 하나만 올리면 CI 와 운영이 다시 갈라지므로 여기서 막는다(#2837).
        run: |
          set -euo pipefail
          want=$(tr -d '[:space:]' < .python-version)
          got=$(sed -n 's/^ARG PYTHON_VERSION=\(.*\)$/\1/p' Dockerfile | tr -d '[:space:]')
          echo ".python-version=$want Dockerfile=$got"
          if [ -z "$got" ] || [ "$want" != "$got" ]; then
            echo "::error file=backend/Dockerfile::ARG PYTHON_VERSION($got) 이 backend/.python-version($want) 과 다릅니다."
            exit 1
          fi

      - name: Install dependencies
        # 잠금 파일(버전·해시 고정)로만 설치한다 — 운영 이미지와 같은 버전이다(#2837).
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Assert single Alembic head (no branched migrations)
        run: |
          set -euo pipefail
          # alembic 실행 자체가 실패하면(분기/설정 오류 등) set -e 로 여기서 즉시 실패시킨다.
          # (이전엔 `alembic heads | grep -c … || true` 라 alembic 실패도 head=... 로 넘어가는
          #  fail-open 이었다.) 성공한 출력에서만 head 개수를 센다.
          alembic heads > alembic_heads.txt
          HEADS=$(grep -c '(head)' alembic_heads.txt || true)
          echo "alembic heads count: $HEADS"
          cat alembic_heads.txt
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Alembic 마이그레이션 head 가 1개가 아닙니다($HEADS). down_revision 선형화 필요."
            exit 1
          fi

      - name: Run migrations (validates baseline)
        run: alembic upgrade head

      - name: Models match migrations (alembic check)
        # 마이그레이션을 끝까지 적용한 스키마와 모델(Base.metadata)을 비교해, 자동 생성할
        # 변경이 하나라도 있으면 실패한다(#2838). 모델에 테이블·칸·인덱스·NOT NULL 을
        # 더하고 마이그레이션을 빠뜨린 PR 이 여기서 걸린다. 고칠 때는
        # `alembic revision --autogenerate` 결과를 검토해 마이그레이션을 더한다.
        run: alembic check

      - name: Run tests
        run: pytest

  image:
    # 운영 이미지는 main 병합 뒤 배포 워크플로에서만 빌드돼, Dockerfile·잠금 파일이 깨진
    # PR 을 병합 전에 알 수 없었다(#2837). 여기서 같은 Dockerfile 로 빌드만 하고(푸시
    # 없음), 컨테이너를 실제로 띄워 마이그레이션·기동·헬스 응답까지 본다.
    name: Docker image build + boot smoke
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oncare
          POSTGRES_PASSWORD: oncare
          POSTGRES_DB: oncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image (no push)
        run: |
          set -euo pipefail
          PYTHON_VERSION=$(tr -d '[:space:]' < .python-version)
          # 배포와 같은 빌드 인자로 커밋 SHA 를 넣는다(#3029). 아래 기동 단계가 /v1/version 으로 확인한다.
          docker build --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
            --build-arg "GIT_SHA=${GITHUB_SHA}" -t oncare-backend:ci .

      - name: Boot the container and probe health
        # 운영과 같은 엔트리포인트(scripts/start.sh → 마이그레이션 → uvicorn)로 띄운다.
        # 데모 시드·RAG 적재는 끄고, 스키마는 Alembic 만 만든다.
        run: |
          set -euo pipefail
          docker run -d --name oncare-backend --network host \
            -e ENV=dev \
            -e DATABASE_URL=postgresql+psycopg://oncare:oncare@localhost:5432/oncare \
            -e AUTO_CREATE_TABLES=false \
            -e SEED_DEMO_DATA=false \
            -e SEED_RAG_INGEST=false \
            oncare-backend:ci
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://localhost:8000/v1/healthz >/dev/null; then
              echo "healthz ok after ${i} tries"
              curl --fail --silent --show-error --max-time 5 http://localhost:8000/v1/readyz
              echo
              VERSION=$(curl --fail --silent --show-error --max-time 5 http://localhost:8000/v1/version)
              echo "version: ${VERSION}"
              printf '%s' "${VERSION}" | bash ../.github/scripts/verify_backend_health.sh version "${GITHUB_SHA}"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' oncare-backend)" != "true" ]; then
              echo "::error::컨테이너가 기동 중에 종료됐습니다."
              docker logs oncare-backend || true
              exit 1
            fi
            sleep 3
          done
          echo "::error::컨테이너가 3분 안에 /v1/healthz 에 응답하지 않았습니다."
          docker logs oncare-backend || true
          exit 1

      - name: Request logs carry no coordinates or client IP
        # uvicorn 기본 액세스 로그는 쿼리(헬스장 찾기 lat·lng)와 사용자 IP 를 남긴다(#3031).
        # start.sh 가 그 로그를 끄고 app.access 만 남기는지 실제 컨테이너 출력으로 본다.
        # 인증이 없어 401 이어도 요청 로그는 남으므로 결과 코드는 보지 않는다.
        run: |
          set -euo pipefail
          LAT=37.5665123
          LNG=126.9780456
          PROBE_IP=203.0.113.77
          for path in \
            "/v1/places/nearby?lat=${LAT}&lng=${LNG}&category=fitness" \
            "/v1/gyms?lat=${LAT}&lng=${LNG}"; do
            curl --silent --show-error --output /dev/null --max-time 5 \
              -H "X-Forwarded-For: ${PROBE_IP}" "http://localhost:8000${path}"
          done
          sleep 1
          docker logs oncare-backend > container.log 2>&1
          leaked=0
          for needle in "${LAT}" "${LNG}" "${PROBE_IP}" "lat=" "lng="; do
            if grep -F -- "${needle}" container.log; then
              echo "::error::컨테이너 로그에 '${needle}' 가 남았습니다."
              leaked=1
            fi
          done
          if ! grep -F "app.access: GET '/v1/places/nearby'" container.log; then
            echo "::error::app.access 요청 로그가 보이지 않습니다."
            leaked=1
          fi
          exit "${leaked}"

      - name: Boot with production settings
        # 위 기동은 ENV=dev 라 운영에서만 켜지는 설정 가드·기동 점검·FORCE_HTTPS 를 지나지
        # 않는다(#3163). 더미 운영 값으로 같은 이미지를 띄워 healthz·readyz(X-Forwarded-Proto:
        # https)를 보고, 필수 운영 값을 하나씩 빼면 기동이 멈추는지 확인한다. 외부 호출은 없다.
        run: bash ../.github/scripts/backend_prod_boot_smoke.sh oncare-backend:ci tests/fixtures/prod_smoke.env

      - name: Container logs
        if: always()
        run: docker logs oncare-backend 2>&1 | tail -n 200 || true

  lint:
    # 테스트가 닿지 않는 경로의 정의되지 않은 이름·쓰지 않는 import 를 병합 전에 잡는다(#3163).
    # 규칙은 backend/ruff.toml(오류 계열 F·E9 만)에 있다.
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: Install ruff
        run: python -m pip install ruff==0.16.10

      - name: ruff check
        run: ruff check --output-format github .

  audit:
    # 잠금 파일의 알려진 취약점이 있으면 실패한다(#2837 에서 경고 모드로 도입, #3163 에서 차단).
    # 당장 고칠 수 없는 항목은 backend/audit-allowlist.toml 에 사유·재검토 날짜와 함께 올리고,
    # 날짜가 지나면 다시 실패한다. 대조 규칙은 tool/ci/pip_audit_gate.py.
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit locked dependencies
        # 잠금 파일이 해시까지 고정돼 있어 다시 풀지 않고(--disable-pip) 적힌 버전 그대로 본다.
        # 취약점이 있으면 pip-audit 자체가 0 이 아닌 코드로 끝나므로, 통과·실패는 결과 JSON 을
        # 허용 목록과 대조한 다음 단계가 정한다. JSON 이 없으면(조회 실패 등) 여기서 멈춘다.
        # step 셸이 `bash -e` 라 종료 코드는 `|| status=$?` 로 받는다 — 그대로 두면 취약점이
        # 하나만 있어도 여기서 끝나 허용 목록 대조까지 가지 못한다(#3235).
        run: |
          set -uo pipefail
          status=0
          pip-audit --requirement requirements-dev.txt --require-hashes --disable-pip \
            --progress-spinner off --desc on --format json --output audit.json || status=$?
          echo "pip-audit exit code: ${status}"
          if [ ! -s audit.json ]; then
            echo "::error::pip-audit 결과(audit.json)가 없습니다. 위 로그에서 조회 실패 원인을 확인하세요."
            exit 1
          fi

      - name: Check findings against the allowlist
        run: >-
          python ../tool/ci/pip_audit_gate.py
          --audit audit.json
          --allowlist audit-allowlist.toml
          --summary "$GITHUB_STEP_SUMMARY"
