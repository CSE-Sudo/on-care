name: Backend CI

on:
  push:
    # PR 브랜치 푸시는 `pull_request` 가 이미 검증한다. 필터가 없으면 같은 커밋에
    # 백엔드 잡이 둘 돌고, 한쪽이 러너 인프라로 멎으면 코드가 통과했는데도 PR
    # 체크가 빨간 채로 남는다(#1638). 프런트 셋과 같은 형태로 맞춘다.
    branches: [main]
    paths:
      - "backend/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      - ".github/workflows/backend-ci.yml"

# 토큰 권한을 저장소·조직 기본값에 맡기지 않고 여기서 최소로 선언한다(#1557).
# 이 잡은 코드를 읽고 테스트만 돌리므로 읽기 권한이면 충분하다.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # PR 실행만 취소한다. 같은 브랜치에 새 커밋이 오면 옛 실행은 볼 값이 없다.
  #
  # main 은 다르다. `github.ref` 가 병합마다 똑같이 `refs/heads/main` 이라,
  # 연달아 병합하면 앞선 검증이 취소된다 — 병합 뒤 검증이 안전망인데 빠르게
  # 병합할수록 그 안전망이 꺼진다(#807).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Alembic + Pytest (Postgres/pgvector)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oncare
          POSTGRES_PASSWORD: oncare
          POSTGRES_DB: oncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://oncare:oncare@localhost:5432/oncare
      # AI 키는 필요 없음(테스트는 인식/코치 호출을 하지 않음)
      SEED_DEMO_DATA: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert single Alembic head (no branched migrations)
        run: |
          set -euo pipefail
          # alembic 실행 자체가 실패하면(분기/설정 오류 등) set -e 로 여기서 즉시 실패시킨다.
          # (이전엔 `alembic heads | grep -c … || true` 라 alembic 실패도 head=... 로 넘어가는
          #  fail-open 이었다.) 성공한 출력에서만 head 개수를 센다.
          alembic heads > alembic_heads.txt
          HEADS=$(grep -c '(head)' alembic_heads.txt || true)
          echo "alembic heads count: $HEADS"
          cat alembic_heads.txt
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Alembic 마이그레이션 head 가 1개가 아닙니다($HEADS). down_revision 선형화 필요."
            exit 1
          fi

      - name: Run migrations (validates baseline)
        run: alembic upgrade head

      - name: Run tests
        run: pytest
