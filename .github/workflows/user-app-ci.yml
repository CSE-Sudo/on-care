name: User App CI

# 사용자 Flutter 앱(frontend/flutter) 전용 PR/main CI.
# 트레이너 웹은 trainer-ci.yml 이 같은 일을 하는데 사용자 앱에는 대응이 없어,
# 200건이 넘는 테스트가 로컬에서만 돌고 PR 화면에서는 통과 여부를 볼 수 없었다(#374).
# 데모 웹 빌드는 deploy.yml 이 main 배포에서 하고, 여기서는 analyze/test 와 운영 웹
# 번들에 데모가 섞이지 않았는지(#3157)를 본다.
on:
  pull_request:
    paths:
      - "frontend/flutter/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      # 두 앱이 함께 쓰는 UI 규격 패키지(#1691).
      - "shared/oncare_ui/**"
      # 두 앱이 함께 쓰는 카카오맵 위젯(#2543).
      - "shared/oncare_kakao_map/**"
      # 두 앱이 함께 쓰는 주간 리포트 결과지(#2652).
      - "shared/oncare_report/**"
      # 서버와 두 앱이 같은 값을 내야 하는 계산 규칙과 그 입력 표(#2860).
      - "shared/oncare_rules/**"
      # 코치 카드 효과 문구 시험이 읽는 공용 효과 표(#2906).
      - "shared/routine_effects/**"
      # 두 앱이 함께 쓰는 인증·네트워크·시계 기반(#2907).
      - "shared/oncare_core/**"
      # 데모·실서버 진입점 비교 시험이 읽는 예외 목록 — 목록만 바뀌어도 돈다(#2792).
      - ".github/demo-divergence-allowlist.txt"
      # 운영 빌드의 데모 자산 선언 제거와 운영 번들 검사(#3157).
      - "frontend/tool/strip_demo_assets.py"
      - "tool/ci/check_prod_web_bundle.py"
      # 화면 하드코딩 검사 도구와 규칙(#1698) — 도구 테스트와 회원 앱 검사가 여기서 돈다. 규칙만 바뀌어도 돈다(#3237).
      - "tool/ui_guard/**"
      - ".github/workflows/user-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/flutter/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      # 두 앱이 함께 쓰는 UI 규격 패키지(#1691).
      - "shared/oncare_ui/**"
      # 두 앱이 함께 쓰는 카카오맵 위젯(#2543).
      - "shared/oncare_kakao_map/**"
      # 두 앱이 함께 쓰는 주간 리포트 결과지(#2652).
      - "shared/oncare_report/**"
      # 서버와 두 앱이 같은 값을 내야 하는 계산 규칙과 그 입력 표(#2860).
      - "shared/oncare_rules/**"
      # 코치 카드 효과 문구 시험이 읽는 공용 효과 표(#2906).
      - "shared/routine_effects/**"
      # 두 앱이 함께 쓰는 인증·네트워크·시계 기반(#2907).
      - "shared/oncare_core/**"
      # 데모·실서버 진입점 비교 시험이 읽는 예외 목록 — 목록만 바뀌어도 돈다(#2792).
      - ".github/demo-divergence-allowlist.txt"
      # 운영 빌드의 데모 자산 선언 제거와 운영 번들 검사(#3157).
      - "frontend/tool/strip_demo_assets.py"
      - "tool/ci/check_prod_web_bundle.py"
      # 화면 하드코딩 검사 도구와 규칙(#1698) — 도구 테스트와 회원 앱 검사가 여기서 돈다. 규칙만 바뀌어도 돈다(#3237).
      - "tool/ui_guard/**"
      - ".github/workflows/user-app-ci.yml"

permissions:
  contents: read

concurrency:
  # PR 은 브랜치마다 한 그룹이라 새 커밋이 오면 옛 실행을 취소한다 — 옛 실행은 볼 값이 없다.
  #
  # main push 는 커밋마다 그룹을 따로 둔다. 병합 뒤 검증이 안전망인데, 2026-08-16 에 연달아
  # 병합한 네 커밋이 검증되지 않은 채 지나갔고 다섯 번째에서야 깨진 것이 드러났다(#807).
  # `cancel-in-progress: false` 만으로는 막지 못한다 — 진행 중인 실행은 지키지만 GitHub 은
  # 그룹마다 대기 실행을 하나만 두고 새 실행이 오면 대기 중이던 것을 취소해, 세 번 이상 연달아
  # 병합하면 가운데 커밋의 검증이 취소된다(#3237). 이 워크플로의 완료를 받아 배포하는 곳은 없어
  # (프런트 배포 게이트는 커밋별 결과를 읽기만 한다) 커밋끼리 나란히 돌아도 된다.
  group: user-app-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Analyze and test (user app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Flutter 를 고정한다. `channel: stable` 만 두면 새 stable 이 나온 순간
          # 아무도 코드를 건드리지 않았는데 CI 가 깨진다 — 실제로 3.47.0 에서
          # riverpod_lint 가 새 문법을 몰라 분석 도중 매달렸다(#659). 올릴 때는
          # 의도적으로 올린다.
          flutter-version: '3.44.9'
          cache: true

      # 김민수 데모 픽스처는 두 앱과 백엔드가 함께 읽는다(#757). 픽스처 자체의
      # 불변식(큐레이션 합계·이행률 산출·앱에 심긴 Dart 상수가 원본 JSON 과 같은지)은
      # 앱 테스트가 보지 않으므로 여기서 한 번 돌린다. 트레이너 CI 에도 두면 같은
      # 검사를 두 번 하게 되므로 이 한 곳에만 둔다.
      - name: Test shared demo fixture
        working-directory: shared/demo_fixture
        run: |
          dart pub get
          dart test

      # 서버와 같은 계산 규칙 패키지(#2860). 입력 표(`vectors/*.json`)를 백엔드
      # pytest 도 읽는다. 트레이너 CI 에 두면 같은 검사를 두 번 하므로 여기만 둔다.
      - name: Analyze and test shared rules package
        working-directory: shared/oncare_rules
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      # 두 앱이 함께 쓰는 인증·네트워크·시계 기반(#2907). 토큰 갱신 경쟁·401 재시도·
      # 언어 헤더·폴링 수명은 이 패키지 테스트가 본다. 트레이너 CI 에 두면 같은
      # 검사를 두 번 하므로 여기만 둔다.
      - name: Analyze and test shared core package
        working-directory: shared/oncare_core
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 두 앱이 함께 쓰는 UI 규격 패키지(#1691). 토큰·테마 불변식은 앱 테스트가
      # 보지 않으므로 여기서 한 번 돌린다(트레이너 CI 에는 두지 않는다).
      - name: Analyze and test shared UI package
        id: oncare_ui
        working-directory: shared/oncare_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 두 앱이 함께 쓰는 카카오맵 위젯(#2543). 공용 UI 패키지와 같은 이유로 여기서
      # 한 번만 돌린다.
      - name: Analyze and test shared Kakao map package
        working-directory: shared/oncare_kakao_map
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 두 앱이 함께 쓰는 주간 리포트 결과지(#2652). 계산·문서 불변식은 앱 테스트가
      # 보지 않으므로 공용 UI 패키지와 같은 이유로 여기서 한 번만 돌린다.
      - name: Analyze and test shared report package
        working-directory: shared/oncare_report
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 공용 버튼 골든(#2054)이 어긋나면 기준·실제·차이 PNG 가 test/failures/ 에
      # 생긴다. 러너가 끝나면 사라지므로 올려 둔다 — 리뷰어가 무엇이 바뀌었는지
      # 이미지로 보고, 운영체제 차이로만 깨졌다면 `_testImage.png` 를 새 기준으로
      # 받는다. 이 단계가 실패했을 때만 돈다.
      - name: Upload golden failures
        if: failure() && steps.oncare_ui.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oncare-ui-golden-failures
          path: shared/oncare_ui/test/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install dependencies
        run: flutter pub get

      # #1690 규격이 다시 흩어지지 않도록 화면 코드의 새 하드코딩(글자·색·모양·간격·
      # Material 원시 위젯)을 막는다(#1698). 지금 있는 것은 앱 안의
      # ui_guard_baseline.json 으로 허용하고, 늘거나 줄었는데 기준선을 갱신하지 않으면
      # 실패한다. 검사 도구 자체 테스트는 두 번 돌 필요가 없어 이 워크플로에만 둔다.
      - name: Test UI hardcoding guard
        working-directory: tool/ui_guard
        run: |
          dart pub get
          dart test

      - name: UI hardcoding guard
        working-directory: tool/ui_guard
        run: dart run bin/ui_guard.dart check frontend/flutter

      - name: Analyze
        run: flutter analyze

      # `flutter analyze` 는 analysis_options.yaml 의 custom_lint 플러그인을
      # 실행하지 않는다(분석 서버 경로에서만 동작). riverpod_lint 규칙이
      # 여기서만 걸리므로 별도 단계로 돌린다 — 이 저장소의 analysis_options
      # 주석도 `dart run custom_lint` 를 안내한다.
      - name: Custom lint (riverpod_lint)
        # 이 단계는 실패보다 **매달리는** 쪽으로 깨진 적이 있다 — 플러그인이 분석 중
        # 예외를 던지고도 프로세스가 끝나지 않아, 러너가 죽을 때까지 붙잡혀 PR 이
        # 전부 대기 상태가 됐다(#659). 정상 실행은 1분 남짓이라 여유를 두고도
        # 매달림은 확실히 끊는다.
        timeout-minutes: 10
        run: dart run custom_lint

      - name: Test
        run: flutter test

  # 회원 앱 모바일 릴리스 설정(#2823). 앱 ID·홈 화면 이름이 Android·iOS·웹에서 같은지,
  # 그리고 업로드 키(android/key.properties)가 없으면 릴리스 빌드가 실제로 멈추는지
  # 본다. 키스토어는 저장소에 없으므로, 서명 설정이 있을 때 통과하는 쪽은 러너에서
  # 그때그때 만든 일회용 키로만 확인하고 남기지 않는다.
  mobile-release-config:
    name: Mobile release config (user app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check app ID, app name and release signing config
        working-directory: .
        run: python3 tool/ci/check_mobile_app_identity.py

      # 스토어 릴리스 define 파일 검사기(#3022). 실제 release.json 은 저장소에 없으므로
      # 검사기의 통과·실패 경계와 예시 파일의 키 구성을 본다.
      - name: Test the release define checker
        run: bash tool/test_check_release_defines.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # analyze-and-test 와 같은 이유로 고정한다(#659).
          flutter-version: '3.44.9'
          cache: true

      - name: Release build stops without key.properties
        # 가드는 Gradle 작업 그래프가 정해지는 시점에 멈추므로 컴파일 전에 끝난다.
        # 다른 이유(SDK·의존성)로 실패한 것을 통과로 보지 않도록 가드 메시지를 확인한다.
        run: |
          set -uo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          if [ -e android/key.properties ]; then
            echo "::error::android/key.properties 가 저장소에 있습니다. 서명 설정은 커밋하지 않습니다."
            exit 1
          fi
          flutter pub get
          log="$RUNNER_TEMP/release-without-key.log"
          if flutter build appbundle --release >"$log" 2>&1; then
            cat "$log"
            echo "::error::key.properties 없이 릴리스 번들이 만들어졌습니다. 디버그 키 서명 가드가 동작하지 않습니다."
            exit 1
          fi
          if ! grep -qF "storeFile, storePassword, keyAlias, keyPassword" "$log"; then
            cat "$log"
            echo "::error::릴리스 빌드가 서명 가드가 아닌 다른 이유로 실패했습니다."
            exit 1
          fi
          echo "key.properties 없이 릴리스 빌드가 서명 가드에서 멈춤."

      - name: Release tasks pass the guard with a signing config
        # 위 단계가 만든 Gradle 래퍼로 작업 그래프만 확인한다(--dry-run). 키와 비밀번호는
        # 러너 임시 폴더에서 만들고 이 단계가 끝나면 지운다.
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          secret="$(openssl rand -hex 16)"
          keystore="$RUNNER_TEMP/ci-throwaway-upload.jks"
          keytool -genkeypair -noprompt -keystore "$keystore" -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$secret" -keypass "$secret" -dname "CN=CI throwaway"
          trap 'rm -f android/key.properties "$keystore"' EXIT
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$keystore" "$secret" "$secret" > android/key.properties
          cd android
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease --dry-run

  # 운영 웹 번들 검사(#3157). 운영 배포(aws-frontend-deploy.yml)와 같은 조건 — 데모 자산
  # 선언을 빼고 DEMO_BUILD 없이 실서버 설정으로 빌드한 뒤, 목업 분기가 트리 셰이킹되고
  # 데모 자산이 빠졌는지 산출물을 직접 연다. 주소는 검사용 자리값이고 배포하지 않는다.
  prod-web-bundle:
    name: Production web bundle has no demo (user app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # analyze-and-test 와 같은 이유로 고정한다(#659).
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Strip demo-only assets
        run: python3 ../tool/strip_demo_assets.py .

      - name: Build user web (production settings)
        run: >-
          flutter build web --release --base-href "/frontend/"
          --dart-define=USE_MOCK_API=false
          --dart-define=ENV=prod
          --dart-define=API_BASE_URL=https://api.example.org/v1

      - name: Check production bundle has no demo code or assets
        working-directory: .
        run: python3 tool/ci/check_prod_web_bundle.py --app member frontend/flutter/build/web
