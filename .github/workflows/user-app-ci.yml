name: User App CI

# 사용자 Flutter 앱(frontend/flutter) 전용 PR/main CI.
# 트레이너 웹은 trainer-ci.yml 이 같은 일을 하는데 사용자 앱에는 대응이 없어,
# 200건이 넘는 테스트가 로컬에서만 돌고 PR 화면에서는 통과 여부를 볼 수 없었다(#374).
# 웹 빌드 검증은 deploy.yml 이 main 배포에서 이미 하므로 여기서는 analyze/test 만 한다.
on:
  pull_request:
    paths:
      - "frontend/flutter/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      - ".github/workflows/user-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/flutter/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      - ".github/workflows/user-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: user-app-ci-${{ github.workflow }}-${{ github.ref }}
  # PR 실행만 취소한다. 같은 브랜치에 새 커밋이 오면 옛 실행은 볼 값이 없다.
  #
  # main 은 다르다. `github.ref` 가 병합마다 똑같이 `refs/heads/main` 이라,
  # 연달아 병합하면 앞선 검증이 취소된다 — 병합 뒤 검증이 안전망인데 빠르게
  # 병합할수록 그 안전망이 꺼진다. 2026-08-16 에 실제로 네 커밋이 검증되지
  # 않은 채 지나갔고, 다섯 번째에서야 깨진 것이 드러났다(#807).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Analyze and test (user app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Flutter 를 고정한다. `channel: stable` 만 두면 새 stable 이 나온 순간
          # 아무도 코드를 건드리지 않았는데 CI 가 깨진다 — 실제로 3.47.0 에서
          # riverpod_lint 가 새 문법을 몰라 분석 도중 매달렸다(#659). 올릴 때는
          # 의도적으로 올린다.
          flutter-version: '3.44.9'
          cache: true

      # 김민수 데모 픽스처는 두 앱과 백엔드가 함께 읽는다(#757). 픽스처 자체의
      # 불변식(큐레이션 합계·이행률 산출·앱에 심긴 Dart 상수가 원본 JSON 과 같은지)은
      # 앱 테스트가 보지 않으므로 여기서 한 번 돌린다. 트레이너 CI 에도 두면 같은
      # 검사를 두 번 하게 되므로 이 한 곳에만 둔다.
      - name: Test shared demo fixture
        working-directory: shared/demo_fixture
        run: |
          dart pub get
          dart test

      - name: Install dependencies
        run: flutter pub get

      # #1690 규격이 다시 흩어지지 않도록 화면 코드의 새 하드코딩(글자·색·모양·간격·
      # Material 원시 위젯)을 막는다(#1698). 지금 있는 것은 앱 안의
      # ui_guard_baseline.json 으로 허용하고, 늘거나 줄었는데 기준선을 갱신하지 않으면
      # 실패한다. 검사 도구 자체 테스트는 두 번 돌 필요가 없어 이 워크플로에만 둔다.
      - name: Test UI hardcoding guard
        working-directory: tool/ui_guard
        run: |
          dart pub get
          dart test

      - name: UI hardcoding guard
        working-directory: tool/ui_guard
        run: dart run bin/ui_guard.dart check frontend/flutter

      - name: Analyze
        run: flutter analyze

      # `flutter analyze` 는 analysis_options.yaml 의 custom_lint 플러그인을
      # 실행하지 않는다(분석 서버 경로에서만 동작). riverpod_lint 규칙이
      # 여기서만 걸리므로 별도 단계로 돌린다 — 이 저장소의 analysis_options
      # 주석도 `dart run custom_lint` 를 안내한다.
      - name: Custom lint (riverpod_lint)
        # 이 단계는 실패보다 **매달리는** 쪽으로 깨진 적이 있다 — 플러그인이 분석 중
        # 예외를 던지고도 프로세스가 끝나지 않아, 러너가 죽을 때까지 붙잡혀 PR 이
        # 전부 대기 상태가 됐다(#659). 정상 실행은 1분 남짓이라 여유를 두고도
        # 매달림은 확실히 끊는다.
        timeout-minutes: 10
        run: dart run custom_lint

      - name: Test
        run: flutter test
