name: Deploy Frontend to AWS

# 운영 프론트(S3 + CloudFront) 배포. Repository Variable AWS_FRONTEND_DEPLOY_ENABLED=true 일 때만 돈다.
#
# 배포 순서(#3018)
#   main push → E2E CI 완료(workflow_run) → gate(같은 커밋의 CI 판정 → 백엔드 선후 확인)
#     → build-and-deploy(빌드 → 업로드 → 검증 → CloudFront 전환 → 배포 후 검증)
#   E2E CI 는 paths 필터가 없어 모든 main push 에서 한 번씩 끝나므로 그 완료를 신호로 삼고,
#   paths 필터가 있는 User App CI·Trainer CI 는 실행이 있을 때만 성공을 요구한다.
#   백엔드 변경이 들어 있는 커밋은 운영 백엔드가 그 변경을 담은 뒤에만 전환한다.
#   판정 규칙과 대기 시간은 docs/aws-frontend-deployment.md "배포 순서" 에 있다.
on:
  workflow_run:
    workflows: ["E2E CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "배포할 main 커밋의 전체 SHA(40자). 같은 검증(CI·백엔드 선후)을 거친다"
        required: true
        type: string
      skip_backend_order_check:
        description: "백엔드 선후 확인을 건너뛴다(운영 백엔드가 commit_sha 를 알려 주지 않을 때 등 — 사람이 판단한 경우만)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-aws-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  gate:
    name: Check CI and backend order
    if: >-
      ${{ vars.AWS_FRONTEND_DEPLOY_ENABLED == 'true' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve deploy commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA="$WORKFLOW_RUN_SHA"
          else
            TARGET_SHA="$MANUAL_SHA"
          fi
          TARGET_SHA=$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::배포 SHA는 40자리 전체 커밋 SHA여야 합니다."
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploy commit: $TARGET_SHA"

      # 백엔드 선후 확인이 커밋 사이 diff 를 보므로 전체 이력이 필요하다.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # 수동 실행은 main 에 있는 커밋만 받는다.
      - name: Require a main commit
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::$SHA 는 main 이력에 없는 커밋입니다."
            exit 1
          fi

      # E2E 는 반드시 성공, 경로 필터 CI 는 실행이 있으면 성공. 아직 도는 CI 는 기다린다.
      - name: Check CI results for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          WAIT_SECONDS: '1800'
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            bash .github/scripts/frontend_ci_gate.sh "$SHA" > ci-gate.txt
            code=$?
            cat ci-gate.txt
            [ "$code" -ne 10 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI 가 ${WAIT_SECONDS}초 안에 끝나지 않았습니다. 끝난 뒤 수동으로 다시 실행하세요."
              code=1
              break
            fi
            sleep 30
          done
          {
            echo "### Frontend deploy gate"
            echo "- Commit: \`$SHA\`"
            grep '^- ' ci-gate.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # 이 커밋에 운영 백엔드가 아직 담지 않은 backend/ 변경이 있으면 백엔드 배포를 기다린다.
      # 백엔드 자동 배포가 꺼져 있으면 기다려도 오지 않으므로 바로 멈추고 사람에게 맡긴다.
      - name: Check backend deploy order
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SHA: ${{ steps.target.outputs.sha }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_backend_order_check }}
          BACKEND_DEPLOY_ENABLED: ${{ vars.BACKEND_DEPLOY_ENABLED }}
          WAIT_SECONDS: '2700'
        run: |
          set -uo pipefail
          if [ "$SKIP" = "true" ]; then
            echo "::warning::수동 실행에서 백엔드 선후 확인을 건너뛰었습니다."
            echo "- Backend order: 건너뜀(수동 판단)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash .github/scripts/check_web_api_base_url.sh || exit 1
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            bash .github/scripts/frontend_backend_order.sh "$API_BASE_URL" "$SHA" > order.txt
            code=$?
            cat order.txt
            [ "$code" -ne 10 ] && break
            if [ "$BACKEND_DEPLOY_ENABLED" != "true" ]; then
              echo "::error::운영 백엔드에 아직 없는 backend/ 변경이 있는데 백엔드 자동 배포(BACKEND_DEPLOY_ENABLED)가 꺼져 있습니다. 백엔드를 먼저 배포한 뒤 다시 실행하세요."
              code=1
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::운영 백엔드가 ${WAIT_SECONDS}초 안에 이 변경을 담지 않았습니다. Backend Deploy 결과(승인 대기 포함)를 확인한 뒤 다시 실행하세요."
              code=1
              break
            fi
            sleep 60
          done
          if [ "$code" -eq 11 ]; then
            echo "::error::운영 백엔드가 commit_sha 를 알려 주지 않아 선후를 판단할 수 없습니다. 사람이 확인한 뒤 수동 실행에서 skip_backend_order_check 를 켜세요."
            code=1
          fi
          {
            echo "- Backend commit: \`$(sed -n 's/^backend_sha=//p' order.txt)\`"
            echo "- Backend order: $(sed -n 's/^state=//p' order.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  build-and-deploy:
    name: Build and deploy Flutter web apps
    needs: gate
    runs-on: ubuntu-latest
    # 배포 역할은 이 Environment 형식 OIDC subject 를 믿는다(infra/frontend-hosting.yml,
    # #3019). 승인 규칙·배포 기록은 Environment 설정에서 본다.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      # workflow_run 에서는 GITHUB_SHA 가 main 의 최신 커밋이다. 배포 대상은 gate 가 고른 커밋이다.
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          # 빌드 번호는 커밋 수다(#3226). 얕은 체크아웃이면 1 로 나와 스탬프 단계가 멈춘다.
          fetch-depth: 0

      # 두 앱 설정 화면의 `버전 정보`(#3226). 빌드 번호(커밋 수)와 배포 일시(UTC)를 한 번만 만들어
      # 두 웹 빌드가 같은 값을 받게 한다. 같은 커밋이면 데모 Pages 빌드와도 번호가 같다.
      - name: Stamp release build number and date
        run: bash .github/scripts/release_build_stamp.sh "$GITHUB_ENV"

      # 랜딩의 앱 바로가기는 상대 경로라 이 배포에서는 같은 도메인의 /frontend/·/trainer/ 로
      # 간다(#2841). 절대 주소(무료 DNS 데모 등)가 들어오면 운영 방문자가 데모로 넘어가므로 빌드 전에 막는다.
      - name: Check landing app links
        run: bash .github/scripts/landing_site_url.sh check index.html

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Flutter 를 고정한다. `channel: stable` 만 두면 새 stable 이 나온 순간
          # 아무도 코드를 건드리지 않았는데 CI 가 깨진다 — 실제로 3.47.0 에서
          # riverpod_lint 가 새 문법을 몰라 분석 도중 매달렸다(#659). 올릴 때는
          # 의도적으로 올린다.
          flutter-version: '3.44.9'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      # 운영 배포는 실서버 고정이다(#2810). 두 앱은 dart-define 을 받지 못하면
      # 목업(USE_MOCK_API=true)·자리표시자 주소로 빌드되는데, 빌드는 그대로 성공하므로
      # 배포 뒤에야 드러난다. 그래서 주소 변수가 비었거나 형식이 틀리면 빌드 전에 멈춘다.
      # staging 주소와 같으면 멈춘다 — 운영 웹이 시연용 DB 를 보지 않게(#3020).
      - name: Require production API base URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FORBIDDEN_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: bash .github/scripts/check_web_api_base_url.sh

      # 에러 추적(#2839, #3022). DSN 은 앱마다 따로다(Sentry 프로젝트 둘). 비어 있어도
      # 배포는 계속한다 — 앱은 DSN 이 없으면 보고기를 끈다. 다만 운영 오류가 하나도 모이지
      # 않으므로 경고를 남긴다. 값 발급·등록은 #480.
      - name: Check Sentry DSN secrets
        env:
          SENTRY_DSN_MEMBER: ${{ secrets.SENTRY_DSN_MEMBER }}
          SENTRY_DSN_TRAINER: ${{ secrets.SENTRY_DSN_TRAINER }}
        run: |
          set -euo pipefail
          for name in SENTRY_DSN_MEMBER SENTRY_DSN_TRAINER; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::warning title=$name::비밀 $name 이 비어 있어 이 앱의 운영 오류를 보내지 않습니다."
            elif [[ "$value" != https://* ]]; then
              echo "::error title=$name::$name 은 https:// 로 시작하는 Sentry DSN 이어야 합니다."
              exit 1
            fi
          done

      - name: Install Flutter dependencies
        working-directory: frontend/flutter
        run: flutter pub get

      - name: Download drift WASM (sqlite3.wasm + drift_worker.js)
        working-directory: frontend/flutter
        run: bash tool/fetch_drift_wasm.sh
        env:
          # 익명 GitHub API 호출은 러너끼리 IP 를 나눠 써 한도에 걸린다(#2135, #2912).
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Flutter web
        working-directory: frontend/flutter
        # 운영 빌드: 실서버(USE_MOCK_API=false)·운영 환경(ENV=prod — 라우터 진단 로그와
        # provider 로그가 꺼진다). 주소는 저장소 변수에서만 읽고 여기 적지 않는다.
        # DEMO_BUILD 는 넘기지 않는다 — 앱의 릴리스 가드가 목업·개발 설정을 거부한다(#3022).
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_MEMBER }}
        run: >-
          flutter build web --release --base-href "/frontend/"
          --dart-define=RELEASE_SHA="${RELEASE_SHA:-$GITHUB_SHA}"
          --build-number="$BUILD_NUMBER"
          --dart-define=BUILD_NUMBER="$BUILD_NUMBER"
          --dart-define=RELEASE_DATE="$RELEASE_DATE"
          --dart-define=KAKAO_JS_KEY="$KAKAO_JS_KEY"
          --dart-define=USE_MOCK_API=false
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=ENV=prod
          --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Install Flutter dependencies (trainer)
        working-directory: frontend/flutter_trainer
        run: flutter pub get

      - name: Download drift WASM (trainer)
        working-directory: frontend/flutter_trainer
        run: bash tool/fetch_drift_wasm.sh
        env:
          # 익명 GitHub API 호출은 러너끼리 IP 를 나눠 써 한도에 걸린다(#2135, #2912).
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Flutter web (trainer)
        working-directory: frontend/flutter_trainer
        # 소속 헬스장 찾기 지도(#2543). 회원 앱과 같은 카카오맵 JS 키를 쓰고, 카카오
        # 콘솔에 트레이너 웹 도메인이 등록돼 있어야 뜬다. 키가 없으면 목록만 보인다.
        # 회원 앱과 같은 운영 설정이다 — 두 앱이 한 백엔드를 봐야 회원 기록이 트레이너에게
        # 보인다.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_TRAINER }}
        run: >-
          flutter build web --release --base-href "/trainer/"
          --dart-define=RELEASE_SHA="${RELEASE_SHA:-$GITHUB_SHA}"
          --build-number="$BUILD_NUMBER"
          --dart-define=BUILD_NUMBER="$BUILD_NUMBER"
          --dart-define=RELEASE_DATE="$RELEASE_DATE"
          --dart-define=KAKAO_JS_KEY="$KAKAO_JS_KEY"
          --dart-define=USE_MOCK_API=false
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=ENV=prod
          --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Prepare deploy files
        run: |
          set -euo pipefail
          mkdir -p public/frontend public/trainer public/legal
          cp index.html public/index.html
          cp -R frontend/flutter/build/web/. public/frontend/
          cp -R frontend/flutter_trainer/build/web/. public/trainer/
          # 공개 정책 페이지(#3005). 스토어·가입 전 안내가 여는 처리방침·약관 주소다.
          cp legal/*.html public/legal/
          find public -name '*.js.symbols' -delete
          echo "$RELEASE_SHA" > public/version.txt

      # 열린 탭이 새 배포를 알아채도록 두 앱 폴더에도 같은 version.txt 를 둔다(#3023). 앱은
      # 자기 `<base href>version.txt` 를 읽어 빌드에 넣은 RELEASE_SHA 와 비교한다.
      - name: Copy release marker into each app
        run: |
          set -euo pipefail
          cp public/version.txt public/frontend/version.txt
          cp public/version.txt public/trainer/version.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # og:url·canonical 을 이 배포의 도메인으로 채운다(#2841). 배포에 연결된 대체 도메인(운영
      # 도메인)이 있으면 그 첫 번째를, 아직 없으면 CloudFront 기본 도메인을 쓴다 — 운영 도메인을
      # 붙이면 워크플로를 고치지 않아도 다음 배포부터 그 주소가 들어간다. 배포 설정은 읽기만 한다.
      - name: Stamp landing site URL
        id: site
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_FRONTEND_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          DOMAIN=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Aliases.Items[0]' --output text)
          if [ -z "$DOMAIN" ] || [ "$DOMAIN" = "None" ]; then
            DOMAIN=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" \
              --query 'Distribution.DomainName' --output text)
          fi
          SITE_URL="https://${DOMAIN}/"
          bash .github/scripts/landing_site_url.sh stamp public/index.html "$SITE_URL"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

      # 운영 경로를 먼저 덮어쓰지 않는다. 이번 빌드는 커밋 SHA 로 격리된 자기
      # prefix 에만 올라가고, 지금 서비스 중인 릴리스의 객체는 손대지 않는다 —
      # 검증이 실패하면 아무것도 전환하지 않은 채 끝나면 된다.
      - name: Upload release to S3
        env:
          BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          # 진입 파일(index.html·flutter_bootstrap.js·main.dart.js·version.txt 등)은 이름에
          # 해시가 없어 no-cache 로, 나머지는 짧은 max-age 로 나눠 올린다(#3023). 규칙과
          # `--delete`(이 prefix 안에서만 작용) 는 스크립트 한 곳에 있다.
          bash .github/scripts/web_cache_headers.sh upload public \
            "s3://$BUCKET/releases/${RELEASE_SHA:-$GITHUB_SHA}"

      - name: Verify the uploaded release before switching traffic
        env:
          BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          PREFIX="releases/$RELEASE_SHA"

          # 파일 이름을 박아 두는 대신 개수로 본다 — Flutter 산출물 이름이 버전에
          # 따라 바뀌어도 "빌드한 것이 전부 올라갔는가" 는 그대로 검증된다.
          LOCAL_COUNT=$(find public -type f | wc -l | tr -d ' ')
          REMOTE_COUNT=$(aws s3 ls "s3://$BUCKET/$PREFIX/" --recursive | wc -l | tr -d ' ')
          if [ "$LOCAL_COUNT" != "$REMOTE_COUNT" ]; then
            echo "::error::Release upload incomplete: local=$LOCAL_COUNT remote=$REMOTE_COUNT"
            exit 1
          fi

          for key in index.html frontend/index.html trainer/index.html legal/privacy.html legal/terms.html; do
            SIZE=$(aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/$key" \
              --query 'ContentLength' --output text)
            if [ "${SIZE:-0}" -le 0 ]; then
              echo "::error::Empty or missing object: $PREFIX/$key"
              exit 1
            fi
          done

          UPLOADED_SHA=$(aws s3 cp "s3://$BUCKET/$PREFIX/version.txt" - | tr -d '[:space:]')
          if [ "$UPLOADED_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Release version mismatch: expected=$RELEASE_SHA actual=$UPLOADED_SHA"
            exit 1
          fi

      # 브라우저가 옛 진입 파일을 붙들지 않는지 — 대표 파일의 Cache-Control 을 본다(#3023).
      - name: Verify cache headers of the uploaded release
        env:
          BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          bash .github/scripts/web_cache_headers.sh verify "$BUCKET" \
            "releases/${RELEASE_SHA:-$GITHUB_SHA}"

      # 여기서 처음으로 운영 트래픽이 움직인다. origin pointer 하나만 바꾸므로
      # 전환이 원자적이고, 직전 릴리스 객체가 그대로 남아 되돌릴 수 있다.
      - name: Switch CloudFront origin to the new release
        id: switch
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_FRONTEND_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          CONFIG=$(aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID")
          ETAG=$(printf '%s' "$CONFIG" | jq -r '.ETag')
          ORIGIN_ID=$(printf '%s' "$CONFIG" \
            | jq -r '.DistributionConfig.DefaultCacheBehavior.TargetOriginId')
          PREVIOUS=$(printf '%s' "$CONFIG" \
            | jq -r --arg id "$ORIGIN_ID" \
              '.DistributionConfig.Origins.Items[] | select(.Id == $id) | .OriginPath')
          NEW="/releases/$RELEASE_SHA"

          {
            echo "origin_id=$ORIGIN_ID"
            echo "previous_origin_path=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

          if [ "$PREVIOUS" = "$NEW" ]; then
            echo "이미 이 릴리스를 가리키고 있어 전환을 건너뜁니다: $NEW"
            echo "switched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$CONFIG" \
            | jq --arg id "$ORIGIN_ID" --arg path "$NEW" \
              '.DistributionConfig
               | (.Origins.Items[] | select(.Id == $id) | .OriginPath) = $path' \
            > new-distribution-config.json

          # 되돌리기 표시는 갱신을 **부르기 직전에** 남긴다. 아래 wait 가 끊겨도
          # 전환은 이미 접수됐을 수 있으므로 롤백 단계가 돌아야 한다.
          echo "switched=true" >> "$GITHUB_OUTPUT"
          aws cloudfront update-distribution \
            --id "$DISTRIBUTION_ID" \
            --if-match "$ETAG" \
            --distribution-config file://new-distribution-config.json > /dev/null
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"
          echo "origin path: '${PREVIOUS}' -> '${NEW}'"

      - name: Invalidate CloudFront cache and verify deployment
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_FRONTEND_DISTRIBUTION_ID }}
          SITE_URL: ${{ steps.site.outputs.site_url }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

          DOMAIN=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DomainName' \
            --output text)
          BASE_URL="https://$DOMAIN"

          for path in / /frontend/ /trainer/; do
            curl --fail --silent --show-error "$BASE_URL$path" > /dev/null
          done
          LIVE_SHA=$(curl --fail --silent --show-error "$BASE_URL/version.txt" | tr -d '[:space:]')
          if [ "$LIVE_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::CloudFront version mismatch: expected=$RELEASE_SHA actual=$LIVE_SHA"
            exit 1
          fi

          # 배포 후 링크 확인(#2841): 서빙 중인 랜딩의 바로가기가 상대 경로라 같은 도메인의
          # /frontend/·/trainer/ 로 가는지, canonical 이 위에서 채운 이 배포 주소인지 본다.
          bash .github/scripts/landing_site_url.sh verify "$BASE_URL" "$SITE_URL" 120

          # 응답 보안 헤더(#3017): 스택의 헤더 정책이 붙어 있고 connect-src 가 이 빌드의 API
          # 출처로 좁혀져 있는지 본다. 어긋나면 실패 → 아래 되돌리기 단계가 돈다.
          API_ORIGIN=$(printf '%s' "$API_BASE_URL" | sed -E 's#^(https://[^/]+).*#\1#')
          bash .github/scripts/frontend_security_headers.sh "$BASE_URL" "$API_ORIGIN"

          {
            echo "### AWS frontend deployment"
            echo "- URL: $BASE_URL/"
            echo "- Landing canonical: $SITE_URL"
            echo "- Commit: $RELEASE_SHA"
            echo "- Release: /releases/$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      # 전환 이후 검증이 깨진 경우에만 돈다. 직전 릴리스 객체를 지운 적이 없으므로
      # pointer 만 되돌리면 그대로 다시 서비스된다.
      - name: Roll back to the previous release
        if: failure() && steps.switch.outputs.switched == 'true'
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_FRONTEND_DISTRIBUTION_ID }}
          ORIGIN_ID: ${{ steps.switch.outputs.origin_id }}
          PREVIOUS_ORIGIN_PATH: ${{ steps.switch.outputs.previous_origin_path }}
        run: |
          set -euo pipefail
          CONFIG=$(aws cloudfront get-distribution-config --id "$DISTRIBUTION_ID")
          ETAG=$(printf '%s' "$CONFIG" | jq -r '.ETag')
          printf '%s' "$CONFIG" \
            | jq --arg id "$ORIGIN_ID" --arg path "$PREVIOUS_ORIGIN_PATH" \
              '.DistributionConfig
               | (.Origins.Items[] | select(.Id == $id) | .OriginPath) = $path' \
            > rollback-distribution-config.json
          aws cloudfront update-distribution \
            --id "$DISTRIBUTION_ID" \
            --if-match "$ETAG" \
            --distribution-config file://rollback-distribution-config.json > /dev/null
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

          echo "::error::Deployment verification failed. Rolled back to '${PREVIOUS_ORIGIN_PATH:-/}'."
          {
            echo "### AWS frontend deployment rolled back"
            echo "- Failed release: /releases/$RELEASE_SHA"
            echo "- Restored origin path: ${PREVIOUS_ORIGIN_PATH:-/}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 릴리스가 무한정 쌓이지 않게 한다. 릴리스는 `releases/<sha>/` 루트 하나로 센다 — 앱 폴더의
      # version.txt(#3023)까지 따로 세면 직전 릴리스의 하위 폴더가 지워진다(#3128). 최신 $KEEP 개
      # 릴리스를 남기고, 지금 서비스 중인 릴리스와 되돌아갈 직전 릴리스는 어떤 경우에도 지우지
      # 않는다. 삭제는 언제나 릴리스 루트 단위다. 규칙은 스크립트 한 곳에 있다.
      - name: Prune old releases
        env:
          BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
          KEEP: '5'
          PREVIOUS_ORIGIN_PATH: ${{ steps.switch.outputs.previous_origin_path }}
        run: |
          set -euo pipefail
          bash .github/scripts/frontend_release_prune.sh prune "$BUCKET" "$KEEP" \
            "$RELEASE_SHA" "$PREVIOUS_ORIGIN_PATH"
