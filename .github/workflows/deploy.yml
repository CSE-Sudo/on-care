name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend:
        # 이 워크플로는 데모 배포다(#2810). 운영 배포(실서버 고정)는
        # aws-frontend-deploy.yml 이 맡는다. main push 는 입력이 없으므로 항상 목업으로
        # 빌드되고, 실서버로 한 번 올려 보고 싶을 때만 수동 실행에서 real 을 고른다.
        # real 은 staging 백엔드다(#3020) — 데모 사이트가 운영 DB 에 기록을 남기지 않게,
        # 운영 주소(API_BASE_URL)와 같으면 빌드 전에 멈춘다.
        description: '두 웹이 볼 백엔드 — mock(브라우저 drift 목업, 기본) 또는 real(저장소 변수 STAGING_API_BASE_URL)'
        type: choice
        options:
          - mock
          - real
        default: mock

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter web and static intro page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 이후 단계는 git 인증을 쓰지 않는다(토큰이 필요한 곳은 env 로 따로 받는다).
          persist-credentials: false
          # 빌드 번호는 커밋 수다(#3226). 얕은 체크아웃이면 1 로 나와 스탬프 단계가 멈춘다.
          fetch-depth: 0

      # 두 앱 고객 지원의 버전 줄(#3226). 빌드 번호(커밋 수)와 배포 일시(UTC)를 한 번만 만들어
      # 두 웹 빌드가 같은 값을 받게 한다 — 같은 배포의 회원 앱·트레이너 웹 번호가 갈리지 않는다.
      - name: Stamp release build number and date
        run: bash .github/scripts/release_build_stamp.sh "$GITHUB_ENV"

      # 랜딩의 앱 바로가기는 상대 경로라 어느 배포에서든 같은 도메인의 /frontend/·/trainer/ 로
      # 간다(#2841). 절대 주소가 다시 들어오면 운영(AWS) 방문자가 이 데모로 넘어오므로 빌드 전에 막는다.
      - name: Check landing app links
        run: bash .github/scripts/landing_site_url.sh check index.html

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Flutter 를 고정한다. `channel: stable` 만 두면 새 stable 이 나온 순간
          # 아무도 코드를 건드리지 않았는데 CI 가 깨진다 — 실제로 3.47.0 에서
          # riverpod_lint 가 새 문법을 몰라 분석 도중 매달렸다(#659). 올릴 때는
          # 의도적으로 올린다.
          flutter-version: '3.44.9'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      # 빌드 모드를 한 곳에서 정한다(#2810). push 에는 입력이 없어 mock 이 되고,
      # 데모 사이트가 지금처럼 목업으로 유지된다.
      - name: Resolve web build mode
        env:
          BACKEND: ${{ inputs.backend || 'mock' }}
        run: |
          set -euo pipefail
          case "$BACKEND" in
            mock)
              echo "WEB_USE_MOCK_API=true" >> "$GITHUB_ENV"
              echo "WEB_ENV=dev" >> "$GITHUB_ENV"
              ;;
            real)
              echo "WEB_USE_MOCK_API=false" >> "$GITHUB_ENV"
              echo "WEB_ENV=staging" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::알 수 없는 backend 입력: $BACKEND"
              exit 1
              ;;
          esac
          echo "web build backend=$BACKEND"

      # real 일 때만 주소를 요구한다. 비어 있는 채로 실서버 빌드를 하면 자리표시자
      # 주소를 부르는 앱이 그대로 배포된다.
      - name: Require staging API base URL for a real-backend build
        if: env.WEB_USE_MOCK_API == 'false'
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          API_BASE_URL_NAME: STAGING_API_BASE_URL
          FORBIDDEN_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: bash .github/scripts/check_web_api_base_url.sh

      - name: Install Flutter dependencies
        working-directory: frontend/flutter
        run: flutter pub get

      - name: Download drift WASM (sqlite3.wasm + drift_worker.js)
        working-directory: frontend/flutter
        run: bash tool/fetch_drift_wasm.sh
        env:
          # 릴리스 주소가 504 일 때 API 로 다시 받는다 — 인증해야 한도에 걸리지 않는다(#2135).
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Flutter web
        working-directory: frontend/flutter
        # 카카오맵 JS 키(#329). 저장소에 두지 않고 Secrets 에서 주입한다.
        # 시크릿이 비어 있으면 지도는 폴백 그래픽으로 뜨고 빌드는 깨지지 않는다.
        # 이 키는 클라이언트 노출이 전제이며, 카카오 콘솔의
        # [플랫폼 키 > JavaScript 키 > JavaScript SDK 도메인] 등록으로 보호된다.
        #
        # USE_MOCK_API·ENV 는 위 "Resolve web build mode" 가 정한다. mock 빌드는
        # API_BASE_URL 을 넘기지 않는다(목업은 네트워크를 쓰지 않는다).
        # DEMO_BUILD=true 는 데모 사이트 표시다(#3022). 앱의 릴리스 가드는 이 표시가 있을
        # 때만 목업·ENV=dev 릴리스 빌드를 허용한다 — 빠뜨리면 데모가 구성 오류 화면으로 뜬다.
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          args=(
            --release --base-href "/frontend/"
            --dart-define=KAKAO_JS_KEY="$KAKAO_JS_KEY"
            --dart-define=USE_MOCK_API="$WEB_USE_MOCK_API"
            --dart-define=ENV="$WEB_ENV"
            --dart-define=DEMO_BUILD=true
          )
          if [ "$WEB_USE_MOCK_API" = "false" ]; then
            args+=(--dart-define=API_BASE_URL="$API_BASE_URL")
          fi
          # 열린 탭의 새 버전 안내가 비교할 릴리스 SHA(#3023).
          args+=(--dart-define=RELEASE_SHA="$GITHUB_SHA")
          # 고객 지원 버전 줄(#3226) — 빌드 번호는 version.json 에도, 화면 판단용 define 에도 넣는다.
          args+=(--build-number="$BUILD_NUMBER" --dart-define=BUILD_NUMBER="$BUILD_NUMBER")
          args+=(--dart-define=RELEASE_DATE="$RELEASE_DATE")
          flutter build web "${args[@]}"

      - name: Install Flutter dependencies (trainer)
        working-directory: frontend/flutter_trainer
        run: flutter pub get

      - name: Download drift WASM (trainer)
        working-directory: frontend/flutter_trainer
        run: bash tool/fetch_drift_wasm.sh
        env:
          # 릴리스 주소가 504 일 때 API 로 다시 받는다 — 인증해야 한도에 걸리지 않는다(#2135).
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build Flutter web (trainer)
        working-directory: frontend/flutter_trainer
        # 소속 헬스장 찾기 지도(#2543). 회원 앱과 같은 카카오맵 JS 키를 쓰고, 카카오
        # 콘솔에 트레이너 웹 도메인이 등록돼 있어야 뜬다. 키가 없으면 목록만 보인다.
        # 백엔드 모드는 회원 앱과 같다 — 둘이 갈리면 회원 기록이 트레이너에게 안 보인다.
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          args=(
            --release --base-href "/trainer/"
            --dart-define=KAKAO_JS_KEY="$KAKAO_JS_KEY"
            --dart-define=USE_MOCK_API="$WEB_USE_MOCK_API"
            --dart-define=ENV="$WEB_ENV"
            --dart-define=DEMO_BUILD=true
          )
          if [ "$WEB_USE_MOCK_API" = "false" ]; then
            args+=(--dart-define=API_BASE_URL="$API_BASE_URL")
          fi
          # 열린 탭의 새 버전 안내가 비교할 릴리스 SHA(#3023).
          args+=(--dart-define=RELEASE_SHA="$GITHUB_SHA")
          # 고객 지원 버전 줄(#3226) — 빌드 번호는 version.json 에도, 화면 판단용 define 에도 넣는다.
          args+=(--build-number="$BUILD_NUMBER" --dart-define=BUILD_NUMBER="$BUILD_NUMBER")
          args+=(--dart-define=RELEASE_DATE="$RELEASE_DATE")
          flutter build web "${args[@]}"

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p public/frontend
          cp index.html public/index.html
          cp -R frontend/flutter/build/web/* public/frontend/
          mkdir -p public/trainer
          cp -R frontend/flutter_trainer/build/web/* public/trainer/
          # 공개 정책 페이지(#3005). 스토어·가입 전 안내가 여는 처리방침·약관 주소다.
          mkdir -p public/legal
          cp legal/*.html public/legal/
          # CanvasKit ships wasm symbol maps for debugging stack traces. They are
          # never fetched at runtime and cost ~8MB per app, so drop them to keep
          # the Pages publish as short as possible.
          find public -name '*.js.symbols' -delete
          # Deploy marker: lets the verify step below tell which commit is live.
          echo "$GITHUB_SHA" > public/version.txt
          touch public/.nojekyll
          # 두 앱은 자기 `<base href>version.txt` 를 읽어 새 배포를 알아챈다(#3023).
          cp public/version.txt public/frontend/version.txt
          cp public/version.txt public/trainer/version.txt

      # 두 앱 meta CSP 의 connect-src 는 로컬 개발용으로 https: 전체·localhost 까지 열려 있다.
      # Pages 는 응답 헤더를 붙일 수 없어 meta 가 전부이므로, 이 빌드가 부르는 출처(실서버면
      # API 출처, 목업이면 없음)와 CanvasKit·글꼴·카카오 SDK 출처로 좁히고 확인한다(#3089).
      # 운영 CloudFront 는 같은 목록을 응답 헤더로 내린다(#3017).
      - name: Narrow demo CSP connect-src
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          api=""
          if [ "$WEB_USE_MOCK_API" = "false" ]; then
            api="$API_BASE_URL"
          fi
          for page in public/frontend/index.html public/trainer/index.html; do
            bash .github/scripts/pages_demo_csp.sh narrow "$page" "$api"
            bash .github/scripts/pages_demo_csp.sh check "$page" "$api"
          done

      # og:url·canonical 은 이 배포의 커스텀 도메인(CNAME)으로 채운다(#2841). AWS 배포는 자기
      # 도메인으로 따로 채우므로 원본 index.html 에는 표시 줄만 있다.
      - name: Stamp landing site URL
        run: |
          set -euo pipefail
          domain="$(tr -d '[:space:]' < CNAME)"
          bash .github/scripts/landing_site_url.sh stamp public/index.html "https://${domain}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # actions/deploy-pages clamps its wait to 10 minutes and rejects any higher
      # `timeout` input, but a degraded Pages backend can take longer and still
      # publish successfully. So a timeout here is not conclusive — the verify
      # step decides whether the deployment actually landed.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify the published site
        if: steps.deployment.outcome != 'success'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || 'https://ewhasudo.zapto.org/' }}
        run: |
          base="${SITE_URL%/}"
          # Absolute deadline, not an iteration count: an unresponsive host makes
          # every curl burn its full --max-time, so counting iterations would let
          # the poll run ~46 minutes and get killed by timeout-minutes instead.
          deadline=$(( $(date +%s) + 1200 ))
          echo "deploy-pages did not confirm within its 10 minute cap."
          echo "Polling $base/version.txt for $GITHUB_SHA (up to 20 minutes)."
          while [ "$(date +%s)" -lt "$deadline" ]; do
            left=$(( deadline - $(date +%s) ))
            budget=$(( left < 20 ? left : 20 ))
            if [ "$budget" -lt 1 ]; then budget=1; fi
            # -L matters: page_url comes back as http:// on some runs and Pages
            # 301s to https, so without it curl returns the redirect body.
            live=$(curl -fsSL --max-time "$budget" -H 'Cache-Control: no-cache' \
              "$base/version.txt?cachebust=$(date +%s)" 2>/dev/null | tr -d '[:space:]') || live=''
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Site is serving $GITHUB_SHA — deployment landed after the action gave up."
              exit 0
            fi
            left=$(( deadline - $(date +%s) ))
            echo "  still serving '${live:-<unreachable>}' (${left}s left)"
            if [ "$left" -le 0 ]; then break; fi
            sleep $(( left < 15 ? left : 15 ))
          done
          echo "::error::Pages never served $GITHUB_SHA within 20 minutes. Check https://www.githubstatus.com before retrying."
          exit 1

      # 배포 후 링크 확인(#2841): 실제로 서빙되는 랜딩의 바로가기가 상대 경로이고, canonical 이
      # 이 배포 도메인이며, 같은 도메인의 /frontend/·/trainer/ 가 응답하는지 본다.
      - name: Check out landing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            CNAME
          sparse-checkout-cone-mode: false

      - name: Verify landing app links on the published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || 'https://ewhasudo.zapto.org/' }}
        run: |
          set -euo pipefail
          domain="$(tr -d '[:space:]' < CNAME)"
          bash .github/scripts/landing_site_url.sh verify "$SITE_URL" "https://${domain}/" 600
