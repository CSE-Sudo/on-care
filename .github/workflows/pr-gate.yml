name: PR Gate

# 브랜치 보호의 '최신 main 반영' 을 실제로 걸기 위한 앵커 검사(#807).
#
# GitHub 은 `Require branches to be up to date before merging`(API 의 `strict`)을
# **필수 상태 검사가 하나 이상 있을 때만** 적용한다. 필수 검사를 비워 두고 strict 만
# 켜면 설정은 저장되지만 아무것도 막지 않는다 — 실제로 그렇게 두었더니 main 보다
# 16 커밋 뒤진 PR 이 `BEHIND` 가 아니라 그냥 병합 가능으로 남았다.
#
# 기존 CI 세 개(user-app / trainer / backend)는 전부 `paths` 필터를 쓴다. 그것을
# 필수로 지정하면 해당 경로를 건드리지 않는 PR 에서는 검사가 **생성되지 않아**
# 영원히 대기한다(백엔드만 고치는 PR 이 사용자앱 검사를 기다리는 식). 그래서
# 경로와 무관하게 항상 도는 이 검사를 필수로 삼는다.
#
# 이 검사는 코드 품질을 보지 않는다. 그 일은 각 CI 가 한다. 여기서 필요한 것은
# "모든 PR 에 반드시 존재하는 검사" 하나뿐이다.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the branch is current with the base
        # strict 규칙이 병합 버튼을 막는 실제 주체다. 이 단계는 왜 이 검사가
        # 있는지 로그에 남겨, 나중에 보는 사람이 빈 job 으로 오해하지 않게 한다.
        # GitHub context 값은 `run:` 본문에 직접 보간하지 않고 env 로 넘긴다 —
        # 셸 스크립트에 식이 그대로 박히는 주입 형태를 남기지 않기 위해서다(#1558).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "PR #${PR_NUMBER}"
          echo "base: ${BASE_REF}"
          echo "이 검사는 브랜치 보호의 최신화 요구를 걸기 위한 앵커다(#807)."

      - name: Check out the PR head with full history
        # 다른 워크플로와 같이 검토한 커밋 SHA 로 고정하고, 토큰을 .git/config 에
        # 남기지 않는다(#1554). 아래 `git fetch origin` 은 공개 저장소라 익명으로 된다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject AI co-author trailers
        # 2026-08-25: 커밋 하나에 붙은 `Co-Authored-By: Claude …` 때문에 GitHub
        # 기여자 그래프에 봇 계정이 잡혔고, 지우려고 main 이력을 재작성해야 했다.
        # 게다가 옛 SHA 위에 쌓인 브랜치가 그대로 병합되면서 지운 커밋이 되살아났다.
        # 사람이 매번 확인하는 대신 여기서 막는다 — base..head 를 보므로 새 커밋뿐
        # 아니라 '옛 이력을 다시 끌고 들어오는 병합'도 함께 걸린다.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          base=$(git merge-base FETCH_HEAD HEAD)

          offenders=""
          for sha in $(git log --format='%H' "$base..HEAD"); do
            if git log -1 --format='%B' "$sha" \
              | grep -qiE '^[[:space:]]*(co-authored-by:[[:space:]]*claude|co-authored-by:.*@anthropic\.com|(generated|created) with[[:space:]]+.*claude)'; then
              offenders="$offenders$(git log -1 --format='  %h %an: %s' "$sha")"$'\n'
            fi
          done

          if [ -n "$offenders" ]; then
            echo "::error::AI 저작 표기가 남은 커밋이 있습니다. 아래 커밋의 메시지를 고치거나, 최신 $BASE_REF 위로 리베이스한 뒤 다시 푸시하세요."
            printf '%s' "$offenders"
            exit 1
          fi
          echo "AI 저작 표기 없음 ($base..HEAD)."

      - name: Test the action pin checker
        # 아래 검사가 오탐하면 필수 검사인 이 job 이 모든 PR 병합을 막는다. 그래서
        # 검사 스크립트 자체의 테스트(통과·위반 픽스처)를 먼저 돌린다(#2340).
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool/ci -p 'test_*.py' -v

      - name: Require SHA-pinned actions
        # 태그(`@v4`)·브랜치 참조는 가리키는 커밋이 바뀔 수 있다(#1554). 워크플로의
        # 외부 action·재사용 워크플로는 40자 커밋 SHA 로만 허용하고, 위반은 파일·줄에
        # 주석으로 남긴다. 로컬 action(`./...`)과 `docker://` 참조는 예외다(#2340).
        # 검사 대상은 PR head 의 워크플로이므로, 이 PR 이 새로 넣는 태그 참조도 걸린다.
        env:
          WORKFLOW_DIR: .github/workflows
        run: |
          set -euo pipefail
          python3 tool/ci/check_action_pins.py "$WORKFLOW_DIR"

      - name: Install gitleaks
        # 비밀값 스캐너(#2837). gitleaks-action 은 조직 저장소에 유료 라이선스를 요구해
        # 공식 릴리스 바이너리를 버전·SHA-256 으로 고정해 받는다. 체크섬이 다르면 멈춘다.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Test the secret scanner config
        # 필수 검사라 오탐하면 모든 PR 이 막히고, 못 잡으면 검사가 있으나 마나다. 그래서
        # 실제 검사 전에 두 방향을 확인한다 — 예시 env 파일의 자리표시자는 통과하고,
        # 실행 때 만든 가짜 토큰은 걸린다. 가짜 토큰은 저장소에 남기지 않는다.
        run: |
          set -euo pipefail
          ok_dir="$RUNNER_TEMP/gitleaks-ok"
          bad_dir="$RUNNER_TEMP/gitleaks-bad"
          mkdir -p "$ok_dir" "$bad_dir"
          cp backend/.env.example backend/.env.railway.example "$ok_dir/"
          if ! gitleaks dir "$ok_dir" --config .gitleaks.toml --no-banner --redact --exit-code 1; then
            echo "::error file=.gitleaks.toml::예시 env 파일의 자리표시자가 비밀값으로 잡힙니다. 허용 목록을 확인하세요."
            exit 1
          fi
          token=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("ghp_" + "".join(secrets.choice(a) for _ in range(36)))')
          printf 'GITHUB_TOKEN=%s\n' "$token" > "$bad_dir/leak.env"
          if gitleaks dir "$bad_dir" --config .gitleaks.toml --no-banner --redact --exit-code 1; then
            echo "::error file=.gitleaks.toml::가짜 토큰을 잡지 못했습니다. 설정이 기본 규칙을 꺼 버렸는지 확인하세요."
            exit 1
          fi
          echo "자리표시자 통과·가짜 토큰 차단 확인."

      - name: Scan the PR commits for secrets
        # PR 이 더한 커밋(merge-base..head)만 본다. 이미 이력에 남은 값의 처리는 이 검사의
        # 범위가 아니다(#2837). 걸리면 값을 지우는 것만으로는 부족하다 — 커밋 이력에 남으므로
        # 그 커밋을 고쳐 다시 푸시하고, 실제 키였다면 즉시 교체한다.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          base=$(git merge-base FETCH_HEAD HEAD)
          gitleaks git . --log-opts="$base..HEAD" --config .gitleaks.toml \
            --no-banner --redact --exit-code 1

      - name: Check landing app links
        # 소개 페이지는 Pages(데모)와 AWS(운영)에 같은 파일로 올라간다. 앱 바로가기에 절대 주소가
        # 들어오면 한쪽 방문자가 다른 배포로 넘어가므로, 상대 경로와 og:url·canonical 표시 줄을
        # 병합 전에 확인한다(#2841). 검사 스크립트의 경계도 함께 돌린다.
        run: |
          set -euo pipefail
          bash .github/scripts/test_landing_site_url.sh
          bash .github/scripts/landing_site_url.sh check index.html

      - name: Test the web cache header rules
        # 운영 웹 업로드가 진입 파일에 no-cache 를, 나머지에 짧은 max-age 를 주는지와 업로드 뒤
        # 헤더 검증의 경계를 가짜 aws 명령으로 확인한다(#3023).
        run: |
          set -euo pipefail
          bash .github/scripts/test_web_cache_headers.sh

      - name: Test the backend health verifier
        # 배포 뒤 healthz·version 판정(#2821·#3029)이 오탐하면 운영 배포가 막히고, 놓치면
        # 잘못 뜬 서버가 통과한다. 통과·실패 경계를 병합 전에 확인한다.
        run: |
          set -euo pipefail
          bash .github/scripts/test_verify_backend_health.sh

      - name: Test the demo divergence checker
        # 아래 검사가 오탐하면 필수 검사인 이 job 이 PR 병합을 막는다. 임시 저장소의
        # 가짜 diff 로 걸림·안 걸림·예외 통과를 먼저 확인한다(#2791).
        run: |
          set -euo pipefail
          bash .github/scripts/test_check_demo_divergence.sh

      - name: Reject new demo divergence in screen code
        # 데모와 실서버 화면이 다르면 데모가 기준이고, 실서버에만 있는 것은 데모에
        # 추가한다. 화면 코드(presentation/pages·widgets, shared/widgets)에 새로
        # 들어온 `useMockApi` 와 데모 저장소의 `supports… => false` 를 PR 이 추가한
        # 줄에서만 찾는다. 일부러 다르게 둔 곳은 .github/demo-divergence-allowlist.txt
        # 에 적으면 통과한다(#2791). 예외 목록에 없는 분기가 걸리면 실패한다 — 열린
        # PR 전체에 미리 돌려 막히는 PR 이 없는 것을 확인하고 바로 켰다. 낡은 예외
        # 항목은 경고·알림만 남긴다(#2796). 경고만 남기려면 DEMO_DIVERGENCE_MODE 를 warn 으로.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEMO_DIVERGENCE_MODE: fail
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"
          base=$(git merge-base FETCH_HEAD HEAD)
          bash .github/scripts/check_demo_divergence.sh "$base"
