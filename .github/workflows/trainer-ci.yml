name: Trainer CI

# 트레이너 Flutter 앱(frontend/flutter_trainer) 전용 PR/main CI.
# 배포(GitHub Pages, /trainer/)는 deploy.yml(#233)이 담당하고, 이 워크플로우는
# PR 단계에서 analyze/test + Drift WASM 포함 웹 빌드를 검증한다(#185 잔여 작업).
on:
  pull_request:
    paths:
      - "frontend/flutter_trainer/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      # 두 앱이 함께 쓰는 UI 규격 패키지(#1691).
      - "shared/oncare_ui/**"
      - ".github/workflows/trainer-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/flutter_trainer/**"
      # 김민수 데모 픽스처는 세 곳이 함께 읽는다 — 이것만 바뀌어도 돌아야 한다(#757).
      - "shared/demo_fixture/**"
      # 두 앱이 함께 쓰는 UI 규격 패키지(#1691).
      - "shared/oncare_ui/**"
      - ".github/workflows/trainer-ci.yml"

permissions:
  contents: read

concurrency:
  group: trainer-ci-${{ github.workflow }}-${{ github.ref }}
  # PR 실행만 취소한다. 같은 브랜치에 새 커밋이 오면 옛 실행은 볼 값이 없다.
  #
  # main 은 다르다. `github.ref` 가 병합마다 똑같이 `refs/heads/main` 이라,
  # 연달아 병합하면 앞선 검증이 취소된다 — 병합 뒤 검증이 안전망인데 빠르게
  # 병합할수록 그 안전망이 꺼진다. 2026-08-16 에 실제로 네 커밋이 검증되지
  # 않은 채 지나갔고, 다섯 번째에서야 깨진 것이 드러났다(#807).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter_trainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Flutter 를 고정한다. `channel: stable` 만 두면 새 stable 이 나온 순간
          # 아무도 코드를 건드리지 않았는데 CI 가 깨진다 — 실제로 3.47.0 에서
          # riverpod_lint 가 새 문법을 몰라 분석 도중 매달렸다(#659). 올릴 때는
          # 의도적으로 올린다.
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # `flutter analyze` 는 analysis_options.yaml 의 custom_lint 플러그인을
      # 실행하지 않는다(분석 서버 경로에서만 동작). riverpod_lint 규칙이
      # 여기서만 걸리므로 별도 단계로 돌린다 — 회원 앱 CI 와 같은 구성이다.
      - name: Custom lint (riverpod_lint)
        # 회원 앱 쪽에서 이 단계가 실패보다 **매달리는** 쪽으로 깨진 적이 있다 —
        # 플러그인이 분석 중 예외를 던지고도 프로세스가 끝나지 않아 러너가 죽을
        # 때까지 붙잡혔다(#659). 정상 실행은 1분 남짓이라 여유를 두고도 매달림은
        # 확실히 끊는다.
        timeout-minutes: 10
        run: dart run custom_lint

      - name: Test
        run: flutter test

  web-build:
    name: Build trainer web with Drift WASM
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: frontend/flutter_trainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Flutter 를 고정한다. `channel: stable` 만 두면 새 stable 이 나온 순간
          # 아무도 코드를 건드리지 않았는데 CI 가 깨진다 — 실제로 3.47.0 에서
          # riverpod_lint 가 새 문법을 몰라 분석 도중 매달렸다(#659). 올릴 때는
          # 의도적으로 올린다.
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 웹 빌드 전에 반드시 Drift 런타임(sqlite3.wasm + drift_worker.js)을 web/ 로 받아야 한다.
      - name: Download Drift WASM runtime
        run: bash tool/fetch_drift_wasm.sh

      - name: Verify Drift runtime files (source web/)
        run: |
          test -s web/sqlite3.wasm
          test -s web/drift_worker.js

      - name: Build trainer web
        run: flutter build web --release --base-href "/trainer/"

      # 다운로드뿐 아니라 최종 산출물에도 두 파일이 포함됐는지 확인(배포 시 404 방지).
      - name: Verify built Drift runtime files (build/web/)
        run: |
          test -s build/web/sqlite3.wasm
          test -s build/web/drift_worker.js
