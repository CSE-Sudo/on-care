name: Secret Scan

# 저장소 전체 이력의 비밀값 정기 검사(#3083).
#
# PR gate 의 gitleaks 는 PR 이 더한 커밋(merge-base..head)만 본다(#2837). 그래서 이미
# 이력에 들어간 값이나 PR 을 거치지 않은 푸시(관리자 직접 푸시·태그)는 다시 보지 않는다.
# 실제로 2026-05-04 커밋 하나가 실제 Gemini 키를 넣었고, 파일을 지운 뒤에도 이력에 남았다.
# 이 워크플로는 모든 브랜치·태그의 전체 이력을 같은 설정(.gitleaks.toml)으로 훑는다.
#
# 이미 폐기를 확인한 탐지는 .gitleaksignore 에 fingerprint 한 줄씩만 둔다. 경로나 규칙
# 단위로 허용 목록을 넓히지 않는다 — 넓히면 같은 자리에 새로 들어온 진짜 값도 지나간다.
on:
  schedule:
    # 매주 월요일 09:00 KST(00:00 UTC). Dependabot 업데이트 PR 이 열리는 날과 맞췄다.
    - cron: "0 0 * * 1"
  workflow_dispatch:
  pull_request:
    # 검사 설정이나 예외 목록을 바꾸는 PR 은 병합 전에 전체 이력으로 한 번 돌려 본다.
    # 예외를 잘못 지우면 여기서 빨갛게, 넓게 열면 리뷰에서 드러나게 하려는 것이다.
    paths:
      - ".github/workflows/secret-scan.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 전체 이력과 모든 브랜치·태그가 있어야 검사가 의미 있다.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # pr-gate.yml 과 같은 버전·SHA-256 으로 고정한다. 올릴 때는 두 곳을 함께 바꾼다.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the full history for secrets
        # --all 로 모든 ref(브랜치·태그)를 본다. --redact 라 로그에는 값 대신 REDACTED 가
        # 찍히고, 규칙·파일·커밋·Fingerprint 만 남는다. 저장소 루트의 .gitleaksignore 는
        # gitleaks 가 스스로 읽는다.
        # 걸리면: 실제 키면 먼저 폐기·교체하고, 폐기를 확인한 뒤에만 그 Fingerprint 를
        # .gitleaksignore 에 이유·이슈 번호와 함께 더한다(docs/team_workflow.md 6.3).
        run: |
          set -euo pipefail
          gitleaks git . --log-opts="--all" --config .gitleaks.toml \
            --no-banner --redact --verbose --exit-code 1
