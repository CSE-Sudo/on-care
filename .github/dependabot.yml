# 의존성 업데이트 PR 을 주 1회 받는다(#2837).
#
# 생태계마다 업데이트를 한 묶음(groups)으로 모아 PR 수를 줄인다 — 매주 많아야
# 생태계당 하나다. pip·pub 의 주 버전 변경은 자동 PR 로 받지 않는다(#2978) — 앱 전체
# 코드 수정이 따르므로 필요할 때 패키지별 이슈로 계획한다. 보안 업데이트는 ignore 와
# 별개로 계속 열린다.
# PR 처리 규칙은 docs/team_workflow.md "의존성 업데이트 PR" 을 따른다.
version: 2

updates:
  # 백엔드: requirements.in(직접 의존) → requirements.txt / requirements-dev.txt(잠금 파일).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 워크플로의 action. 커밋 SHA 고정(#1554·#2340)을 유지한 채 SHA 와 버전 주석을 함께 올린다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # 회원 앱·트레이너 웹(pubspec.lock). 공용 패키지(shared/*)는 두 앱이 경로로 물고 있어
  # 앱 쪽 잠금 파일에서 함께 올라간다. tool/ui_guard 는 analyzer 버전을 일부러 고정해
  # 두었으므로 넣지 않는다.
  - package-ecosystem: pub
    directories:
      - /frontend/flutter
      - /frontend/flutter_trainer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
    groups:
      flutter-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # flutter_localizations(SDK)가 intl 버전을 고정한다 — 앱에서 따로 올리면 의존성
      # 해석이 실패한다. Flutter SDK 를 올릴 때 함께 맞춘다.
      # 이 규칙은 intl 을 업데이트 대상으로 고르는 것만 막는다. Dependabot 이 더 새로운
      # Flutter SDK 로 의존성을 풀면 잠금 파일의 intl 은 그 SDK 고정 버전으로 따라 바뀐다 —
      # 처리 절차는 docs/team_workflow.md "pub 잠금 파일에 SDK 고정 패키지가 따라올 때"(#3319).
      - dependency-name: intl
      # 아래는 부 버전인데도 다른 패키지의 주 버전을 끌고 들어오는 업데이트다(#3319).
      # 위의 주 버전 제외는 업데이트 대상으로 고른 패키지에만 걸리고, 그 패키지를 올리려고
      # 함께 풀리는 패키지에는 걸리지 않는다. 그래서 끌고 들어오는 쪽을 막는다.
      #
      # analyzer 8 을 요구하는 버전 — riverpod_lint 2.x 가 analyzer 7 에 묶여 있어
      # riverpod_lint·flutter_riverpod 3.x 가 함께 올라온다. riverpod 3 이행을 마치면 지운다.
      - dependency-name: custom_lint
        versions: [">=0.8.0"]
      - dependency-name: build_runner
        versions: [">=2.10.0"]
      - dependency-name: drift_dev
        versions: [">=2.30.0"]
      # drift_dev 2.29 이하는 drift 2.30 미만만 받고, drift_flutter 0.2.8 은 drift 2.30
      # 이상을 요구한다 — 둘 다 drift_dev 를 2.30 으로 밀어 올린다. 위 세 줄과 함께 지운다.
      - dependency-name: drift
        versions: [">=2.30.0"]
      - dependency-name: drift_flutter
        versions: [">=0.2.8"]
      # geolocator_linux 가 package_info_plus 10 을 요구하는 버전 — win32 6 이 따라와
      # flutter_secure_storage 11 까지 올라온다. 두 패키지의 주 버전 이행을 마치면 지운다.
      - dependency-name: geolocator
        versions: [">=14.0.3"]
