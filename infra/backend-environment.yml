AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cost-safe per-environment resources for the OnCare backend on Amazon ECS
  Express Mode: attachment bucket, task/execution/infrastructure roles, the
  CloudFormation service role that updates the service, and the GitHub
  Environment deploy role (#3016, #3019, #3020).

# 환경(production/staging)마다 한 번씩 만든다. 리소스는 모두 비용이 없다(빈 버킷·역할).
# 실제로 돈이 드는 실행 서비스는 infra/backend-service.yml 이 만든다.
#
# 배포 권한 구조(#3019)
#  - GitHub 배포 역할은 GitHub Environment(`production`/`staging`) 형식 OIDC subject 만
#    믿는다. 브랜치 형식 토큰으로는 서비스를 바꿀 수 없다 — Environment 의 승인 규칙을
#    건너뛰는 길이 없다.
#  - 배포 역할 자체는 ECS·IAM 권한이 없다. 서비스 스택 갱신을 CloudFormation 에 맡기고,
#    실제 변경은 이 스택이 만든 CloudFormation 서비스 역할이 한다(PassRole 은 그 역할 하나).

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - production
      - staging
    Description: GitHub Environment name and resource suffix
  GitHubOwner:
    Type: String
    Default: CSE-Sudo
  GitHubRepository:
    Type: String
    Default: on-care
  GitHubOwnerId:
    Type: String
    Default: '265976266'
    AllowedPattern: '^[0-9]+$'
  GitHubRepositoryId:
    Type: String
    Default: '1174354664'
    AllowedPattern: '^[0-9]+$'
  ExistingGitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com OIDC provider
  AttachmentPrefix:
    Type: String
    Default: chat-attachments
    AllowedPattern: '^[a-z0-9][a-z0-9-]*$'
    Description: Same value as ATTACHMENT_S3_PREFIX (backend/docs/DEPLOY.md 5-1)

Resources:
  # 채팅 사진·리포트 PDF 바이트(#2817). 공개하지 않는다 — 다운로드는 늘 백엔드가 권한을
  # 확인한 뒤 흘려보낸다. 운영과 staging 은 DB 가 다르므로 버킷도 나눈다(#3020).
  AttachmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'oncare-attachments-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: OnCare
        - Key: Environment
          Value: !Ref EnvironmentName

  AttachmentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AttachmentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AttachmentBucket.Arn
              - !Sub '${AttachmentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # 이미지 pull·로그·비밀 주입. 비밀은 이 환경 이름으로 시작하는 Secrets Manager 비밀만 읽는다.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Pull the OnCare backend image and inject ${EnvironmentName} secrets'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: read-backend-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadEnvironmentSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:oncare/backend/${EnvironmentName}-*'

  # 앱 프로세스가 쓰는 권한 — 첨부 버킷 접두사 안만. `ListBucket` 을 빼면 없는 키에 404 대신
  # 403 이 와서 첨부 조회가 저장소 장애로 읽힌다(DEPLOY.md 5-1).
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'OnCare backend ${EnvironmentName} application role (attachments only)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: attachment-objects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AttachmentObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${AttachmentBucket.Arn}/${AttachmentPrefix}/*'
              - Sid: AttachmentListing
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AttachmentBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${AttachmentPrefix}/*'

  # Express Mode 가 ALB·대상 그룹·보안 그룹·오토스케일링을 대신 만들고 고치는 역할.
  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'ECS Express Mode infrastructure role for OnCare backend ${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices'

  # 서비스 스택(infra/backend-service.yml)을 갱신하는 CloudFormation 서비스 역할.
  # 배포 워크플로는 `aws cloudformation deploy --role-arn` 으로 이 역할을 넘기기만 한다.
  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'CloudFormation applies the OnCare backend ${EnvironmentName} service stack'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-express-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageExpressService
                Effect: Allow
                Action:
                  - ecs:*ExpressGatewayService*
                  - ecs:CreateCluster
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeServiceDeployments
                  - ecs:DescribeServiceRevisions
                  - ecs:DescribeTaskDefinition
                  - ecs:ListServiceDeployments
                  - ecs:ListTagsForResource
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource: '*'
              - Sid: PassServiceRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                  - !GetAtt InfrastructureRole.Arn
              - Sid: ReadImports
                Effect: Allow
                Action:
                  - cloudformation:ListExports
                  - cloudformation:ListImports
                Resource: '*'

  # GitHub Actions(`environment: <EnvironmentName>`)가 쓰는 배포 역할(#3019).
  GitHubBackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Deploy the OnCare backend ${EnvironmentName} service from its GitHub Environment'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub Environment 이름은 대소문자를 가리지 않는다(저장소에 `Production` 으로
              # 만들어 두어도 워크플로의 `production` 과 같은 환경이다).
              StringEqualsIgnoreCase:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${EnvironmentName}'
      Policies:
        - PolicyName: deploy-backend-service-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ApplyServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/oncare-backend-${EnvironmentName}/*'
              - Sid: TemplateValidation
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationDeployRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  AttachmentBucketName:
    Description: ATTACHMENT_S3_BUCKET for this environment
    Value: !Ref AttachmentBucket
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-AttachmentBucket'
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-TaskExecutionRoleArn'
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-TaskRoleArn'
  InfrastructureRoleArn:
    Value: !GetAtt InfrastructureRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-InfrastructureRoleArn'
  CloudFormationDeployRoleArn:
    Description: GitHub Environment variable AWS_BACKEND_CFN_ROLE_ARN
    Value: !GetAtt CloudFormationDeployRole.Arn
  GitHubDeployRoleArn:
    Description: GitHub Environment variable AWS_BACKEND_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubBackendDeployRole.Arn
  ServiceStackName:
    Description: GitHub Environment variable BACKEND_STACK_NAME
    Value: !Sub 'oncare-backend-${EnvironmentName}'
  SecretName:
    Description: Secrets Manager secret the service stack reads (create it with the JSON keys in DEPLOY.md)
    Value: !Sub 'oncare/backend/${EnvironmentName}'
