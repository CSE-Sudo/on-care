AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cost-safe per-environment resources for the OnCare backend on Amazon ECS
  Express Mode: attachment bucket, task/execution/infrastructure roles, the
  CloudFormation service role that updates the service, and the GitHub
  Environment deploy role (#3016, #3019, #3020).

# 환경(production/staging)마다 한 번씩 만든다. 리소스는 모두 비용이 없다(빈 버킷·역할).
# 실제로 돈이 드는 실행 서비스는 infra/backend-service.yml 이 만든다.
#
# 배포 권한 구조(#3019)
#  - GitHub 배포 역할은 GitHub Environment(`production`/`staging`) 형식 OIDC subject 만
#    믿는다. 브랜치 형식 토큰으로는 서비스를 바꿀 수 없다 — Environment 의 승인 규칙을
#    건너뛰는 길이 없다.
#  - 배포 역할 자체는 ECS·IAM 권한이 없다. 서비스 스택 갱신을 CloudFormation 에 맡기고,
#    실제 변경은 이 스택이 만든 CloudFormation 서비스 역할이 한다(PassRole 은 그 역할 하나).

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - production
      - staging
    Description: GitHub Environment name and resource suffix
  GitHubOwner:
    Type: String
    Default: CSE-Sudo
  GitHubRepository:
    Type: String
    Default: on-care
  GitHubOwnerId:
    Type: String
    Default: '265976266'
    AllowedPattern: '^[0-9]+$'
  GitHubRepositoryId:
    Type: String
    Default: '1174354664'
    AllowedPattern: '^[0-9]+$'
  ExistingGitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com OIDC provider
  AttachmentPrefix:
    Type: String
    Default: chat-attachments
    AllowedPattern: '^[a-z0-9][a-z0-9-]*$'
    Description: Same value as ATTACHMENT_S3_PREFIX (backend/docs/DEPLOY.md 5-1)
  # 운영 배포 직전 DB 백업(#1552)을 지우기까지의 일수. 탈퇴한 회원의 정보가 이 기간 동안 백업에
  # 남으므로 docs/privacy_processing.md 의 보관 기간과 함께 바꾼다.
  BackupRetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 90
  # 서비스(infra/backend-service.yml)가 도는 ECS 클러스터. Express Mode 는 지정하지 않으면 `default`
  # 클러스터를 쓴다. 배포 역할의 백업 작업 권한을 이 클러스터로 좁힌다(#1552).
  ServiceClusterName:
    Type: String
    Default: default
    AllowedPattern: '^[A-Za-z0-9_-]+$'

Conditions:
  # DB 백업은 운영만 한다. staging(데모)은 백업하지 않는다(DEPLOY.md 2-1).
  IsProduction: !Equals [!Ref EnvironmentName, production]

Resources:
  # 채팅 사진·리포트 PDF 바이트(#2817). 공개하지 않는다 — 다운로드는 늘 백엔드가 권한을
  # 확인한 뒤 흘려보낸다. 운영과 staging 은 DB 가 다르므로 버킷도 나눈다(#3020).
  AttachmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'oncare-attachments-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: OnCare
        - Key: Environment
          Value: !Ref EnvironmentName

  AttachmentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AttachmentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AttachmentBucket.Arn
              - !Sub '${AttachmentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # 운영 DB 덤프(#1552). 배포 직전마다 일회성 ECS 작업(infra/backend-service.yml
  # BackupTaskDefinition)이 `db/` 아래에 올린다. 공개하지 않고, 보관 기간이 지나면 지운다.
  BackupBucket:
    Type: AWS::S3::Bucket
    Condition: IsProduction
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'oncare-db-backups-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-db-backups
            Status: Enabled
            ExpirationInDays: !Ref BackupRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: OnCare
        - Key: Environment
          Value: !Ref EnvironmentName

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsProduction
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub '${BackupBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # 백업 작업 로그. 실행 역할의 관리형 정책은 로그 스트림 생성·쓰기만 하므로 그룹을 여기서 만든다.
  BackupLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProduction
    Properties:
      LogGroupName: !Sub '/oncare/backend/${EnvironmentName}/db-backup'
      RetentionInDays: 30

  # 백업 작업이 쓰는 권한 — 백업 버킷 `db/` 아래에 올리기만. 읽기·지우기는 없다.
  BackupTaskRole:
    Type: AWS::IAM::Role
    Condition: IsProduction
    Properties:
      Description: !Sub 'OnCare backend ${EnvironmentName} database backup task (upload only)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: upload-db-backups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadBackups
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:PutObject
                Resource: !Sub '${BackupBucket.Arn}/db/*'

  # 이미지 pull·로그·비밀 주입. 비밀은 이 환경 이름으로 시작하는 Secrets Manager 비밀만 읽는다.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Pull the OnCare backend image and inject ${EnvironmentName} secrets'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: read-backend-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadEnvironmentSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:oncare/backend/${EnvironmentName}-*'

  # 앱 프로세스가 쓰는 권한 — 첨부 버킷 접두사 안만. `ListBucket` 을 빼면 없는 키에 404 대신
  # 403 이 와서 첨부 조회가 저장소 장애로 읽힌다(DEPLOY.md 5-1).
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'OnCare backend ${EnvironmentName} application role (attachments only)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: attachment-objects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AttachmentObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${AttachmentBucket.Arn}/${AttachmentPrefix}/*'
              - Sid: AttachmentListing
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AttachmentBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${AttachmentPrefix}/*'

  # Express Mode 가 ALB·대상 그룹·보안 그룹·오토스케일링을 대신 만들고 고치는 역할.
  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'ECS Express Mode infrastructure role for OnCare backend ${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices'

  # 서비스 스택(infra/backend-service.yml)을 갱신하는 CloudFormation 서비스 역할.
  # 배포 워크플로는 `aws cloudformation deploy --role-arn` 으로 이 역할을 넘기기만 한다.
  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'CloudFormation applies the OnCare backend ${EnvironmentName} service stack'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-express-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageExpressService
                Effect: Allow
                Action:
                  - ecs:*ExpressGatewayService*
                  - ecs:CreateCluster
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeServiceDeployments
                  - ecs:DescribeServiceRevisions
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:ListServiceDeployments
                  - ecs:ListTagsForResource
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource: '*'
              - Sid: PassServiceRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                  - !GetAtt InfrastructureRole.Arn
                  # 운영만: 백업 작업 정의(infra/backend-service.yml BackupTaskDefinition)
                  - !If [IsProduction, !GetAtt BackupTaskRole.Arn, !Ref AWS::NoValue]
              - Sid: ReadImports
                Effect: Allow
                Action:
                  - cloudformation:ListExports
                  - cloudformation:ListImports
                Resource: '*'

  # GitHub Actions(`environment: <EnvironmentName>`)가 쓰는 배포 역할(#3019).
  GitHubBackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Deploy the OnCare backend ${EnvironmentName} service from its GitHub Environment'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub Environment 이름은 대소문자를 가리지 않는다(저장소에 `Production` 으로
              # 만들어 두어도 워크플로의 `production` 과 같은 환경이다).
              StringEqualsIgnoreCase:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${EnvironmentName}'
      Policies:
        - PolicyName: deploy-backend-service-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ApplyServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/oncare-backend-${EnvironmentName}/*'
              - Sid: TemplateValidation
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationDeployRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              # 운영 배포 직전 DB 백업(#1552). 서비스 스택이 정의한 백업 작업 하나만 띄우고, 끝날
              # 때까지 보고, 덤프가 올라왔는지 목록만 본다(덤프 내용은 읽지 못한다).
              - !If
                - IsProduction
                - Sid: RunBackupTask
                  Effect: Allow
                  Action: ecs:RunTask
                  Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/oncare-backend-${EnvironmentName}-db-backup:*'
                  # 서비스가 도는 클러스터에서만(Express Mode 기본 클러스터).
                  Condition:
                    ArnEquals:
                      ecs:cluster: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ServiceClusterName}'
                - !Ref AWS::NoValue
              - !If
                - IsProduction
                - Sid: WatchBackupTask
                  Effect: Allow
                  Action:
                    - ecs:DescribeServices
                    - ecs:DescribeTasks
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ServiceClusterName}/oncare-backend-${EnvironmentName}'
                    - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ServiceClusterName}/*'
                - !Ref AWS::NoValue
              # 시간 초과·잡 취소 때 띄운 백업 작업을 멈춘다(백업이 겹치지 않게).
              - !If
                - IsProduction
                - Sid: StopBackupTask
                  Effect: Allow
                  Action: ecs:StopTask
                  Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ServiceClusterName}/*'
                  Condition:
                    ArnEquals:
                      ecs:cluster: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ServiceClusterName}'
                - !Ref AWS::NoValue
              - !If
                - IsProduction
                - Sid: PassBackupTaskRoles
                  Effect: Allow
                  Action: iam:PassRole
                  Resource:
                    - !GetAtt TaskExecutionRole.Arn
                    - !GetAtt BackupTaskRole.Arn
                  Condition:
                    StringEquals:
                      iam:PassedToService: ecs-tasks.amazonaws.com
                - !Ref AWS::NoValue
              - !If
                - IsProduction
                - Sid: CheckBackupObject
                  Effect: Allow
                  Action: s3:ListBucket
                  Resource: !GetAtt BackupBucket.Arn
                  Condition:
                    StringLike:
                      s3:prefix: 'db/*'
                - !Ref AWS::NoValue
              - !If
                - IsProduction
                - Sid: ReadBackupLogs
                  Effect: Allow
                  Action: logs:GetLogEvents
                  Resource: !GetAtt BackupLogGroup.Arn
                - !Ref AWS::NoValue

Outputs:
  AttachmentBucketName:
    Description: ATTACHMENT_S3_BUCKET for this environment
    Value: !Ref AttachmentBucket
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-AttachmentBucket'
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-TaskExecutionRoleArn'
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-TaskRoleArn'
  InfrastructureRoleArn:
    Value: !GetAtt InfrastructureRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-InfrastructureRoleArn'
  CloudFormationDeployRoleArn:
    Description: GitHub Environment variable AWS_BACKEND_CFN_ROLE_ARN
    Value: !GetAtt CloudFormationDeployRole.Arn
  GitHubDeployRoleArn:
    Description: GitHub Environment variable AWS_BACKEND_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubBackendDeployRole.Arn
  ServiceStackName:
    Description: GitHub Environment variable BACKEND_STACK_NAME
    Value: !Sub 'oncare-backend-${EnvironmentName}'
  SecretName:
    Description: Secrets Manager secret the service stack reads (create it with the JSON keys in DEPLOY.md)
    Value: !Sub 'oncare/backend/${EnvironmentName}'
  BackupBucketName:
    Condition: IsProduction
    Description: Database backup bucket (DEPLOY.md 2-1)
    Value: !Ref BackupBucket
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-BackupBucket'
  BackupTaskRoleArn:
    Condition: IsProduction
    Value: !GetAtt BackupTaskRole.Arn
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-BackupTaskRoleArn'
  BackupLogGroupName:
    Condition: IsProduction
    Value: !Ref BackupLogGroup
    Export:
      Name: !Sub 'oncare-backend-${EnvironmentName}-BackupLogGroup'
