AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting for the OnCare Flutter web apps

Parameters:
  GitHubOwner:
    Type: String
    Default: CSE-Sudo
  GitHubRepository:
    Type: String
    Default: on-care
  GitHubOwnerId:
    Type: String
    Default: '265976266'
    AllowedPattern: '^[0-9]+$'
    Description: Immutable numeric GitHub organization or owner ID
  GitHubRepositoryId:
    Type: String
    Default: '1174354664'
    AllowedPattern: '^[0-9]+$'
    Description: Immutable numeric GitHub repository ID
  GitHubBranch:
    Type: String
    Default: main
  UseImmutableGitHubOidcSubject:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Use GitHub's owner-ID and repository-ID based OIDC subject format
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Optional ARN of an existing token.actions.githubusercontent.com OIDC provider
  # 배포 job 이 GitHub Environment 에서 돌면 OIDC subject 가 `environment:<이름>` 이 된다(#3019).
  # 승인 규칙을 Environment 에 두고, 이 역할은 그 subject 를 믿는다.
  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    Description: GitHub Environment the deploy job runs in
  # 옮겨 가는 동안만 true. 워크플로가 Environment 로 도는 것을 확인한 뒤 false 로 스택을
  # 다시 적용하면 브랜치 형식 토큰으로는 더 이상 배포할 수 없다.
  AllowBranchOidcSubject:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Also trust the branch-based subject during the move to GitHub Environments

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  UseImmutableGitHubOidcSubjectCondition: !Equals [!Ref UseImmutableGitHubOidcSubject, 'true']
  AllowBranchOidcSubjectCondition: !Equals [!Ref AllowBranchOidcSubject, 'true']

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 배포는 릴리스마다 별도 prefix 를 쓰고 origin pointer 만 전환하므로 되돌리기의
      # 1차 수단은 이전 prefix 다. 버전 관리는 그 위의 안전망 — 실수로 덮어쓰거나
      # 지운 객체를 복구할 수 있게 한다.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # 지운 릴리스가 남긴 delete marker 까지 정리해 목록 조회가 느려지지 않게 한다.
          - Id: expire-orphaned-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Access the private frontend bucket from CloudFront only
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-router'
      AutoPublish: true
      FunctionConfig:
        Comment: Route Flutter paths to the matching single-page app
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri === '/frontend' || uri === '/frontend/') {
            request.uri = '/frontend/index.html';
          } else if (uri.indexOf('/frontend/') === 0 && !uri.split('/').pop().includes('.')) {
            request.uri = '/frontend/index.html';
          } else if (uri === '/trainer' || uri === '/trainer/') {
            request.uri = '/trainer/index.html';
          } else if (uri.indexOf('/trainer/') === 0 && !uri.split('/').pop().includes('.')) {
            request.uri = '/trainer/index.html';
          } else if (uri === '/' || !uri.split('/').pop().includes('.')) {
            request.uri = '/index.html';
          }

          return request;
        }

  FrontendCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-cache'
        Comment: Short cache for frontend assets during early deployment
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: OnCare frontend
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref FrontendCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRouterFunction.FunctionARN
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3-origin
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_200
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: OnCare

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubFrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Deploy the frontend to S3 and CloudFront from the GitHub production Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustGitHubEnvironment
            Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Environment 이름은 대소문자를 가리지 않는다(저장소의 `Production` = `production`).
              StringEqualsIgnoreCase:
                token.actions.githubusercontent.com:sub: !If
                  - UseImmutableGitHubOidcSubjectCondition
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubEnvironment}'
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}'
          - !If
            - AllowBranchOidcSubjectCondition
            - Sid: TrustMainBranchDuringMove
              Effect: Allow
              Principal:
                Federated: !If
                  - CreateGitHubOidcProvider
                  - !Ref GitHubOidcProvider
                  - !Ref ExistingGitHubOidcProviderArn
              Action: sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: !If
                    - UseImmutableGitHubOidcSubjectCondition
                    - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}'
                    - !Sub 'repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: deploy-frontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListFrontendBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt FrontendBucket.Arn
              - Sid: ManageFrontendObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${FrontendBucket.Arn}/*'
              - Sid: ManageFrontendInvalidations
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
              # 릴리스 전환은 distribution 의 OriginPath 를 바꾸는 것이 전부다.
              # 검증 실패 시 되돌리는 것도 같은 권한을 쓴다.
              - Sid: SwitchFrontendRelease
                Effect: Allow
                Action:
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  BucketName:
    Description: GitHub repository variable AWS_FRONTEND_BUCKET
    Value: !Ref FrontendBucket
  DistributionId:
    Description: GitHub repository variable AWS_FRONTEND_DISTRIBUTION_ID
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Description: Initial frontend URL before a custom domain is connected
    Value: !GetAtt FrontendDistribution.DomainName
  GitHubDeployRoleArn:
    Description: GitHub repository variable AWS_FRONTEND_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubFrontendDeployRole.Arn
  GitHubOidcProviderArn:
    Description: GitHub Actions OIDC provider created or reused by this stack
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
