AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting for the OnCare Flutter web apps

Parameters:
  # 응답 헤더 CSP 의 connect-src 를 이 출처로 좁힌다(#3017). 두 웹 앱의 API_BASE_URL 에서
  # 경로(/v1)를 뺀 값 — 예: https://<운영 API 도메인>. 끝 `/` 없이.
  ApiOrigin:
    Type: String
    AllowedPattern: '^https://[a-z0-9.-]+(:[0-9]{2,5})?$'
    Description: Origin of the production API (API_BASE_URL without /v1)
  # 그 밖에 앱이 직접 요청을 보내는 출처(공백으로 구분). 웹에서 오류 보고를 켜면 SENTRY_DSN 의
  # 수집 출처(https://oNNN.ingest.<지역>.sentry.io)를 넣는다. 비우면 추가하지 않는다.
  ExtraConnectSources:
    Type: String
    Default: ''
    AllowedPattern: '^(https://[a-z0-9.-]+(:[0-9]{2,5})?( https://[a-z0-9.-]+(:[0-9]{2,5})?)*)?$'
    Description: Optional space-separated extra https origins for connect-src
  # 운영 도메인(#3021). 둘 다 비우면 CloudFront 기본 도메인·기본 인증서 그대로다.
  # 인증서는 CloudFront 규칙상 us-east-1 의 ACM 인증서만 쓸 수 있다.
  AlternateDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+)?$'
    Description: Optional production domain for the distribution (leave empty to use the CloudFront domain)
  AcmCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]{36})?$'
    Description: Optional us-east-1 ACM certificate ARN for AlternateDomainName
  GitHubOwner:
    Type: String
    Default: CSE-Sudo
  GitHubRepository:
    Type: String
    Default: on-care
  GitHubOwnerId:
    Type: String
    Default: '265976266'
    AllowedPattern: '^[0-9]+$'
    Description: Immutable numeric GitHub organization or owner ID
  GitHubRepositoryId:
    Type: String
    Default: '1174354664'
    AllowedPattern: '^[0-9]+$'
    Description: Immutable numeric GitHub repository ID
  GitHubBranch:
    Type: String
    Default: main
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Optional ARN of an existing token.actions.githubusercontent.com OIDC provider
  # 배포 job 이 GitHub Environment 에서 돌면 OIDC subject 가 `environment:<이름>` 이 된다(#3019).
  # 승인 규칙을 Environment 에 두고, 이 역할은 그 subject 를 믿는다.
  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    Description: GitHub Environment the deploy job runs in
  # 옮겨 가는 동안만 true. 워크플로가 Environment 로 도는 것을 확인한 뒤 false 로 스택을
  # 다시 적용하면 브랜치 형식 토큰으로는 더 이상 배포할 수 없다.
  AllowBranchOidcSubject:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Also trust the branch-based subject during the move to GitHub Environments

Rules:
  # 도메인과 인증서는 함께 채우거나 함께 비운다(#3021).
  CustomDomainNeedsCertificate:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref AlternateDomainName, '']
            - !Equals [!Ref AcmCertificateArn, '']
          - !And
            - !Not [!Equals [!Ref AlternateDomainName, '']]
            - !Not [!Equals [!Ref AcmCertificateArn, '']]
        AssertDescription: AlternateDomainName and AcmCertificateArn must be set together

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref AlternateDomainName, '']]
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  AllowBranchOidcSubjectCondition: !Equals [!Ref AllowBranchOidcSubject, 'true']

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 배포는 릴리스마다 별도 prefix 를 쓰고 origin pointer 만 전환하므로 되돌리기의
      # 1차 수단은 이전 prefix 다. 버전 관리는 그 위의 안전망 — 실수로 덮어쓰거나
      # 지운 객체를 복구할 수 있게 한다.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # 지운 릴리스가 남긴 delete marker 까지 정리해 목록 조회가 느려지지 않게 한다.
          - Id: expire-orphaned-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Access the private frontend bucket from CloudFront only
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-router'
      AutoPublish: true
      FunctionConfig:
        Comment: Route Flutter paths to the matching single-page app
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // 끝 `/` 없는 앱 주소는 `/` 를 붙여 돌려보낸다. 앱 경로의 응답 헤더 정책은
          // `/member/*`·`/trainer/*` 동작에만 걸리므로, 여기서 바로 index.html 을 주면
          // 소개 페이지 정책으로 앱이 나간다(#3017).
          if (uri === '/member' || uri === '/trainer') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: uri + '/' } }
            };
          }

          if (uri === '/member/') {
            request.uri = '/member/index.html';
          } else if (uri.indexOf('/member/') === 0 && !uri.split('/').pop().includes('.')) {
            request.uri = '/member/index.html';
          } else if (uri === '/trainer/') {
            request.uri = '/trainer/index.html';
          } else if (uri.indexOf('/trainer/') === 0 && !uri.split('/').pop().includes('.')) {
            request.uri = '/trainer/index.html';
          } else if (uri === '/' || !uri.split('/').pop().includes('.')) {
            request.uri = '/index.html';
          }

          return request;
        }

  FrontendCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-cache'
        Comment: Short cache for frontend assets during early deployment
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # 응답 보안 헤더(#3017). meta 로는 걸리지 않는 HSTS·frame-ancestors 를 여기서 붙이고,
  # CSP 는 두 앱 web/index.html 의 meta 와 같은 지시어에 connect-src 만 API 출처로 좁힌다.
  # 브라우저는 meta 와 헤더 CSP 를 둘 다 적용(교집합)하므로 운영에서는 이쪽이 실제 한도다.
  # 지시어를 바꿀 때는 두 index.html 도 같이 바꾼다 — tool/ci/test_frontend_csp.py 가 검사한다.
  FrontendAppResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-app-headers'
        Comment: Security headers for the member and trainer web apps
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' ${ApiOrigin} https://www.gstatic.com https://fonts.gstatic.com https://dapi.kakao.com ${ExtraConnectSources}; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        # 회원 웹은 사진 촬영·헬스장 찾기(현재 위치)를 쓴다. 그 밖의 기기 권한은 막는다.
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), interest-cohort=()'
              Override: true

  # 소개 페이지(/)·version.txt 등 앱 밖 경로. 소개 페이지는 인라인 스크립트(스크롤 효과·메뉴)를
  # 쓰고 로그인·회원 데이터가 없어 script-src 에 'unsafe-inline' 을 허용한다. 대신 외부 요청은
  # 막고(connect-src 'self') 다른 사이트의 iframe 에는 넣을 수 없게 한다.
  FrontendLandingResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-landing-headers'
        Comment: Security headers for the landing page and other non-app paths
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    # AcmCertificateArn 의 빈 기본값은 HasCustomDomain 이 거짓일 때만 쓰여 인증서 자리에 들어가지 않는다.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      DistributionConfig:
        Comment: OnCare frontend
        Aliases: !If
          - HasCustomDomain
          - - !Ref AlternateDomainName
          - !Ref AWS::NoValue
        # 두 앱 경로는 앱 헤더 정책을 쓴다. 캐시·함수는 기본 동작과 같다.
        CacheBehaviors:
          - PathPattern: /member/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref FrontendCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt FrontendRouterFunction.FunctionARN
            ResponseHeadersPolicyId: !Ref FrontendAppResponseHeadersPolicy
            TargetOriginId: frontend-s3-origin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: /trainer/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref FrontendCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt FrontendRouterFunction.FunctionARN
            ResponseHeadersPolicyId: !Ref FrontendAppResponseHeadersPolicy
            TargetOriginId: frontend-s3-origin
            ViewerProtocolPolicy: redirect-to-https
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref FrontendCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRouterFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref FrontendLandingResponseHeadersPolicy
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3-origin
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_200
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: OnCare

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubFrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Deploy the frontend to S3 and CloudFront from the GitHub production Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustGitHubEnvironment
            Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Environment 이름은 대소문자를 가리지 않는다(저장소의 `Production` = `production`).
              StringEqualsIgnoreCase:
                # ID 기반 subject 하나만 신뢰한다(#3089). 이름 기반(repo:<소유자>/<저장소>)은
                # 같은 이름을 다시 쓰는 다른 저장소도 맞출 수 있어 두지 않는다 — 백엔드 역할과 같다.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubEnvironment}'
          - !If
            - AllowBranchOidcSubjectCondition
            - Sid: TrustMainBranchDuringMove
              Effect: Allow
              Principal:
                Federated: !If
                  - CreateGitHubOidcProvider
                  - !Ref GitHubOidcProvider
                  - !Ref ExistingGitHubOidcProviderArn
              Action: sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}'
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: deploy-frontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListFrontendBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt FrontendBucket.Arn
              - Sid: ManageFrontendObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${FrontendBucket.Arn}/*'
              - Sid: ManageFrontendInvalidations
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
              # 릴리스 전환은 distribution 의 OriginPath 를 바꾸는 것이 전부다.
              # 검증 실패 시 되돌리는 것도 같은 권한을 쓴다.
              - Sid: SwitchFrontendRelease
                Effect: Allow
                Action:
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  BucketName:
    Description: GitHub repository variable AWS_FRONTEND_BUCKET
    Value: !Ref FrontendBucket
  DistributionId:
    Description: GitHub repository variable AWS_FRONTEND_DISTRIBUTION_ID
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Description: CloudFront domain (the DNS target for AlternateDomainName)
    Value: !GetAtt FrontendDistribution.DomainName
  SiteDomain:
    Description: Domain visitors use (AlternateDomainName, or the CloudFront domain)
    Value: !If
      - HasCustomDomain
      - !Ref AlternateDomainName
      - !GetAtt FrontendDistribution.DomainName
  GitHubDeployRoleArn:
    Description: GitHub repository variable AWS_FRONTEND_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubFrontendDeployRole.Arn
  GitHubOidcProviderArn:
    Description: GitHub Actions OIDC provider created or reused by this stack
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
