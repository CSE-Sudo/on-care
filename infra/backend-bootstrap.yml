AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cost-safe shared bootstrap for the OnCare backend on Amazon ECS Express Mode
  (ECR repository and the GitHub role that pushes images). Environment-specific
  roles and buckets live in infra/backend-environment.yml (#3016).

# 계정에 한 번만 만든다. 이미지 저장소와 "이미지를 올리는" 권한만 둔다 — 서비스를
# 바꾸는 권한은 환경(production/staging)별 스택의 배포 역할이 따로 갖는다(#3019).
# 이미지 푸시는 GitHub Environment 승인 전에 돌기 때문에 이 역할만 브랜치(main) 형식
# OIDC subject 를 믿는다.

Parameters:
  GitHubOwner:
    Type: String
    Default: CSE-Sudo
  GitHubRepository:
    Type: String
    Default: on-care
  GitHubOwnerId:
    Type: String
    Default: '265976266'
    AllowedPattern: '^[0-9]+$'
  GitHubRepositoryId:
    Type: String
    Default: '1174354664'
    AllowedPattern: '^[0-9]+$'
  GitHubBranch:
    Type: String
    Default: main
  ExistingGitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com OIDC provider

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: oncare-backend
      EmptyOnDelete: false
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        # 운영·staging 이 같은 저장소를 쓰고, 배포 실패 때 직전 digest 로 되돌린다(#3019).
        # 되돌아갈 이미지가 지워지지 않도록 넉넉히 남긴다.
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the twenty newest backend images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {"type": "expire"}
              }
            ]
          }

  GitHubBackendImagePushRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Build and push main-branch backend images to ECR from GitHub Actions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: push-oncare-backend-images
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushBackendImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt BackendRepository.Arn

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  EcrRepositoryArn:
    Value: !GetAtt BackendRepository.Arn
    Export:
      Name: oncare-backend-EcrRepositoryArn
  GitHubImagePushRoleArn:
    Description: GitHub repository variable AWS_BACKEND_IMAGE_PUSH_ROLE_ARN
    Value: !GetAtt GitHubBackendImagePushRole.Arn
