<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans KR', sans-serif; }
  </style>
  <defs>
    <marker id="sl" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2E7DAB"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#17435F" text-anchor="start">On-Care — Service Data Flow</text>
  <text x="40" y="82" font-size="13.5" font-weight="400" fill="#5A7A90" text-anchor="start">회원의 기록이 트레이너의 코칭이 되어 돌아오는 하나의 순환</text>
  <path d="M 934,48 H 962" fill="none" stroke="#2E7DAB" stroke-width="1.8" marker-end="url(#sl)"/>
  <text x="970" y="52" font-size="11" font-weight="600" fill="#5A7A90" text-anchor="start">기록 · 전달</text>
  <path d="M 1058,48 H 1086" fill="none" stroke="#2E7DAB" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#sl)"/>
  <text x="1094" y="52" font-size="11" font-weight="600" fill="#5A7A90" text-anchor="start">코칭 회신</text>

  <text x="40" y="212" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start" letter-spacing="1.6">FLOW</text>
  <text x="40" y="344" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start" letter-spacing="1.6">FEEDBACK</text>

  <rect x="190" y="150" width="220" height="110" rx="12" fill="#EAF2F9" stroke="#9DC3E0" stroke-width="1.8"/>
  <text x="300" y="196" font-size="19" font-weight="700" fill="#17435F" text-anchor="middle">회원</text>
  <text x="300" y="220" font-size="11.5" font-weight="400" fill="#5A7A90" text-anchor="middle">식단 사진 · 간단 입력</text>

  <rect x="535" y="138" width="280" height="134" rx="12" fill="#17435F" stroke="#17435F" stroke-width="1.8"/>
  <text x="675" y="192" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">On-Care</text>
  <text x="675" y="216" font-size="11.5" font-weight="400" fill="#B9D2E4" text-anchor="middle">AI 자동 인식 · 회원별 · 날짜별 정리</text>
  <text x="675" y="236" font-size="11.5" font-weight="400" fill="#B9D2E4" text-anchor="middle">주간 리포트 생성</text>

  <rect x="940" y="150" width="220" height="110" rx="12" fill="#EAF2F9" stroke="#9DC3E0" stroke-width="1.8"/>
  <text x="1050" y="196" font-size="19" font-weight="700" fill="#17435F" text-anchor="middle">트레이너</text>
  <text x="1050" y="220" font-size="11.5" font-weight="400" fill="#5A7A90" text-anchor="middle">세션 · 루틴 · 피드백</text>

  <text x="472" y="190" font-size="10.5" font-weight="600" fill="#2E7DAB" text-anchor="middle">식단 · 운동 기록</text>
  <path d="M 414,205 H 531" fill="none" stroke="#2E7DAB" stroke-width="1.8" marker-end="url(#sl)"/>

  <text x="877" y="190" font-size="10.5" font-weight="600" fill="#2E7DAB" text-anchor="middle">정리된 리포트</text>
  <path d="M 819,205 H 936" fill="none" stroke="#2E7DAB" stroke-width="1.8" marker-end="url(#sl)"/>

  <text x="675" y="332" font-size="10.5" font-weight="600" fill="#2E7DAB" text-anchor="middle">데이터 기반 맞춤 코칭 · 운동 루틴</text>
  <path d="M 1050,264 V 326 Q 1050,340 1036,340 H 314 Q 300,340 300,326 V 266" fill="none" stroke="#2E7DAB" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#sl)"/>

  <text x="40" y="414" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start">Palette — 시스템 아키텍처 그림과 같은 규칙. 브랜드 기본색 #3EAFDF · #2E7DAB · #17435F 의 명도 단계만 사용하고, 두 사람을 잇는 서비스를 짙은 면으로 강조.</text>
</svg>
