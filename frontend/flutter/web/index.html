<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Content-Security-Policy(#2828). 페이지에 스크립트가 주입돼도 돌지 못하게 한다 —
    인라인 <script> 는 허용하지 않으므로(script-src 에 'unsafe-inline' 없음) 이 파일의
    스크립트는 모두 같은 출처 파일(js/·pdfjs/)로 둔다. 실제로 불러오는 출처만 연다:
    - script-src: 자기 출처, CanvasKit(www.gstatic.com), 카카오맵 SDK(dapi.kakao.com →
      t1.daumcdn.net). 'wasm-unsafe-eval' 은 CanvasKit·drift(sqlite3.wasm) 컴파일용이다.
    - style-src: Flutter 엔진이 실행 중 <style>·style 속성을 만들므로 'unsafe-inline'.
    - font-src·connect-src: 엔진의 대체 글꼴(fonts.gstatic.com)과 CanvasKit wasm 내려받기.
    - connect-src 의 https: 는 API 주소가 빌드마다 달라서다(로컬 개발은 localhost).
    - frame-src blob: 는 `printing` 의 웹 인쇄용 iframe, worker-src 는 pdf.js·drift 워커.
    - accounts.google.com/gsi/: 구글 로그인 버튼(Google Identity Services, #330) — 스크립트·
      버튼 스타일·버튼 iframe. 카카오 웹 로그인은 팝업(kauth.kakao.com)과 같은 출처 콜백
      페이지(kakao_login_callback.html)라 따로 열 출처가 없다.
    운영(AWS CloudFront)은 infra/frontend-hosting.yml 의 FrontendAppResponseHeadersPolicy 가
    같은 지시어를 응답 헤더로 내리고 connect-src 를 API 출처로 좁힌다(#3017). 브라우저는 둘을
    함께 적용하므로 운영에서는 헤더 쪽이 한도다. frame-ancestors·HSTS 는 meta 로는 걸리지 않아
    헤더에서만 붙는다. GitHub Pages 데모는 응답 헤더를 바꿀 수 없어 이 meta 만 적용된다.
    지시어를 바꾸면 템플릿도 같이 바꾼다 — tool/ci/test_frontend_csp.py 가 둘을 비교한다.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://dapi.kakao.com https://t1.daumcdn.net https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' blob: https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- 라이트 전용이다(#1604). 브라우저가 다크 모드여도 첫 프레임 전 배경·스크롤바·
       주소창이 어둡게 칠해지지 않게 한다. 색은 앱 배경 토큰 OnCareColors.surfaceCard 과 같다. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    html, body { background-color: #FFFFFF; }
  </style>
  <!-- 로그인해야 쓰는 앱이라 검색 색인에서 뺀다(#3015). 검색에 걸려야 하는 것은
       저장소 루트의 소개 페이지뿐이다 — 앱 주소가 수집되면 빈 로그인 화면이
       검색 결과에 뜬다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="On-Care — 사진 한 장으로 식단을 기록하고, 트레이너에게 자동 요약 리포트를 전달하는 헬스케어 앱.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="On-Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>On-Care</title>
  <link rel="manifest" href="manifest.json">

  <!-- 한글·이모지 표시: 웹은 CanvasKit 으로만 그린다. 한글은 앱에 번들한 Pretendard,
       그 밖의 글자(이모지 등)는 엔진의 대체 글꼴(fonts.gstatic.com — CSP font-src 허용)이
       맡는다. HTML 렌더러용 글꼴 보정 스타일·스크립트는 CanvasKit 에서 효과가 없어
       지웠다(#3159). -->
</head>
<body>
  <!--
    PDF 미리보기용 pdf.js 를 올린 뒤 Flutter(`flutter_bootstrap.js`)를 띄운다(#2818).
    버전·보안 설정·순서의 이유는 `js/pdfjs_loader.js` 에 있다. 인라인 스크립트로
    두지 않는다(CSP).
  -->
  <script type="module" src="js/pdfjs_loader.js"></script>
</body>
</html>
