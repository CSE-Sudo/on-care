name: oncare
description: "Oncare prototype reconstructed in Flutter (Android / iOS / Web)."
publish_to: 'none'

# Versioning is managed via --build-name / --build-number at build time.
version: 0.3.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- State management & DI ---
  # 코드 생성(@riverpod)과 hooks 는 쓰지 않는다 — provider 를 직접 선언한다.
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^14.6.2

  # --- Networking ---
  # 요청 로깅은 core/network/interceptors/api_logging_interceptor.dart 가 한다.
  dio: ^5.7.0
  # NOTE: `retrofit` + `retrofit_generator` are reintroduced in Stage 4
  # when real API clients land. The 9.7.0 generator is currently
  # incompatible with retrofit 4.9.2 (switch on Parser is non-exhaustive
  # for Parser.DartMappable), which blocks `build_runner build`.

  # --- 데모 데이터 ---
  # 김민수의 하루는 트레이너 앱·백엔드와 같은 픽스처에서 온다(#757). 두 앱을
  # 나란히 놓고 시연하므로 각자 만들면 같은 날짜의 숫자가 어긋난다.
  demo_fixture:
    path: ../../shared/demo_fixture

  # --- UI 규격 ---
  # 두 앱이 같은 토큰·테마·컴포넌트를 쓴다(#1690). 화면마다 크기·색을 적지 않는다.
  oncare_ui:
    path: ../../shared/oncare_ui

  # --- Local persistence ---
  drift: ^2.20.3
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # --- UI / charts / animation ---
  fl_chart: ^0.69.2
  flutter_animate: ^4.5.0
  # 회원앱 아이콘은 Material Symbols Rounded 한 세트에서만 고른다(#1803). 목록은
  # lib/app/app_icons.dart 한 곳이다. 가변 글꼴 축(채움·굵기)을 쓰므로 버전을 묶는다.
  material_symbols_icons: 4.2960.0

  # 카카오맵 JS SDK 를 HtmlElementView 로 붙일 때 DOM 접근에 쓴다(web 전용 경로).
  web: ^1.1.0

  # --- i18n / utilities ---
  intl: any
  logger: ^2.4.0

  # --- Maps ---
  # 지도는 카카오맵으로 통일(#329) — 백엔드 장소 검색이 카카오 Local 이라 베이스맵도
  # 같은 출처로 맞춘다. 카카오는 Flutter 용 지도 SDK 가 없어 web 은 JS SDK 를
  # HtmlElementView 로 직접 삽입하므로 pub 의존성이 필요 없다.
  url_launcher: ^6.3.1
  # 인증된 API로 받은 리포트 PDF binary를 앱 안에서 미리보기한다(#778).
  printing: ^5.14.2
  # 첨부가 없는 리포트는 회원 기록으로 문서를 만들어 같은 미리보기로 연다(#1600).
  # printing 이 전이 의존성으로 끌고 오지만, 직접 import 하므로 명시한다.
  pdf: ^3.11.3
  image_picker: ^1.2.3

  # NOTE: Social-login SDKs (sign_in_with_apple / google_sign_in /
  # kakao_flutter_sdk_user / flutter_naver_login) are added in Stage 4
  # when the auth feature is implemented — they require native setup
  # (Info.plist / AndroidManifest / SDK keys) and are not just pub adds.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Codegen ---
  # drift 스키마(app_database.g.dart)가 유일한 생성 대상이다.
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

  # --- Lint plugins ---
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.3

  # --- Test helpers ---
  # 골든 테스트는 flutter_test 의 matchesGoldenFile 을 쓴다.
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true   # enables flutter gen-l10n via l10n.yaml (added in Phase 2.7)

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    # Pretendard (SIL OFL 1.1) — 두 앱 공통 한글 UI 서체 (#995).
    # 정적 4종만 담는다: 400/500/600/700 이 타입 스케일이 실제로 쓰는 굵기다.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

