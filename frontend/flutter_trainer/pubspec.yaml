name: oncare_trainer
description: "On-Care 트레이너 웹 — PT 담당 회원의 식단·운동 기록 확인과 코칭·루틴·스케줄 관리."
publish_to: 'none'

# 버전 이름(+ 앞)과 빌드 번호(+ 뒤)는 이 한 곳에서 정한다(#3047). 배포 워크플로는
# --build-name·--build-number 를 넘기지 않는다 — 화면의 버전(MY 아래)이 이 값을
# 빌드의 version.json 으로 읽는다. 올리는 규칙은 docs/mobile_release.md 1절.
version: 0.2.0+2

environment:
  sdk: ^3.12.0
  # `DropdownButtonFormField.initialValue` (성별·시각·기간 선택 등 다섯 곳이
  # 쓴다) 는 Flutter 3.35 에서 `value` 를 대신해 들어왔다. 그전에는 `3.27` 로
  # 적혀 있었는데(`Color.withValues` 기준), 그 사이 세 앱이 3.35 API 를 쓰기
  # 시작하면서 선언이 사실과 어긋났다 — 3.27 툴체인은 `pub get` 을 통과한 뒤
  # 위젯 다섯 개에서 컴파일이 깨진다. 이 줄이 있는 이유가 바로 그걸 막는
  # 것이라(아래 참고) 실제로 필요한 값으로 맞춘다.
  #
  # 잘못된 툴체인이 `pub get` 에서 걸리게 하려는 선언이다. CI 는 3.44.9 로
  # 고정돼 있어 이 값보다 위다.
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Localization (#501) ---
  # 사용자 앱과 같은 gen-l10n 파이프라인. arb 는 lib/l10n, 생성물은 lib/gen/l10n.
  flutter_localizations:
    sdk: flutter
  intl: any

  # --- State management & DI ---
  # 사용자 앱(frontend/flutter)과 동일한 Riverpod 기반. 트레이너 앱은
  # 별도 프로젝트이므로 코드는 공유하지 않고 스택만 맞춘다.
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^14.6.2

  # --- 외부 링크 ---
  # 고객 지원의 FAQ·1:1 문의는 운영 중인 카카오톡 채널로 보낸다(#2227).
  # 회원 앱과 같은 버전을 쓴다.
  url_launcher: ^6.3.1

  # --- Networking (real backend) ---
  # 사용자 앱(frontend/flutter)과 동일한 Dio 스택. USE_MOCK_API=false 일 때
  # 트레이너 API(POST /v1/auth/login, GET /v1/trainer/me, ...)를 호출한다.
  dio: ^5.7.0
  http_parser: ^4.0.2

  # 채팅에 붙일 사진을 고른다(#921). 웹에서는 파일 선택 창으로 동작한다.
  image_picker: ^1.2.3

  # WeeklyReport 데이터를 A4 PDF binary로 만들고, 브라우저 인쇄를 연다(#778).
  pdf: ^3.11.3
  printing: ^5.14.2

  # 세션 access/refresh 토큰을 플랫폼 보안 저장소(Keychain/Keystore/웹)에
  # 보관한다. 기존 SharedPreferences 기반 SessionTokenStore 를 대체한다.
  flutter_secure_storage: ^9.2.2

  # --- 데모 데이터 ---
  # 김민수(seed-client-1)의 하루는 사용자 앱·백엔드와 같은 픽스처에서 온다(#757).
  # 두 앱을 나란히 놓고 시연하므로 각자 만들면 같은 날짜의 숫자가 어긋난다.
  # 나머지 고객은 이 앱의 생성기가 그대로 만든다.
  demo_fixture:
    path: ../../shared/demo_fixture

  # --- 서버와 같은 계산 규칙 ---
  # 반올림·운동 유형 정규화·한국어 조사처럼 서버와 두 앱이 같은 값을 내야 하는
  # 규칙의 단일 원본(#2860, #2861, #2897). 앱마다 따로 적지 않는다.
  oncare_rules:
    path: ../../shared/oncare_rules

  # --- 네트워크·인증·시각 기반 ---
  # 토큰 갱신·인증/언어 헤더·요청 ID·폴링·KST 시계(#2907). 회원 앱과 같은
  # 백엔드 인증 규칙을 상대하므로 한 벌을 함께 쓴다. provider 는 앱에 둔다.
  oncare_core:
    path: ../../shared/oncare_core

  # --- UI 규격 ---
  # 두 앱이 같은 토큰·테마·컴포넌트를 쓴다(#1690). 화면마다 크기·색을 적지 않는다.
  oncare_ui:
    path: ../../shared/oncare_ui
  # 소속 헬스장 찾기 지도(#2543). 회원 앱 헬스장 찾기와 같은 위젯이다.
  oncare_kakao_map:
    path: ../../shared/oncare_kakao_map
  # 주간 리포트 결과지(#2652). 회원 앱이 여는 리포트와 한 위젯·한 계산이다.
  oncare_report:
    path: ../../shared/oncare_report
  # 트레이너웹 아이콘도 회원앱과 같은 Material Symbols Rounded 한 세트에서만
  # 고른다(#2466). 목록은 lib/app/app_icons.dart 한 곳이다. 가변 글꼴 축(채움·
  # 굵기)을 쓰므로 회원앱과 같은 버전으로 묶는다.
  material_symbols_icons: 4.2960.0

  # --- Local persistence ---
  # drift 시드/데모 및 기타 기능이 사용하는 앱 공용 prefs.
  shared_preferences: ^2.3.2

  # drift(SQLite) 로컬 백엔드 — 백엔드 미연결 동안 고객/스케줄 등 mock
  # 데이터를 영속 저장한다 (사용자 앱과 동일 스택, 코드는 공유하지 않음).
  drift: ^2.20.3
  drift_flutter: ^0.2.4
  package_info_plus: ^9.0.1
  web: ^1.1.1
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 실 API repository / 세션 로직 단위 테스트용 목킹(사용자 앱과 동일).
  mocktail: ^1.0.4

  # --- Codegen (drift) ---
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

  # --- Lint plugins ---
  # `flutter analyze` 는 analysis_options.yaml 의 custom_lint 플러그인을 돌리지
  # 않는다. `dart run custom_lint` 를 따로 돌려야 하고, CI 도 별도 단계로 둔다
  # (회원 앱과 동일한 구성).
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true   # l10n.yaml 기반 flutter gen-l10n 활성화 (#501)

  assets:
    - assets/images/
    # 데모 대화에서 트레이너가 보낸 첨부 PDF (#2663).
    - assets/demo/
    # Pretendard 글꼴 라이선스 전문 — 기동 때 라이선스 목록에 넣는다(#3150).
    # OFL 은 글꼴을 함께 배포할 때 라이선스 고지를 요구한다.
    - assets/fonts/Pretendard-OFL.txt

  fonts:
    # Pretendard (SIL OFL 1.1) — 두 앱 공통 한글 UI 서체 (#995).
    # 정적 4종만 담는다: 400/500/600/700 이 타입 스케일이 실제로 쓰는 굵기다.
    # 파일은 KS X 1001 한글·라틴·기호로 줄인 서브셋이다(#3142). 다시 만들 때는
    # tool/fonts/subset_pretendard.py, 글자 누락 검사는 tool/ci/check_font_coverage.py.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

