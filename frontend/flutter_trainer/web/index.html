<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Content-Security-Policy(#2828). 페이지에 스크립트가 주입돼도 돌지 못하게 한다 —
    인라인 <script> 는 허용하지 않으므로(script-src 에 'unsafe-inline' 없음) 이 파일의
    스크립트는 모두 같은 출처 파일(js/·pdfjs/)로 둔다. 실제로 불러오는 출처만 연다:
    - script-src: 자기 출처, CanvasKit(www.gstatic.com), 카카오맵 SDK(dapi.kakao.com →
      t1.daumcdn.net). 'wasm-unsafe-eval' 은 CanvasKit·drift(sqlite3.wasm) 컴파일용이다.
    - style-src: Flutter 엔진이 실행 중 <style>·style 속성을 만들므로 'unsafe-inline'.
    - font-src·connect-src: 엔진의 대체 글꼴(fonts.gstatic.com)과 CanvasKit wasm 내려받기.
    - connect-src 의 https: 는 API 주소가 빌드마다 달라서다(로컬 개발은 localhost).
    - frame-src blob: 는 `printing` 의 웹 인쇄용 iframe, worker-src 는 pdf.js·drift 워커.
    운영(AWS CloudFront)은 infra/frontend-hosting.yml 의 FrontendAppResponseHeadersPolicy 가
    같은 지시어를 응답 헤더로 내리고 connect-src 를 API 출처로 좁힌다(#3017). 브라우저는 둘을
    함께 적용하므로 운영에서는 헤더 쪽이 한도다. frame-ancestors·HSTS 는 meta 로는 걸리지 않아
    헤더에서만 붙는다. GitHub Pages 데모는 응답 헤더를 바꿀 수 없어 이 meta 만 적용된다.
    지시어를 바꾸면 템플릿도 같이 바꾼다 — tool/ci/test_frontend_csp.py 가 둘을 비교한다.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- 라이트 전용이다(#1604). 브라우저가 다크 모드여도 첫 프레임 전 배경·스크롤바가
       어둡게 칠해지지 않게 한다. 배경은 앱 배경 토큰 OnCareColors.surfacePage 와 같고,
       상단 바 색(theme-color)은 트레이너 브랜드 남색 OnCareBrand.trainer.primary 를 쓴다. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#235C88">
  <style>
    html, body { background-color: #F5F7FA; }
  </style>
  <!-- 부팅 중 로딩 표시와 부팅 실패 안내(#3152). 마크업은 <body> 의 #boot-status,
       언제 거두고 언제 실패 안내로 바꿀지는 js/boot_status.js 가 정한다. 색은 앱 토큰과
       같다 — 배경 surfacePage, 브랜드 남색 OnCareBrand.trainer.primary, 본문 textPrimary·
       textSecondary. 첫 프레임 전이라 번들 글꼴을 아직 못 쓰므로 시스템 글꼴로 그린다. -->
  <style>
    .boot {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 24px; box-sizing: border-box;
      background-color: #F5F7FA; color: #1A1A1A; text-align: center;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
        'Malgun Gothic', 'Noto Sans KR', sans-serif;
    }
    .boot-logo { width: 72px; height: 72px; }
    .boot-spinner {
      width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%;
      border: 3px solid rgba(35, 92, 136, 0.2); border-top-color: #235C88;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .boot-spinner { animation-duration: 2.4s; }
    }
    .boot-label {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    .boot-error { max-width: 360px; }
    .boot-error[hidden] { display: none; }
    .boot-error-text { margin: 0 0 16px; color: #465568; }
    .boot-reload {
      min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
      background-color: #235C88; color: #FFFFFF; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    .boot-reload:focus-visible { outline: 3px solid rgba(35, 92, 136, 0.4); outline-offset: 2px; }
    .boot-failed .boot-spinner { display: none; }
  </style>
  <!-- 로그인해야 쓰는 앱이라 검색 색인에서 뺀다(#3015). 검색에 걸려야 하는 것은
       저장소 루트의 소개 페이지뿐이다 — 앱 주소가 수집되면 빈 로그인 화면이
       검색 결과에 뜬다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="On-Care 트레이너 웹 — PT 담당 회원의 식단·운동 기록 확인과 코칭·루틴·스케줄 관리.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="On-Care 트레이너">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>On-Care 트레이너</title>
  <link rel="manifest" href="manifest.json">

  <!-- 한글·이모지 표시: 웹은 CanvasKit 으로만 그린다. 한글은 앱에 번들한 Pretendard,
       그 밖의 글자(이모지 등)는 엔진의 대체 글꼴(fonts.gstatic.com — CSP font-src 허용)이
       맡는다. HTML 렌더러용 글꼴 보정 스타일·스크립트는 CanvasKit 에서 효과가 없어
       지웠다(#3159). -->
  <!-- 예전 빌드가 설치한 서비스 워커를 지운다(#3204). 지금 빌드는 워커를 등록하지
       않는다(web/flutter_bootstrap.js). 남은 워커가 옛 main.dart.js 를 내주면 새로고침해도
       새 배포로 바뀌지 않는다. 인라인 금지(CSP)라 같은 출처 파일로 둔다. -->
  <script src="js/sw_cleanup.js"></script>
</head>
<body>
  <!-- 부팅 중 로딩 표시(#3152). 첫 프레임 전 화면 전체를 덮고, 첫 프레임에서 지운다. -->
  <div id="boot-status" class="boot" role="status" aria-live="polite">
    <img class="boot-logo" src="icons/Icon-192.png" alt="" width="72" height="72">
    <div class="boot-spinner" aria-hidden="true"></div>
    <span class="boot-label">트레이너 웹을 불러오는 중입니다</span>
    <div class="boot-error" hidden>
      <p class="boot-error-text">트레이너 웹을 불러오지 못했습니다. 연결을 확인하고 새로고침해 주세요.</p>
      <button type="button" class="boot-reload">새로고침</button>
    </div>
  </div>
  <noscript>
    <div class="boot">
      <img class="boot-logo" src="icons/Icon-192.png" alt="" width="72" height="72">
      <p>트레이너 웹은 JavaScript 가 필요합니다. 브라우저 설정에서 JavaScript 를 켜 주세요.</p>
      <p lang="en">The trainer web needs JavaScript. Please enable it in your browser settings.</p>
    </div>
  </noscript>
  <!-- 로딩 표시를 거두거나 실패 안내로 바꾼다. 부팅 스크립트의 로드 오류를 받으려면
       아래 pdf.js 로더(Flutter 를 띄움)보다 먼저 실행돼야 한다. -->
  <script src="js/boot_status.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    PDF 미리보기용 pdf.js 를 올린 뒤 Flutter(`flutter_bootstrap.js`)를 띄운다(#2818).
    버전·보안 설정·순서의 이유는 `js/pdfjs_loader.js` 에 있다. 인라인 스크립트로
    두지 않는다(CSP).
  -->
  <script type="module" src="js/pdfjs_loader.js"></script>
</body>
</html>
