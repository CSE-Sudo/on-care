<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- 라이트 전용이다(#1604). 브라우저가 다크 모드여도 첫 프레임 전 배경·스크롤바가
       어둡게 칠해지지 않게 한다. 배경은 앱 배경 토큰 OnCareColors.surfacePage 와 같고,
       상단 바 색(theme-color)은 트레이너 브랜드 남색 OnCareBrand.trainer.primary 를 쓴다. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#235C88">
  <style>
    html, body { background-color: #F5F7FA; }
  </style>
  <meta name="description" content="On-Care 트레이너 앱 — 트레이너용 회원 관리 / AI 루틴 / 스케줄 (Android / iOS / Web).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="On-Care 트레이너">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>On-Care 트레이너</title>
  <link rel="manifest" href="manifest.json">

  <!-- Ensure full Korean + emoji glyph coverage for the HTML web renderer.
       Flutter renders text inside the <flt-glass-pane> shadow DOM with an empty
       font-family, which can drop some Hangul/emoji glyphs (칭/짐/촌 등이 두부로
       보이는 증상). Setting the font on the shadow HOST (flt-glass-pane /
       flutter-view / body) lets the shadow content inherit it. Native
       (iOS/Android) rendering is unaffected. 사용자 앱(frontend/flutter)의
       동일 픽스와 폰트 스택을 맞춘다 — 두 앱의 한글이 달라 보이면 안 된다. -->
  <style>
    flt-glass-pane, flutter-view, body {
      font-family: 'Apple SD Gothic Neo', 'AppleGothic', 'Malgun Gothic',
        'Noto Sans KR', 'Apple Color Emoji', 'Segoe UI Emoji',
        'Noto Color Emoji', sans-serif !important;
    }
  </style>
  <script>
    // Flutter's HTML web renderer draws text inside the <flt-glass-pane> shadow
    // DOM and does not re-pick-up the inherited font until a style recalc; dev
    // (DDC) loads also render well after any fixed timeout. A MutationObserver
    // re-asserts the font whenever the shadow DOM changes, so it works at any
    // load speed and after scroll/navigation. Native/CanvasKit are unaffected.
    (function () {
      var STACK =
        "'Apple SD Gothic Neo','AppleGothic','Malgun Gothic','Noto Sans KR','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      var el, pending = false;
      function reapply() {
        pending = false;
        if (el) el.remove();
        el = document.createElement('style');
        el.textContent =
          'flt-glass-pane, flutter-view, body { font-family: ' + STACK + ' !important; }';
        document.head.appendChild(el);
      }
      function schedule() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(reapply);
      }
      (function watch() {
        var gp = document.querySelector('flt-glass-pane');
        if (gp && gp.shadowRoot) {
          new MutationObserver(schedule).observe(gp.shadowRoot, {
            childList: true,
            subtree: true,
            characterData: true,
          });
          reapply();
        } else {
          setTimeout(watch, 150);
        }
      })();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    PDF 미리보기용 pdf.js 를 올린 뒤 Flutter(`flutter_bootstrap.js`)를 띄운다(#2818).
    버전·보안 설정·순서의 이유는 `js/pdfjs_loader.js` 에 있다. 인라인 스크립트로
    두지 않는다(CSP).
  -->
  <script type="module" src="js/pdfjs_loader.js"></script>
</body>
</html>
