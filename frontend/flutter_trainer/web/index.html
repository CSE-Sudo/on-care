<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="On-Care 트레이너 앱 — 트레이너용 회원 관리 / AI 루틴 / 스케줄 (Android / iOS / Web).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="On-Care 트레이너">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>On-Care 트레이너</title>
  <link rel="manifest" href="manifest.json">

  <!-- Ensure full Korean + emoji glyph coverage for the HTML web renderer.
       Flutter renders text inside the <flt-glass-pane> shadow DOM with an empty
       font-family, which can drop some Hangul/emoji glyphs (칭/짐/촌 등이 두부로
       보이는 증상). Setting the font on the shadow HOST (flt-glass-pane /
       flutter-view / body) lets the shadow content inherit it. Native
       (iOS/Android) rendering is unaffected. 사용자 앱(frontend/flutter)의
       동일 픽스와 폰트 스택을 맞춘다 — 두 앱의 한글이 달라 보이면 안 된다. -->
  <style>
    flt-glass-pane, flutter-view, body {
      font-family: 'Apple SD Gothic Neo', 'AppleGothic', 'Malgun Gothic',
        'Noto Sans KR', 'Apple Color Emoji', 'Segoe UI Emoji',
        'Noto Color Emoji', sans-serif !important;
    }
  </style>
  <script>
    // Flutter's HTML web renderer draws text inside the <flt-glass-pane> shadow
    // DOM and does not re-pick-up the inherited font until a style recalc; dev
    // (DDC) loads also render well after any fixed timeout. A MutationObserver
    // re-asserts the font whenever the shadow DOM changes, so it works at any
    // load speed and after scroll/navigation. Native/CanvasKit are unaffected.
    (function () {
      var STACK =
        "'Apple SD Gothic Neo','AppleGothic','Malgun Gothic','Noto Sans KR','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      var el, pending = false;
      function reapply() {
        pending = false;
        if (el) el.remove();
        el = document.createElement('style');
        el.textContent =
          'flt-glass-pane, flutter-view, body { font-family: ' + STACK + ' !important; }';
        document.head.appendChild(el);
      }
      function schedule() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(reapply);
      }
      (function watch() {
        var gp = document.querySelector('flt-glass-pane');
        if (gp && gp.shadowRoot) {
          new MutationObserver(schedule).observe(gp.shadowRoot, {
            childList: true,
            subtree: true,
            characterData: true,
          });
          reapply();
        } else {
          setTimeout(watch, 150);
        }
      })();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    채팅 PDF 첨부 미리보기가 쓰는 pdf.js. 저장소에 함께 싣고 여기서 먼저 올린다.

    `printing` 패키지는 웹에서 PDF 를 pdf.js 로 그리는데, 아무것도 안 두면 화면을
    여는 순간 unpkg.com 에서 최신 빌드를 받아 온다. 데모가 남의 CDN 이 살아 있는지에
    걸리고, 그 최신 빌드는 `Promise.withResolvers` 를 써서 Safari 17.4 아래에서는
    아예 돌지 않는다. 게다가 pdf.js 를 못 올리면 `printing` 은 오류를 내는 대신
    잠금을 쥔 채 멈춰서, 미리보기가 영영 스피너만 돈다.

    그래서 오래된 사파리에서도 도는 3.x 레거시 빌드를 직접 싣고, `pdfjsLib` 를 미리
    올려 둔다. 이러면 `printing` 은 자기 로더를 아예 건너뛴다.
  -->
  <script src="pdfjs/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      // 워커 주소는 절대 경로로 준다 — base href 가 `/trainer/` 라 상대 경로는
      // 어디서 푸느냐에 따라 달라진다.
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(
        "pdfjs/pdf.worker.min.js",
        document.baseURI,
      ).href;
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
