<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Content-Security-Policy(#2828). 페이지에 스크립트가 주입돼도 돌지 못하게 한다 —
    인라인 <script> 는 허용하지 않으므로(script-src 에 'unsafe-inline' 없음) 이 파일의
    스크립트는 모두 같은 출처 파일(js/·pdfjs/)로 둔다. 실제로 불러오는 출처만 연다:
    - script-src: 자기 출처, CanvasKit(www.gstatic.com), 카카오맵 SDK(dapi.kakao.com →
      t1.daumcdn.net). 'wasm-unsafe-eval' 은 CanvasKit·drift(sqlite3.wasm) 컴파일용이다.
    - style-src: Flutter 엔진이 실행 중 <style>·style 속성을 만들므로 'unsafe-inline'.
    - font-src·connect-src: 엔진의 대체 글꼴(fonts.gstatic.com)과 CanvasKit wasm 내려받기.
    - connect-src 의 https: 는 API 주소가 빌드마다 달라서다(로컬 개발은 localhost).
    - frame-src blob: 는 `printing` 의 웹 인쇄용 iframe, worker-src 는 pdf.js·drift 워커.
    정적 호스팅(CloudFront)은 같은 정책을 응답 헤더로 내리고 connect-src 를 API 출처로
    좁힌다 — frame-ancestors·HSTS 는 meta 로는 걸리지 않아 헤더에서만 붙는다.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://dapi.kakao.com https://t1.daumcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- 라이트 전용이다(#1604). 브라우저가 다크 모드여도 첫 프레임 전 배경·스크롤바가
       어둡게 칠해지지 않게 한다. 배경은 앱 배경 토큰 OnCareColors.surfacePage 와 같고,
       상단 바 색(theme-color)은 트레이너 브랜드 남색 OnCareBrand.trainer.primary 를 쓴다. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#235C88">
  <style>
    html, body { background-color: #F5F7FA; }
  </style>
  <meta name="description" content="On-Care 트레이너 앱 — 트레이너용 회원 관리 / AI 루틴 / 스케줄 (Android / iOS / Web).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="On-Care 트레이너">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>On-Care 트레이너</title>
  <link rel="manifest" href="manifest.json">

  <!-- Ensure full Korean + emoji glyph coverage for the HTML web renderer.
       Flutter renders text inside the <flt-glass-pane> shadow DOM with an empty
       font-family, which can drop some Hangul/emoji glyphs (칭/짐/촌 등이 두부로
       보이는 증상). Setting the font on the shadow HOST (flt-glass-pane /
       flutter-view / body) lets the shadow content inherit it. Native
       (iOS/Android) rendering is unaffected. 사용자 앱(frontend/flutter)의
       동일 픽스와 폰트 스택을 맞춘다 — 두 앱의 한글이 달라 보이면 안 된다. -->
  <style>
    flt-glass-pane, flutter-view, body {
      font-family: 'Apple SD Gothic Neo', 'AppleGothic', 'Malgun Gothic',
        'Noto Sans KR', 'Apple Color Emoji', 'Segoe UI Emoji',
        'Noto Color Emoji', sans-serif !important;
    }
  </style>
  <!-- 위 스타일을 shadow DOM 변화마다 다시 거는 스크립트(인라인 금지 — CSP). -->
  <script src="js/font_fix.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    채팅 PDF 첨부 미리보기가 쓰는 pdf.js. 저장소에 함께 싣고 여기서 먼저 올린다.

    `printing` 패키지는 웹에서 PDF 를 pdf.js 로 그리는데, 아무것도 안 두면 화면을
    여는 순간 unpkg.com 에서 최신 빌드를 받아 온다. 데모가 남의 CDN 이 살아 있는지에
    걸리고, 그 최신 빌드는 `Promise.withResolvers` 를 써서 Safari 17.4 아래에서는
    아예 돌지 않는다. 게다가 pdf.js 를 못 올리면 `printing` 은 오류를 내는 대신
    잠금을 쥔 채 멈춰서, 미리보기가 영영 스피너만 돈다.

    그래서 오래된 사파리에서도 도는 3.x 레거시 빌드를 직접 싣고, `pdfjsLib` 를 미리
    올려 둔다. 이러면 `printing` 은 자기 로더를 아예 건너뛴다.
  -->
  <script src="pdfjs/pdf.min.js"></script>
  <script src="js/pdfjs_worker.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
