# 검사를 통과해야 하는 워크플로 예시(check_action_pins 테스트용, 실제로 돌지 않는다).
name: Pinned fixture

on:
  pull_request:

jobs:
  call-reusable:
    uses: octo-org/shared/.github/workflows/build.yml@0123456789abcdef0123456789abcdef01234567 # v1.2.0

  build:
    runs-on: ubuntu-latest
    steps:
      # 주석 안의 태그 참조는 검사하지 않는다: uses: actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      - name: Quoted reference
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
      - name: Action in a subdirectory
        uses: github/codeql-action/init@0123456789abcdef0123456789abcdef01234567
      - name: Local action
        uses: ./.github/actions/setup
      - name: Docker image
        uses: docker://alpine:3.20
      - name: Plain shell step
        run: echo "uses 라는 단어가 run 본문에 있어도 키가 아니면 무시한다"
