name: oncare_rules
description: "서버와 두 앱(회원 앱·트레이너 웹)이 같은 값을 내야 하는 계산 규칙의 단일 원본 — 반올림·운동 유형·한국어 조사."
publish_to: 'none'
version: 0.1.0

# 회원 앱(^3.10.0)과 트레이너 앱(^3.12.0) 양쪽이 쓰므로 더 낮은 쪽에 맞춘다.
environment:
  sdk: ^3.10.0

# Flutter 에 기대지 않는 순수 Dart 패키지다(demo_fixture 와 같다). 같은 입력 표
# (`vectors/*.json`)를 백엔드 pytest 도 읽어, 서버 규칙과 이 패키지가 같은 답을
# 내는지 양쪽에서 본다.
dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0
