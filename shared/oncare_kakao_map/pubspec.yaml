name: oncare_kakao_map
description: "On-Care 두 앱(회원앱 헬스장 찾기·트레이너웹 소속 헬스장 찾기)이 함께 쓰는 카카오맵 위젯 (#2543)."
publish_to: 'none'
version: 0.1.0

# 회원 앱(^3.10.0)과 트레이너 앱(^3.12.0) 양쪽이 쓰므로 더 낮은 쪽에 맞춘다.
environment:
  sdk: ^3.10.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  # 카카오맵 JS SDK 를 `HtmlElementView` 로 얹는다. 두 앱이 이미 쓰는 패키지다.
  web: ^1.1.0
  # 안드로이드·iOS 에서 같은 JS SDK 를 띄운다(#3043). Flutter 팀이 관리하는
  # WebView 로, iOS WKWebView·안드로이드 WebView 를 그대로 쓴다.
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 테스트에서 WebView 를 가짜 구현으로 바꿔 끼운다.
  webview_flutter_platform_interface: ^2.10.0
