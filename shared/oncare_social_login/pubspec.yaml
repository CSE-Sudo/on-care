name: oncare_social_login
description: "On-Care 두 앱(회원 앱·트레이너 웹)이 함께 쓰는 카카오·구글 로그인 연동 (#330)."
publish_to: 'none'
version: 0.1.0

# 회원 앱(^3.10.0)과 트레이너 앱(^3.12.0) 양쪽이 쓰므로 더 낮은 쪽에 맞춘다.
# 카카오 SDK 2.x 가 Flutter 3.38 이상을 요구한다(두 앱 CI 는 3.44.9 고정).
environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  # 카카오 웹 로그인 팝업·콜백 수신(BroadcastChannel). 두 앱이 이미 쓰는 패키지다.
  web: ^1.1.0
  # 모바일 카카오 로그인 — 카카오가 관리하는 공식 Flutter SDK. 카카오톡 앱 로그인과
  # 카카오계정(브라우저) 로그인을 둘 다 감싸고, 앱 키별 리다이렉트 스킴을 처리한다.
  # 웹 로그인은 지원하지 않아(notSupported) 웹은 인가 코드 + 서버 교환으로 간다.
  kakao_flutter_sdk_user: ^2.0.1
  # 구글 로그인 — Flutter 팀이 관리하는 공식 플러그인. Android 는 Credential Manager,
  # iOS 는 Google Sign-In SDK, 웹은 Google Identity Services 버튼을 쓴다.
  google_sign_in: ^7.2.0
  # 웹 전용 GIS 버튼(`renderButton`). google_sign_in 의 웹 구현이라 버전을 함께 맞춘다.
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
