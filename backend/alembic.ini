# Alembic configuration for the On-Care backend.
#
# Keep this file ASCII-only. Alembic reads it with the *locale* encoding
# (ConfigParser.read(..., encoding="locale")), which is cp949 on Korean
# Windows. Non-ASCII bytes here make every `alembic` command fail there with
# UnicodeDecodeError while Linux CI stays green, and PYTHONUTF8=1 does not
# help -- PEP 686 keeps encoding="locale" on the locale encoding.
# Korean notes live in migrations/env.py and README.md instead.
#
# The DB URL is not hardcoded here: migrations/env.py reads it from the app
# settings (DATABASE_URL in .env).
[alembic]
script_location = migrations
prepend_sys_path = .
# Revision filenames look like 0001_slug.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
