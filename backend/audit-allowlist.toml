# 의존성 감사(pip-audit) 허용 목록(#3163).
#
# 백엔드 CI 의 감사 잡은 잠금 파일(requirements-dev.txt)에서 알려진 취약점이 나오면 실패한다.
# 당장 고칠 수 없는 항목만 아래 형식으로 올리고, 재검토 날짜가 지나면 CI 가 다시 실패한다.
# 검사 규칙은 tool/ci/pip_audit_gate.py 에 있다.
#
#  - id        : pip-audit 가 보여 주는 id 또는 별칭(GHSA-…·PYSEC-…·CVE-…) 하나
#  - package   : 패키지 이름
#  - reason    : 왜 지금 고칠 수 없는지, 우리 코드가 그 취약 경로를 쓰는지
#  - review_by : 다시 볼 날짜(따옴표 없는 YYYY-MM-DD, 오늘부터 180일 이내). 이날까지 통과
#
# 고친 버전이 나오면 잠금 파일을 올리고 항목을 지운다. 보고되지 않는 항목은 감사 잡이 경고로 알린다.
#
# 예시(주석):
# [[ignore]]
# id = "GHSA-xxxx-xxxx-xxxx"
# package = "example-package"
# reason = "고친 버전이 아직 없고, 취약한 함수(파서 X)를 앱에서 부르지 않는다."
# review_by = 2026-12-31
#
# 지금은 허용 항목이 없다(2026-10 기준 잠금 파일에서 보고된 취약점 없음).
