services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oncare-db
    environment:
      POSTGRES_USER: oncare
      POSTGRES_PASSWORD: oncare
      POSTGRES_DB: oncare
    ports:
      # 이 PC 에서만 연다(#3089). 기본 계정(oncare/oncare)이라 0.0.0.0 에 열면 같은 Wi-Fi 의
      # 다른 기기가 붙을 수 있다. app 컨테이너는 compose 내부망(db:5432)으로 붙는다.
      - "127.0.0.1:5432:5432"
    volumes:
      - oncare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncare"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: oncare-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://oncare:oncare@db:5432/oncare
      TZ: Asia/Seoul          # 오늘/어제 등 날짜 라벨을 KST 기준으로 계산
    env_file:
      - .env
    ports:
      - "8000:8000"
volumes:
  oncare_pgdata:
