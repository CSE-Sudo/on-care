# 백엔드 린트 설정(#3163). CI 의 `Lint (ruff)` 잡이 `ruff check .` 로 읽는다.
#
# 처음에는 **오류 계열만** 본다 — 스타일(줄 길이·import 순서 등)은 넣지 않는다.
#  - F  : pyflakes — 정의되지 않은 이름, 쓰지 않는 import·변수, 가려진 이름 등
#  - E9 : 문법·입출력 오류(파싱 실패)
# 규칙을 넓힐 때는 같은 PR 에서 기존 위반을 정리해 CI 가 늘 통과하게 둔다.
target-version = "py312"

[lint]
select = ["F", "E9"]
