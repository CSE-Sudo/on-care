# 비밀값 스캔 설정(#2837). 두 곳이 이 설정을 함께 쓴다 — PR gate(pr-gate.yml)는 PR 의 새
# 커밋(base..head)만, 주 1회 정기 검사(secret-scan.yml, #3083)는 모든 브랜치·태그의 전체 이력을
# 본다. 폐기를 확인한 이력 속 탐지는 여기가 아니라 .gitleaksignore 에 Fingerprint 로만 뺀다.
#
# gitleaks 기본 규칙(클라우드 키·토큰·개인 키 등)을 그대로 쓰고, 오탐만 아래에서 뺀다.
# 허용 목록은 좁게 유지한다 — 넓게 열면 진짜 값도 같이 통과한다. 새 오탐은 먼저
# 값을 자리표시자로 바꿀 수 없는지 보고, 정말 필요할 때만 여기에 이유와 함께 더한다.
# 한 줄만 예외로 둘 때는 그 줄 끝에 `gitleaks:allow` 주석을 단다.
title = "on-care gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "예시 env 파일·문서의 자리표시자(실제 값이 아님을 이름으로 드러낸 값)"
regexTarget = "secret"
regexes = [
  '''^CHANGE_ME[A-Za-z0-9_.-]*$''',
  '''(?i)^(your|my)[_-][A-Za-z0-9_.-]*$''',
  '''(?i)^[A-Za-z0-9_.-]*(placeholder|example|dummy)[A-Za-z0-9_.-]*$''',
]


[[allowlists]]
description = "테스트 코드의 가짜 비밀번호(`signup-pw-1234` 처럼 `-pw-숫자` 로 끝나는 값) — 테스트 파일 안에서만"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[A-Za-z0-9]+(-[A-Za-z0-9]+)*-pw-[0-9]+$''']
paths = [
  '''^frontend/[^/]+/test/.+_test\.dart$''',
  '''^backend/tests/.+\.py$''',
]

[[allowlists]]
description = "인프라 템플릿 테스트의 가짜 Secrets Manager ARN — AWS 문서용 계정 번호 123456789012 를 쓴 줄만, 인프라 테스트 안에서만(#3016)"
condition = "AND"
regexTarget = "line"
regexes = ['''arn:aws:secretsmanager:[a-z0-9-]+:123456789012:secret:''']
paths = ['''^infra/tests/.+\.py$''']

[[allowlists]]
description = "카카오·구글 로그인 테스트의 가짜 카카오 앱 키(#330) — 0~f 를 두 번 늘어놓은 이 값 하나만, 테스트·검사 스크립트 안에서만"
condition = "AND"
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']
paths = [
  '''^frontend/[^/]+/test/.+\.dart$''',
  '''^frontend/flutter/tool/test_[^/]+\.sh$''',
  '''^shared/[^/]+/test/.+\.dart$''',
  '''^tool/ci/test_[^/]+\.py$''',
]
